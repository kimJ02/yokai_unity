    if (p.birdDash) {
      const d = p.birdDash;
      d.t += dt;
      p.vx = d.dx * d.spd; p.vy = d.dy * d.spd;
      druidRaptorTouch(R.dmg);
      if (p.birdDash && d.t >= d.dur) {
        if (tier >= 4 && d.dy > 0.4 && p.y >= W.groundY - 40) druidRaptorSlam();
        p.birdDash = null;
        if (tier >= 2) p.dashTurnT = R.turnWindow;
      }
    } else {
      p.dashTurnT = Math.max(0, (p.dashTurnT || 0) - dt);
      const chained = tier >= 2 && p.dashTurnT > 0 && (mx !== 0 || my !== 0);
      if (chained) { p.atkCds.druid = 0; p.dashTurnT = 0; druidRaptorDash(0); }
      else {
        p.vx += (mx * R.flyMax - p.vx) * Math.min(1, dt * (R.flyAccel / R.flyMax));
        p.vy += (my * R.flyMax - p.vy) * Math.min(1, dt * (R.flyAccel / R.flyMax));
        if (held && p.atkCds.druid <= 0) { druidRaptorDash(0); p.atkCds.druid = 0.12; }
      }
    }
  } else {
    // ---- 인간형: 이동하며 클로 할퀴기 ----
    p.vx = mx * CONFIG.player.moveSpeed * statMs() * (p.shrineBuffT > 0 ? CONFIG.shrine.pMs : 1);
    if (held && p.atkCds.druid <= 0) druidClaw();
    if (p.jumpBufT > 0 && (p.onGround || p.coyoteT > 0)) {
      if (Input.has('down') && p.onGround && p.y < W.groundY - 2) { p.dropTimer = 0.22; p.vy = 140; p.onGround = false; }
      else { p.vy = CONFIG.player.jumpVel; p.onGround = false; sfx('jump'); }
      p.jumpBufT = 0; p.coyoteT = 0;
    }
    p.vy += W.gravity * dt;
    p.vy = Math.min(p.vy, 1500);
  }
  p.prevAttackHeld = held;
  if (mx !== 0 && p.onGround) p.walkCycle += dt * 11;

  // ---- 물리 ----
  const flying = !!p.morph;
  p.x = clamp(p.x + p.vx * dt, 24, run.mapW - 24);
  const prevY = p.y;
  p.y += p.vy * dt;
  p.onGround = false;
  if (flying) {
    p.y = clamp(p.y, 70, W.groundY);              // 비행 중엔 플랫폼을 통과한다
    if (p.y >= W.groundY) { p.y = W.groundY; p.vy = Math.min(p.vy, 0); }
  } else if (p.vy >= 0) {
    if (p.y >= W.groundY) { p.y = W.groundY; p.vy = 0; p.onGround = true; }
    else if (p.dropTimer <= 0) {
      for (const pl of platforms) {
        if (prevY <= pl.y && p.y >= pl.y && p.x > pl.x - 6 && p.x < pl.x + pl.w + 6) {
          p.y = pl.y; p.vy = 0; p.onGround = true; break;
        }
      }
    }
  }
  p.dropTimer -= dt;

  if (p.attacking) { p.attackT += dt; if (p.attackT >= p.attackDur) p.attacking = false; }
  druidUpdateWolves(dt);
}

/* ============================ Player 업데이트 ============================ */
function updatePlayer(dt) {
  const p = player, W = CONFIG.world;
  p.invuln -= dt; p.dropTimer -= dt;
  for (const wk in p.atkCds) p.atkCds[wk] -= dt;   // 무기별 쿨다운
  p.shrineBuffT = Math.max(0, p.shrineBuffT - dt);
  if (!p.ultActive) p.ultCd = Math.max(0, p.ultCd - dt);
  for (let i = p.afterimages.length - 1; i >= 0; i--) {
    p.afterimages[i].t += dt;
    if (p.afterimages[i].t > 0.25) p.afterimages.splice(i, 1);
  }
  // 비기 중에는 조작 잠금
  if (p.ultActive) { updateUlt(dt); return; }
  // 섬영: 관성 이동 전용 갱신
  if (meta.weapon === 'blade') { updateBladePlayer(dt); return; }
  // 드루이드: 마나/늑대/맹금 전용 갱신
  if (meta.weapon === 'druid') { updateDruidPlayer(dt); return; }

  {
    // ---- 현재 캐릭터의 Z 공격만 사용 ----
    const weapon = meta.weapon;

    // ---- X: 캐릭터 전용 스킬 / 비기 ----
    if (Input.just('ult')) tryUlt();

    // ---- 공격/스킬 (키가 곧 그 무기의 기술 — 수리검만 평타) ----
    const held = Input.has('atkBow') || Input.mouseAttack;
    const justAtk = Input.just('atkBow') || Input.just('attack');
    if (weapon === 'bow') {
      if (held && !p.attacking && p.atkCds.bow <= 0) {
        p.charging = true;
        p.chargeT = Math.min(CONFIG.bow.chargeMax, p.chargeT + dt);
      }
      if (!held && p.prevAttackHeld && p.charging) {
        const k = p.chargeT / CONFIG.bow.chargeMax;
        let aimX = (Input.has('right') ? 1 : 0) - (Input.has('left') ? 1 : 0);
        const aimY = (Input.has('down') ? 1 : 0) - (Input.has('up') ? 1 : 0);
        if (aimX === 0 && aimY === 0) aimX = p.facing;
        p.charging = false; p.chargeT = 0;
        bowFire(k, aimX, aimY);
      }
      if (!held) { p.charging = false; if (!p.attacking) p.chargeT = 0; }
    } else if (weapon === 'gunner') {
      if (!updateGunnerBeam(dt, held) && !p.attacking && p.atkCds.gunner <= 0 && (held || justAtk)) gunnerFire();
    }
    p.prevAttackHeld = held;

    // ---- 이동 ----
    const lockMove = p.attacking && !p.attackRapid;
    let mx = lockMove ? 0 : (Input.has('right') ? 1 : 0) - (Input.has('left') ? 1 : 0);
    if (mx !== 0) p.facing = mx;
    const chargeSlow = p.charging ? 0.5 : 1;
    const shrineMs = p.shrineBuffT > 0 ? CONFIG.shrine.pMs : 1;
    p.vx = mx * CONFIG.player.moveSpeed * statMs() * chargeSlow * shrineMs;
    if (mx !== 0 && p.onGround) p.walkCycle += dt * 11;

    // ---- 점프 (코요테 타임 + 선입력 버퍼) ----
    if (Input.just('jump')) p.jumpBufT = INPUT_BUF_T;
    p.jumpBufT = Math.max(0, (p.jumpBufT || 0) - dt);
    p.coyoteT = p.onGround ? COYOTE_T : Math.max(0, (p.coyoteT || 0) - dt);
    if (p.jumpBufT > 0 && !lockMove && (p.onGround || p.coyoteT > 0)) {
      if (Input.has('down') && p.onGround && p.y < W.groundY - 2) {
        p.dropTimer = 0.22; p.vy = 140; p.onGround = false;
      } else {
        p.vy = CONFIG.player.jumpVel; p.onGround = false; sfx('jump');
      }
      p.jumpBufT = 0; p.coyoteT = 0;
    }

    // ---- 물리 ----
    p.vy += W.gravity * dt;
    p.vy = Math.min(p.vy, 1500);
    p.x = clamp(p.x + p.vx * dt, 24, run.mapW - 24);
    const prevY = p.y;
    p.y += p.vy * dt;
    p.onGround = false;
    if (p.vy >= 0) {
      if (p.y >= W.groundY) { p.y = W.groundY; p.vy = 0; p.onGround = true; }
      else if (p.dropTimer <= 0) {
        for (const pl of platforms) {
          if (prevY <= pl.y && p.y >= pl.y && p.x > pl.x - 6 && p.x < pl.x + pl.w + 6) {
            p.y = pl.y; p.vy = 0; p.onGround = true; break;
          }
        }
      }
    }
  }

  // ---- 공격 애니메이션 진행 ----
  if (p.attacking) {
    p.attackT += dt;
    const k = p.attackT / p.attackDur;
    if (k >= 1) {
      p.attacking = false;
    }
  }
}

/* ============================ Projectiles ============================ */
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const w = projectiles[i];
    w.t += dt;
    if (w.t < 0) continue;
    let remove = false;
    switch (w.kind) {
      case 'arrow': {
        if (w.homing) {
          if (!w.target || w.target.dead || w.target.spawnInvuln > 0 || w.hitSet.has(w.target)) {
            let best = null, bestD = w.seekRange || 520;
            for (const e of enemies) {
              if (e.dead || e.spawnInvuln > 0 || w.hitSet.has(e)) continue;
              const tx = e.x - w.x, ty = (e.y - e.h / 2) - w.y;
              const d = Math.hypot(tx, ty);
              if (d < bestD) { best = e; bestD = d; }
            }
            w.target = best;
          }
          if (w.target && !w.target.dead) {
            const tx = w.target.x - w.x, ty = (w.target.y - w.target.h / 2) - w.y;
            const len = Math.hypot(tx, ty) || 1;
            const sp = Math.hypot(w.vx, w.vy) || 780;
            const steer = Math.min(1, dt * (w.turnRate || 9));
            w.vx = lerp(w.vx, tx / len * sp, steer);
            w.vy = lerp(w.vy || 0, ty / len * sp, steer);
          }
        }
        w.x += w.vx * dt;
        w.y += (w.vy || 0) * dt;
        if (w.gravityOrb) {
          let anchor = false;
          if (w.x < 24) { w.x = 24; anchor = true; }
          else if (w.x > run.mapW - 24) { w.x = run.mapW - 24; anchor = true; }
          if (w.y < 64) { w.y = 64; anchor = true; }
          else if (w.y >= CONFIG.world.groundY - 12) { w.y = CONFIG.world.groundY - 12; anchor = true; }
          if (anchor) {
            detonateGravityOrb(w.x, w.y, w.gravityCharge || 0);
            remove = true;
            break;
          }
        }
        if (!w.gravityOrb && w.explosive) {
          let impact = false;
          if (w.x < 24) { w.x = 24; impact = true; }
          else if (w.x > run.mapW - 24) { w.x = run.mapW - 24; impact = true; }
          if (w.y < 64) { w.y = 64; impact = true; }
          const gy = groundYBelow(w.x, Math.max(64, w.y - Math.abs(w.vy || 0) * dt - 8));
          if (w.y >= gy - 10) { w.y = gy - 10; impact = true; }
          if (impact) {
            spawnFireExplosion(w.x, w.y, w.explosionPower || 0.32);
            remove = true;
            break;
          }
        }
        if (w.bounceLeft > 0) {
          let bounced = false;
          const wallPad = 24;
          if (w.x < wallPad) {
            w.x = wallPad; w.vx = Math.abs(w.vx); bounced = true;
          } else if (w.x > run.mapW - wallPad) {
            w.x = run.mapW - wallPad; w.vx = -Math.abs(w.vx); bounced = true;
          }
          if (w.y < 64) {
            w.y = 64; w.vy = Math.abs(w.vy || 0); bounced = true;
          } else if (w.y > CONFIG.world.groundY - 8) {
            w.y = CONFIG.world.groundY - 8; w.vy = -Math.abs(w.vy || 0); bounced = true;
          }
          if (bounced) {
            w.bounceLeft--;
            w.hitSet = new Set();
            burst(w.x, w.y, 4, '#ffe9a0', { spd: 80, life: 0.25, size: 2.5 });
          }
        }
        for (const e of enemies) {
          if (e.dead || e.spawnInvuln > 0 || w.hitSet.has(e)) continue;
          const [ex, ey, ew, eh] = entRect(e);
          if (rectsOverlap(w.x - 20 * w.size, w.y - 15 * w.size, 40 * w.size, 30 * w.size, ex, ey, ew, eh)) {
            w.hitSet.add(e);
            if (w.gravityOrb) {
              detonateGravityOrb(w.x, w.y, w.gravityCharge || 0);
              remove = true;
              break;
            }
            const stacks = w.charged ? 2 : 1;
            dealDamage(e, w.dmg, { skill: true, element: w.element, stacks, kbDir: Math.sign(w.vx), kb: 140 });
            if (w.explosive && (w.charged || mageTier('move') >= 3)) {
              spawnFireExplosion(w.x, w.y, w.explosionPower || 0.32);
            }
            w.pierceLeft--;
            if (w.pierceLeft <= 0) { remove = true; }
            break;
          }
        }
        if (!w.inf && w.t >= w.life) {
          if (w.gravityOrb) detonateGravityOrb(w.x, w.y, w.gravityCharge || 0);
          remove = true;
        }
        if (!w.bounceLeft && (w.x < -80 || w.x > run.mapW + 80 || w.y < -80 || w.y > CONFIG.world.groundY + 80)) remove = true;
        break;
      }
      case 'bullet': {
        if (w.homing) {
          if (!w.target || w.target.dead || w.target.spawnInvuln > 0 || w.hitSet.has(w.target)) {
            let best = null, bestD = w.seekRange || 420;
            for (const e of enemies) {
              if (e.dead || e.spawnInvuln > 0 || w.hitSet.has(e)) continue;
              const d = Math.hypot(e.x - w.x, (e.y - e.h / 2) - w.y);
              if (d < bestD) { best = e; bestD = d; }
            }
            w.target = best;
          }
          if (w.target && !w.target.dead) {
            const tx = w.target.x - w.x, ty = (w.target.y - w.target.h / 2) - w.y;
            const len = Math.hypot(tx, ty) || 1;
            const sp = Math.hypot(w.vx, w.vy || 0) || 1320;
            const steer = Math.min(1, dt * (w.turnRate || 10));
            w.vx = lerp(w.vx, tx / len * sp, steer);
            w.vy = lerp(w.vy || 0, ty / len * sp, steer);
          }
        }
        w.x += w.vx * dt; w.y += (w.vy || 0) * dt;
        for (const e of enemies) {
          if (e.dead || e.spawnInvuln > 0 || w.hitSet.has(e)) continue;
          const [ex, ey, ew, eh] = entRect(e);
          if (rectsOverlap(w.x - 13 * w.size, w.y - 5 * w.size, 26 * w.size, 10 * w.size, ex, ey, ew, eh)) {
            w.hitSet.add(e);
            dealDamage(e, w.dmg, { skill: false, kbDir: Math.sign(w.vx), kb: 95, noHitstop: true });
            if (w.stackOnHit) addGunnerStack(w.stackOnHit);
            w.pierceLeft--;
            burst(w.x, w.y, 3, '#ffe9a0', { spd: 70, life: 0.18, size: 2.3 });
            if (w.pierceLeft <= 0) { remove = true; }
            break;
          }
        }
        if (w.t >= w.life || w.x < -60 || w.x > run.mapW + 60) remove = true;
        break;
      }
      case 'ebolt': { // 사수귀 화염탄 (적 소유)
        w.x += w.vx * dt; w.y += w.vy * dt;
        const [px2, py2, pw2, ph2] = entRect(player);
        if (rectsOverlap(w.x - 9, w.y - 9, 18, 18, px2, py2, pw2, ph2)) {
          damagePlayer(w.dmg, w.x);
          burst(w.x, w.y, 5, '#c86aff', { spd: 140, size: 3, life: 0.3 });
          remove = true;
        }
        if (Math.random() < dt * 25) burst(w.x, w.y, 1, '#c86aff', { spd: 20, rise: true, life: 0.3, size: 2.5 });
        if (w.t >= w.life || w.y > CONFIG.world.groundY + 20) remove = true;
        break;
      }
      case 'bossbolt': { // 보스 귀신불 (적 소유, 큼)
        w.x += w.vx * dt; w.y += w.vy * dt;
        const [px3, py3, pw3, ph3] = entRect(player);
        if (rectsOverlap(w.x - 15, w.y - 15, 30, 30, px3, py3, pw3, ph3)) {
          damagePlayer(w.dmg, w.x);
          burst(w.x, w.y, 10, '#ff6a4a', { spd: 200, size: 4, life: 0.4 });
          remove = true;
        }
        if (Math.random() < dt * 40) burst(w.x, w.y, 1, '#ff8a4a', { spd: 30, rise: true, life: 0.4, size: 3 });
        if (w.t >= w.life || w.y > CONFIG.world.groundY + 20 || w.x < -60 || w.x > run.mapW + 60) remove = true;
        break;
      }
    }
    if (remove) {
      projectiles.splice(i, 1);
    }
  }
  // 거대 수리검 재타격 타이머
}

/* ============================ Zones (폭발/중력/설치기) ============================ */
function updateZones(dt) {
  const fieldTurrets = mechanicFieldTurrets();
  if (fieldTurrets.length >= 2) {
    const tier = gunnerTier('conv');
    player.mechFieldTick = (player.mechFieldTick || 0) + dt;
    const tick = tier >= 5 ? 0.28 : 0.38;
    if (player.mechFieldTick >= tick) {
      player.mechFieldTick -= tick;
      const pts = mechanicFieldPoints(fieldTurrets);
      const segs = mechanicLinkSegments(pts);
      let hit = false;
      for (const e of enemies) {
        if (e.dead || e.spawnInvuln > 0) continue;
        const cy = e.y - e.h / 2;
        const onLink = segs.some(([a, b]) => distToSegment(e.x, cy, a, b) < 30 + tier * 3 + e.w * 0.25);
        const closedField = pts.length >= 3 && segs.length >= pts.length;
        const insideField = closedField && pointInPolygon(e.x, cy, pts);
        if (onLink || insideField) {
          hit = true;
          const linkBonus = onLink ? 0.08 : 0;
          const fieldBonus = insideField && pts.length >= 3 ? 0.06 : 0;
          dealDamage(e, 0.22 + tier * 0.05 + linkBonus + fieldBonus, { noCrit: true, noHitstop: true, kb: 0, skill: true, tickColor: '#8fd8ff' });
        }
      }
      if (hit) {
        const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
        const cy = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
        burst(cx, cy, 5, '#8fd8ff', { spd: 70, rise: true, life: 0.28, size: 2.8 });
      }
    }
  } else {
    player.mechFieldTick = 0;
  }
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    z.t += dt;
    if (z.dead) { zones.splice(i, 1); continue; }
    if (z.kind === 'flameBurst') {
      if (z.t >= z.life) zones.splice(i, 1);
    } else if (z.kind === 'gravityBurst') {
      if (z.t >= z.life) zones.splice(i, 1);
    } else if (z.kind === 'gravityWell') {
      const pullR = z.r + (z.stack || 1) * 18;
      const affected = [];
      for (const e of enemies) {
        if (e.dead || e.spawnInvuln > 0) continue;
        const cy = e.y - e.h / 2;
        const dx = z.x - e.x, dy = z.y - cy;
        const d = Math.hypot(dx, dy) || 1;
        if (d < pullR) {
          affected.push({ e, d, dx, dy });
          e.gravityExpose = (e.gravityExpose || 0) + dt * (1 + (z.stack || 1) * 0.16);
          if (e.gravityExpose >= 1.25) {
            e.vulnT = Math.max(e.vulnT || 0, 3.0);
          }
          if (!e.boss && !e.shrine) {
            const nearEase = clamp(1 - d / pullR, 0.12, 1);
            const force = z.pull * (0.45 + nearEase) * (1 + (z.stack || 1) * 0.18);
            e.x += dx / d * force * dt;
            e.y += dy / d * force * dt * 0.28;
            e.kbx = (e.kbx || 0) * 0.85;
          }
        }
      }
      z.dmgT = (z.dmgT || 0) + dt;
      const dmgTick = z.stack >= 4 ? 0.28 : 0.34;
      if (z.dmgT >= dmgTick) {
        z.dmgT -= dmgTick;
        for (const a of affected) {
          const nearBonus = clamp(1 - a.d / pullR, 0, 1) * 0.05;
          dealDamage(a.e, 0.045 + z.tier * 0.012 + (z.stack || 1) * 0.012 + nearBonus, { noCrit: true, noHitstop: true, kb: 0, skill: true, tickColor: a.e.vulnT > 0 ? '#f0c8ff' : '#c86aff' });
        }
      }
      z.tickT += dt;
      if (z.tickT >= 0.22) {
        z.tickT -= 0.22;
        burst(z.x + rand(-z.r * 0.22, z.r * 0.22), z.y + rand(-18, 18), 1, '#c86aff', { spd: 38, rise: true, life: 0.45, size: 2.8 });
      }
      if (z.t >= z.life) zones.splice(i, 1);
    } else if (z.kind === 'fireTrail') {
      z.tickT += dt;
      if (z.tickT >= z.tick) {
        z.tickT -= z.tick;
        for (const e of enemies) {
          if (e.dead || e.spawnInvuln > 0) continue;
          if (Math.hypot(e.x - z.x, (e.y - e.h / 2) - z.y) < z.r + e.w / 2) {
            applyElement(e, 'burn', z.stacks);
            dealDamage(e, z.dmg * z.power, { noCrit: true, noHitstop: true, kb: 0, skill: false, isBurnTick: true });
          }
        }
        if (Math.random() < 0.7) burst(z.x + rand(-z.r * 0.45, z.r * 0.45), z.y + rand(-10, 10), 2, '#ff9a4a', { spd: 42, rise: true, life: 0.55, size: 4 });
      }
      if (z.t >= z.life) zones.splice(i, 1);
    } else if (z.kind === 'turret') {
      z.tickT += dt;
      if (z.tickT >= z.tick) {
        z.tickT -= z.tick;
        for (const e of enemies) {
          if (e.dead || e.spawnInvuln > 0) continue;
          const d = Math.hypot(e.x - z.x, (e.y - e.h / 2) - (z.y - 18));
          if (d < z.range + e.w / 2) {
            dealDamage(e, z.dmg, { noCrit: true, noHitstop: true, kb: 0, skill: true, tickColor: '#8fd8ff' });
          }
        }
        burst(z.x + rand(-z.range * 0.45, z.range * 0.45), z.y - 18 + rand(-z.range * 0.22, z.range * 0.22), 2, '#8fd8ff', { spd: 42, rise: true, life: 0.28, size: 2.4 });
      }
      if (z.t >= z.life) zones.splice(i, 1);
    } else if (z.kind === 'laserDrone') {
      z.scanT -= dt;
      if (!z.target || z.target.dead || z.target.spawnInvuln > 0 || z.scanT <= 0) {
        z.target = null;
        z.scanT = 0.18;
        let bestD = z.range;
        for (const e of enemies) {
          if (e.dead || e.spawnInvuln > 0) continue;
          const d = Math.hypot(e.x - z.x, (e.y - e.h / 2) - z.y);
          if (d < bestD) { z.target = e; bestD = d; }
        }
      }
      const followX = player.x - player.facing * 56 + z.side * 42;
      const followY = player.y - 86 + Math.sin(state.time * 5 + z.side) * 9;
      z.x = lerp(z.x, followX, Math.min(1, dt * 4.2));
      z.y = lerp(z.y, followY, Math.min(1, dt * 4.2));
      z.tickT += dt;
      if (z.tickT >= z.tick) {
        z.tickT -= z.tick;
        let target = z.target && !z.target.dead && z.target.spawnInvuln <= 0 ? z.target : null;
        if (target) {
          const tx = target.x - z.x, ty = (target.y - target.h / 2) - z.y;
          const len = Math.hypot(tx, ty) || 1;
          const sp = 1240 + z.tier * 95;
          projectiles.push({
            kind: 'bullet',
            x: z.x,
            y: z.y,
            vx: tx / len * sp,
            vy: ty / len * sp,
            t: 0,
            life: 0.62,
            dmg: z.dmg,
            pierceLeft: z.tier >= 5 ? 3 : 2,
            size: z.tier >= 5 ? 1.45 : 1.12,
            laser: true,
            homing: z.tier >= 4,
            seekRange: z.range,
            turnRate: 11 + z.tier,
            stackOnHit: 0,
            hitSet: new Set(),
          });
          burst(z.x, z.y, 3, '#8fd8ff', { spd: 45, life: 0.18, size: 2.4 });
        }
      }
      if (z.t >= z.life) zones.splice(i, 1);
    }
  }
}

/* ============================ Enemies ============================ */
const ENEMY_COLORS = { wisp: { soul: '#8fd8ff' }, oni: { soul: '#ffb0a0' }, bigOni: { soul: '#b0c0ff' } };
function enemyLv() {
  // 몬스터 레벨은 지역(스테이지)에만 의존 — 한 스테이지 안에서는 오르지 않는다
  return clamp(regionBaseLv(run.region) + randInt(0, 1), 1, 40);
}
// 혼 강화 = 필드 상태 (몹 수·스폰 속도)
const effMaxEnemies = () => CONFIG.run.baseMax + itemAdd('mob');
const effWaveInterval = () => CONFIG.run.waveInterval / (1 + itemAdd('rate'));
/* 특정 지점(바닥/발판)에서 스폰. 스폰 보호(상호 무적) 포함 */
/* 지역별 몬스터 해금: 지역이 넘어갈수록 강력한 종이 추가된다 */
function rollSpawnType(region) {
  const roll = Math.random();
  if (region <= 1) return roll < 0.45 ? 'wisp' : 'oni';
  if (region === 2) return roll < 0.34 ? 'wisp' : roll < 0.70 ? 'oni' : 'charger';
  if (region === 3) return roll < 0.28 ? 'wisp' : roll < 0.56 ? 'oni' : roll < 0.80 ? 'charger' : 'shooter';
  return roll < 0.24 ? 'wisp' : roll < 0.48 ? 'oni' : roll < 0.68 ? 'charger' : roll < 0.85 ? 'shooter' : 'splitter';
}
function spawnEnemyAt(x, y, forceType, opts = {}) {
  const lv = enemyLv();
  let type = forceType;
  if (!type) {
    type = rollSpawnType(run.region);
    if (run.region >= 2 && lv >= 4 && Math.random() < 0.10) type = 'bigOni';
  }
  const base = CONFIG.enemyBase[type];
  // 요괴 유인향: 엘리트 출현률을 올린다
  const elite = !opts.noElite && Math.random() < CONFIG.elite.chance * (1 + itemPow('eliteLure'));
  // 체력·데미지는 '지역'당 지수 (레벨과 분리 — 레벨은 페널티 전용)
  const regExp = run.region - 1;
  const hpMul = Math.pow(CONFIG.scale.hpPerRegion, regExp) * rebirthWallHpMult(run.region) * (elite ? CONFIG.elite.hpMult : 1);
  const sizeMul = elite ? CONFIG.elite.scale : 1;
  enemies.push({
    type, base, lv, elite,
    x, y: type === 'wisp' ? y - 50 : y,
    w: base.w * sizeMul, h: base.h * sizeMul,
    hp: Math.round(base.hp * hpMul), maxHp: Math.round(base.hp * hpMul),
    dmg: Math.round(base.dmg * Math.pow(CONFIG.scale.dmgPerRegion, regExp) * rebirthWallDmgMult(run.region) * (elite ? CONFIG.elite.dmgMult : 1)),
    speed: base.speed * rand(0.9, 1.1),
    vx: 0, vy: 0, kbx: 0, flash: 0, dead: false,
    dir: Math.random() < 0.5 ? 1 : -1,
    seed: Math.random() * 100, wanderT: rand(1, 3),
    colors: ENEMY_COLORS[type] || ENEMY_COLORS.oni,
    spawnInvuln: opts.protect !== undefined ? opts.protect : CONFIG.run.spawnProtect,
    ai: { st: 'walk', t: 0, cd: rand(0.5, 1.5) },   // 돌진귀/사수귀 상태기계
    shootCd: rand(1.0, 2.0),
    burnS: 0, burnT: 0, bleedS: 0, bleedT: 0, vulnT: 0, gravityExpose: 0,
    grabbed: false, stormFall: false, fallVy: 0,
  });
}
/* 웨이브 스폰: 랜덤한 바닥/발판, 같은 웨이브끼리 겹치지 않게 */
function spawnWave(count) {
  const placed = [];
  let spawned = 0;
  const cap = effMaxEnemies();
  for (let n = 0; n < count; n++) {
    if (enemies.filter(e => !e.boss && !e.shrine).length + spawned >= cap) break;
    let ok = false, x = 0, y = 0;
    for (let attempt = 0; attempt < 10 && !ok; attempt++) {
      const pt = spawnPoints[randInt(0, spawnPoints.length - 1)];
      x = clamp(pt.x + rand(-pt.w / 2 + 26, pt.w / 2 - 26), 40, run.mapW - 40);
      y = pt.y;
      ok = true;
      for (const q of placed) {
        if (Math.abs(q.x - x) < 52 && Math.abs(q.y - y) < 12) { ok = false; break; }
      }
    }
    if (!ok) continue;
    placed.push({ x, y });
    spawnEnemyAt(x, y);
    spawned++;
  }
}
/* 성소: 적들에게 버프를 주는 구조물. 파괴 시 플레이어가 그 버프를 얻는다 */
function spawnShrine() {
  if (enemies.some(e => !e.dead && e.shrine)) return;
  const grounds = spawnPoints.filter(pt => pt.y === CONFIG.world.groundY);
  const pt = grounds[randInt(0, grounds.length - 1)] || spawnPoints[0];
  const lv = enemyLv();
  const hp = Math.round(CONFIG.shrine.hp * Math.pow(CONFIG.shrine.hpGrow, lv - 1));
  enemies.push({
    type: 'shrine', shrine: true, base: { exp: CONFIG.shrine.exp, gold: [CONFIG.shrine.gold, CONFIG.shrine.gold] }, lv,
    x: pt.x, y: pt.y, w: CONFIG.shrine.w, h: CONFIG.shrine.h,
    hp, maxHp: hp, dmg: 0, speed: 0,
    vx: 0, vy: 0, kbx: 0, flash: 0, dead: false, dir: 1, seed: Math.random() * 100, wanderT: 0,
    colors: { soul: '#ff8a6a' },
    spawnInvuln: 1.0,
    burnS: 0, burnT: 0, bleedS: 0, bleedT: 0, vulnT: 0, gravityExpose: 0,
    grabbed: false, stormFall: false, fallVy: 0,
  });
  toast('⛩ 요괴들의 성소가 나타났다 — 적들이 강해진다! 파괴하면 그 힘을 빼앗는다');
  sfx('bossroar');
}
function updateEnemies(dt) {
  const W = CONFIG.world;
  const buffed = run.shrineActive;
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt * 6);
    e.kbx *= Math.max(0, 1 - 9 * dt);
    // 스폰 보호: 상호 무적 — 움직이지도, 때리지도, 맞지도 않는다
    if (e.spawnInvuln > 0) { e.spawnInvuln -= dt; continue; }
    if (e.shrine) continue;   // 성소는 움직이지 않는 구조물
    // 칼날폭풍에 붙잡혔거나 놓여서 추락 중: 위치는 섬영 모듈이 제어 (AI·접촉 스킵)
    if (e.grabbed || e.stormFall) continue;
    if (e.boss) { updateBoss(e, dt); continue; }
    // 사슬에 끌려오는 중: 눈에 보이는 트윈 이동 (AI·접촉 스킵)
    if (e.pull) {
      const P = e.pull;
      P.t += dt;
      const q = easeOutCubic(Math.min(1, P.t / P.dur));
      e.x = lerp(P.fromX, P.toX, q);
      if (e.type === 'wisp') e.y = lerp(P.fromY, player.y - 40, q);
      if (Math.random() < dt * 40) burst(e.x, e.y - e.h / 2, 1, '#c8c8e8', { spd: 60, size: 2.5, life: 0.25 });
      if (P.t >= P.dur) { e.pull = null; e.kbx = 0; }
      continue;
    }

    const spd = e.speed * (buffed ? CONFIG.shrine.eMs : 1);
    const dx = player.x - e.x;
    if (e.type === 'wisp') {
      // 감지 범위 밖이면 제자리 부유
      if (Math.abs(dx) > 350) {
        e.vx = Math.sin(state.time * 0.8 + e.seed) * 22;
        e.y += Math.sin(state.time * 1.6 + e.seed) * 14 * dt;
      } else {
        e.vx = Math.sign(dx) * spd * (Math.abs(dx) > 40 ? 1 : 0.5);
        const targetY = player.y - 42 + Math.sin(state.time * 2.2 + e.seed) * 20;
        // y축 추적: 거리와 무관하게 일정한 저속 (가까워도 느려지지 않음)
        const dy = targetY - e.y;
        const yStep = CONFIG.wispYSpeed * dt;
        e.y += Math.abs(dy) <= yStep ? dy : Math.sign(dy) * yStep;
      }
      e.y = clamp(e.y, 90, W.groundY - 16);
      e.x += (e.vx + e.kbx) * dt;
      if (Math.random() < dt * 7) burst(e.x + rand(-8, 8), e.y - 10, 1, '#8fd8ff', { spd: 25, rise: true, life: 0.5, size: 2.5 });
    } else {
      // ---- 지상형: 유형별 이동 결정 ----
      let mvx = 0;
      if (e.type === 'charger') {
        // 돌진귀: 접근 → 예고 → 질주 → 지침
        const A = e.ai, C = CONFIG.charger;
        A.t -= dt; A.cd -= dt;
        const dyAbs = Math.abs(player.y - e.y);
        if (A.st === 'walk') {
          if (Math.abs(dx) < 300) e.dir = Math.sign(dx) || e.dir;
          mvx = e.dir * spd;
          if (A.cd <= 0 && Math.abs(dx) < C.aggroX && dyAbs < C.aggroY) {
            A.st = 'tele'; A.t = C.teleT;
            e.dir = Math.sign(dx) || e.dir;
          }
        } else if (A.st === 'tele') {
          mvx = 0;
          if (A.t <= 0) { A.st = 'charge'; A.t = C.chargeT; sfx('dash'); }
        } else if (A.st === 'charge') {
          mvx = e.dir * C.chargeSpd;
          if (Math.random() < dt * 22) burst(e.x - e.dir * 22, e.y - 4, 2, '#c8a888', { spd: 90, size: 3, life: 0.3 });
          if (A.t <= 0 || e.x < 60 || e.x > run.mapW - 60) { A.st = 'tired'; A.t = C.tiredT; }
        } else { // tired
          mvx = 0;
          if (A.t <= 0) { A.st = 'walk'; A.cd = C.cd; }
        }
      } else if (e.type === 'shooter') {
        // 사수귀: 거리 유지 + 도깨비 화염탄
        const S = CONFIG.shooter;
        e.shootCd -= dt;
        const adx = Math.abs(dx);
        if (adx < S.keepMin) mvx = -Math.sign(dx) * spd;
        else if (adx > S.keepMax) mvx = Math.sign(dx) * spd;
        else {
          e.dir = Math.sign(dx) || e.dir;
          if (e.shootCd <= 0) {
            e.shootCd = S.shootCd;
            const sx = e.x + e.dir * 14, sy = e.y - e.h * 0.6;
            const tx = player.x - sx, ty = (player.y - 30) - sy;
            const l = Math.hypot(tx, ty) || 1;
            projectiles.push({ kind: 'ebolt', x: sx, y: sy, vx: tx / l * S.boltSpd, vy: ty / l * S.boltSpd, t: 0, life: S.boltLife, dmg: e.dmg * (buffed ? CONFIG.shrine.eDmg : 1) });
            sfx('throw');
          }
        }
        if (mvx !== 0) e.dir = Math.sign(mvx);
      } else {
        // 오니·분열귀·새끼: 기본 보행 (감지 범위 축소 — 가까이 오기 전엔 배회)
        if (Math.abs(dx) < 300) { e.dir = Math.sign(dx) || e.dir; }
        else {
          e.wanderT -= dt;
          if (e.wanderT <= 0) { e.dir *= -1; e.wanderT = rand(1.5, 3.5); }
        }
        mvx = e.dir * spd;
      }
      e.vx = mvx;
      e.x += (e.vx + e.kbx) * dt;
      const prevY = e.y;
      e.vy += W.gravity * dt;
      e.y += e.vy * dt;
      // 바닥 + 발판 착지 (발판에서 스폰된 몹이 서 있을 수 있게)
      if (e.vy >= 0) {
        if (e.y >= W.groundY) { e.y = W.groundY; e.vy = 0; }
        else {
          for (const pl of platforms) {
            if (prevY <= pl.y && e.y >= pl.y && e.x > pl.x - 6 && e.x < pl.x + pl.w + 6) {
              e.y = pl.y; e.vy = 0; break;
            }
          }
        }
      }
      // 발판 위 몹은 가장자리에서 되돌아간다 — 내려오지 않는다
      if (e.vy === 0 && e.y < W.groundY - 2) {
        for (const pl of platforms) {
          if (Math.abs(e.y - pl.y) < 3 && e.x > pl.x - 12 && e.x < pl.x + pl.w + 12) {
            if (e.x < pl.x + 14) { e.x = pl.x + 14; e.dir = 1; }
            else if (e.x > pl.x + pl.w - 14) { e.x = pl.x + pl.w - 14; e.dir = -1; }
            else break;
            if (e.ai && e.ai.st === 'charge') { e.ai.st = 'tired'; e.ai.t = CONFIG.charger.tiredT; }
            break;
          }
        }
      }
      e.walk = (e.walk || 0) + dt * (e.type === 'charger' && e.ai.st === 'charge' ? 18 : 8);
    }
    e.x = clamp(e.x, 30, run.mapW - 30);

    if (player.invuln <= 0 && !player.ultActive) {
      const [ex, ey, ew, eh] = entRect(e);
      const [px, py, pw, ph] = entRect(player);
      const chargeMul = e.type === 'charger' && e.ai.st === 'charge' ? CONFIG.charger.dmgMult : 1;
      if (rectsOverlap(ex, ey, ew, eh, px, py, pw, ph)) damagePlayer(e.dmg * (buffed ? CONFIG.shrine.eDmg : 1) * chargeMul, e.x);
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

/* ============================ Boss ============================ */
function spawnBoss() {
  const r = run.region;
  const lv = regionBaseLv(r) + 2;
  const B = CONFIG.boss;
  const hp = Math.round(B.hpBase * Math.pow(B.hpGrow, r - 1) * rebirthWallHpMult(r));
  enemies.push({
    type: 'bigOni', boss: true, base: { exp: B.exp, gold: [B.gold, B.gold] }, lv,
    x: run.mapW * 0.62, y: CONFIG.world.groundY,
    w: B.w, h: B.h,
    hp, maxHp: hp,
    dmg: Math.round(B.dmgBase * Math.pow(B.dmgGrow, r - 1) * rebirthWallDmgMult(r)),
    speed: B.speed, vx: 0, vy: 0, kbx: 0, flash: 0, dead: false,
    dir: -1, seed: 0, wanderT: 0, walk: 0,
    colors: { soul: '#c86aff' }, tint: ONI_TINTS[r - 1],
    state: 'idle', stateT: 0.8, summoned: { p66: false, p33: false },
    burnS: 0, burnT: 0, bleedS: 0, bleedT: 0, vulnT: 0, gravityExpose: 0,
    grabbed: false, stormFall: false, fallVy: 0,
  });
  sfx('bossroar');
  shake(8, 0.5);
}
function updateBoss(b, dt) {
  const W = CONFIG.world;
  b.stateT -= dt;
  const dx = player.x - b.x;
  const adx = Math.abs(dx);
  // 페이즈 소환
  if (!b.summoned.p66 && b.hp < b.maxHp * 0.66) { b.summoned.p66 = true; bossSummon(b); }
  if (!b.summoned.p33 && b.hp < b.maxHp * 0.33) { b.summoned.p33 = true; bossSummon(b); }

  const highUp = player.y < W.groundY - CONFIG.boss.highY;   // 플레이어가 높은 플랫폼 위
  switch (b.state) {
    case 'idle':
      b.vx = 0;
      if (b.stateT <= 0) {
        b.dir = Math.sign(dx) || b.dir;
        if (highUp) { b.state = 'spitTele'; b.stateT = CONFIG.boss.spit.tele; sfx('bossroar'); }   // 플랫폼 위 → 원거리
        else if (adx < CONFIG.boss.slamRange) { b.state = 'slamTele'; b.stateT = 0.55; sfx('bossroar'); }
        else if (adx > 480 && Math.random() < 0.55) { b.state = 'chargeTele'; b.stateT = 0.5; }
        else { b.state = 'walk'; b.stateT = rand(0.7, 1.2); }
      }
      break;
    case 'walk':
      if (highUp) { b.state = 'idle'; b.stateT = 0.12; b.vx = 0; break; }   // 위로 도망가면 즉시 재판단
      b.dir = Math.sign(dx) || b.dir;
      b.vx = b.dir * b.speed;
      b.x += (b.vx + b.kbx) * dt;
      b.walk += dt * 6;
      // 근접하면 바로 슬램
      if (Math.abs(dx) < CONFIG.boss.slamRange * 0.7) { b.state = 'slamTele'; b.stateT = 0.5; b.vx = 0; sfx('bossroar'); }
      else if (b.stateT <= 0) { b.state = 'idle'; b.stateT = 0.25; }
      break;
    case 'slamTele':
      b.vx = 0;
      if (b.stateT <= 0) {
        b.state = 'slamRecover'; b.stateT = 0.7;
        // 내려찍기: 양방향 충격파
        shake(12, 0.35); sfx('boom');
        burst(b.x, W.groundY, 20, '#c8a888', { spd: 260, size: 5, life: 0.5 });
        for (const dir of [-1, 1]) {
          projectiles.push({ kind: 'shock', x: b.x + dir * 50, vx: dir * 430, t: 0, life: 0.95, dmg: b.dmg * 1.1, hitPlayer: false });
        }
        // 근접 즉시 판정 (세로범위 확대 — 낮은 발판 위도 커버)
        const [px, py, pw, ph] = entRect(player);
        if (rectsOverlap(b.x - 150, W.groundY - CONFIG.boss.slamH, 300, CONFIG.boss.slamH, px, py, pw, ph)) damagePlayer(b.dmg, b.x, 1.3);
      }
      break;
    case 'slamRecover':
      b.vx = 0;
      if (b.stateT <= 0) { b.state = 'idle'; b.stateT = rand(0.3, 0.7); }
      break;
    case 'spitTele':
      b.vx = 0;
      b.dir = Math.sign(dx) || b.dir;
      if (b.stateT <= 0) {
        // 귀신불 여러 발을 플레이어 방향으로 발사 (플랫폼 위 추적)
        const S = CONFIG.boss.spit;
        const sx = b.x + b.dir * 40, sy = b.y - b.h * 0.7;
        const baseA = Math.atan2((player.y - 30) - sy, player.x - sx);
        for (let i = 0; i < S.count; i++) {
          const a = baseA + (i - (S.count - 1) / 2) * S.spread;
          projectiles.push({ kind: 'bossbolt', x: sx, y: sy, vx: Math.cos(a) * S.spd, vy: Math.sin(a) * S.spd, t: 0, life: S.life, dmg: b.dmg * S.dmgMult });
        }
        burst(sx, sy, 12, '#c86aff', { spd: 200, size: 4, life: 0.5 });
        sfx('boom');
        b.state = 'spitRecover'; b.stateT = S.recover;
      }
      break;
    case 'spitRecover':
      b.vx = 0;
      if (b.stateT <= 0) { b.state = 'idle'; b.stateT = rand(0.2, 0.5); }
      break;
    case 'chargeTele':
      b.vx = 0;
      b.dir = Math.sign(dx) || b.dir;
      if (b.stateT <= 0) { b.state = 'charge'; b.stateT = 0.95; sfx('dash'); }
      break;
    case 'charge': {
      b.vx = b.dir * CONFIG.boss.chargeSpeed;
      b.x += b.vx * dt;
      b.walk += dt * 12;
      if (Math.random() < dt * 20) burst(b.x - b.dir * 40, W.groundY, 2, '#c8a888', { spd: 120, size: 4, life: 0.4 });
      const [px, py, pw, ph] = entRect(player);
      const [bx, by, bw, bh] = entRect(b);
      if (player.invuln <= 0 && !player.ultActive && rectsOverlap(bx, by, bw, bh, px, py, pw, ph)) {
        damagePlayer(b.dmg, b.x, 1.4);
      }
      if (b.x < 90 || b.x > run.mapW - 90 || b.stateT <= 0) { b.state = 'idle'; b.stateT = 0.8; shake(6, 0.2); }
      break;
    }
  }
  b.x = clamp(b.x, 80, run.mapW - 80);
  // 접촉 데미지 (평상시)
  if (b.state !== 'charge' && player.invuln <= 0 && !player.ultActive) {
    const [ex, ey, ew, eh] = entRect(b);
    const [px, py, pw, ph] = entRect(player);
    if (rectsOverlap(ex, ey, ew, eh, px, py, pw, ph)) damagePlayer(b.dmg, b.x);
  }
}

/* 아이템에서 오는 지속/시한부 효과 — 재생, 처치 버프 감쇠 */
function updateItemBuffs(dt) {
  const p = player;
  const rg = itemPow('regen');
  if (rg > 0 && p.hp > 0 && p.hp < p.maxHp) {
    p.regenAcc = (p.regenAcc || 0) + p.maxHp * rg * dt;
    if (p.regenAcc >= 1) {
      const heal = Math.floor(p.regenAcc);
      p.regenAcc -= heal;
      p.hp = Math.min(p.maxHp, p.hp + heal);
    }
  }
  run.killSpdT = Math.max(0, run.killSpdT - dt);
  if (run.killRageN > 0) {
    run.killRageT -= dt;
    if (run.killRageT <= 0) { run.killRageN = 0; run.killRageT = 0; }
  }
}
function updateRun(dt) {
  // 타이머 — 일반/보스 모두 시간제한이 있다. 시간 내에 못 잡으면 'timeout'으로 종료되고,
  // 보스 체력은 다음 시도 때 회복된 채로 다시 시작한다.
  run.timeLeft -= dt;
  if (run.timeLeft <= 0) { run.timeLeft = 0; endRun('timeout'); return; }
  run.shrineActive = enemies.some(e => !e.dead && e.shrine && e.spawnInvuln <= 0);
  updatePlayer(dt);
  updateEnemies(dt);
  updateElements(dt);
  updateProjectiles(dt);
  updateZones(dt);
  updateDruidFx(dt);
  updatePickups(dt);
  updateParticles(dt);
  updateDmgNumbers(dt);
  updateCombo(dt);
  updateCamera(dt);
  state.redFlash = Math.max(0, state.redFlash - dt * 2.2);
  run.chainT = Math.max(0, run.chainT - dt);
  updateItemBuffs(dt);
  // 웨이브 스폰
  if (run.mode === 'normal') {
    run.waveTimer -= dt;
    if (run.waveTimer <= 0) {
      run.waveTimer = effWaveInterval();
      spawnWave(CONFIG.run.waveSize);
    }
    // 성소 등장
    run.shrineTimer -= dt;
    if (run.shrineTimer <= 0) {
      run.shrineTimer = CONFIG.shrine.interval;
      spawnShrine();
    }
  } else {
    run.minionTimer -= dt;
    if (run.minionTimer <= 0) {
      run.minionTimer = CONFIG.run.minionInterval;
      if (enemies.filter(e => !e.boss).length < CONFIG.run.maxMinions) spawnWave(CONFIG.run.minionWave);
    }
  }
}
/* ============================ Pickups (경험치 구슬) ============================ */
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const o = pickups[i];
    o.t += dt;
    const d = Math.hypot(player.x - o.x, (player.y - 40) - o.y);
    if (d < CONFIG.orb.magnetR && d > 1) {
      // 자석처럼 끌려온다
      const v = 640 * dt;
      o.x += (player.x - o.x) / d * v;
      o.y += ((player.y - 40) - o.y) / d * v;
    } else {
      o.y = o.baseY + Math.sin(o.t * 3) * 8;
    }
    if (d < CONFIG.orb.collectR) {
      if (o.kind === 'exporb') {
        const exp = Math.max(10, Math.round(curExpNeed() * CONFIG.orb.expPct * expMultAll()));
        const leveled = gainExpMeta(exp);
        run.expEarned += exp;
        popDmg(player.x, player.y - 70, '+' + fmtNum(exp) + ' EXP', '#c9a2ff', 20);
        burst(o.x, o.y, 14, '#e8c9ff', { spd: 200, rise: true, life: 0.6 });
        sfx('levelup');
        if (leveled) {
          const b = $('banner');
          b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
          player.maxHp = statMaxHp(); player.hp = player.maxHp;
        }
      }
      pickups.splice(i, 1);
    }
  }
}

function drawProjectile(w) {

      ctx.quadraticCurveTo(fx - 2, -fh * 0.7, fx, -fh);

    ctx.strokeStyle = 'rgba(143,216,255,' + (0.45 + pulse * 0.28) + ')'; ctx.lineWidth = 2;

    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
  }

function drawGunnerBeam() {
  const b = player.gunnerBeam;
  if (!b) return;
  const sx = b.x - camera.x, sy = b.y;
  const ex = b.curve ? b.curve.ex - camera.x : sx + b.dx * b.range;
  const ey = b.curve ? b.curve.ey : sy + b.dy * b.range;
  const cx = b.curve ? b.curve.cx - camera.x : null;
  const cy = b.curve ? b.curve.cy : null;
  const pulse = 0.72 + 0.22 * Math.sin(state.time * 34 + b.t * 8);
  const beamPath = () => {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    if (b.curve) ctx.quadraticCurveTo(cx, cy, ex, ey);
    else ctx.lineTo(ex, ey);
  };
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(80,190,255,' + (0.16 + pulse * 0.12) + ')';
  ctx.lineWidth = b.width * 2.1;
  beamPath(); ctx.stroke();
  ctx.strokeStyle = 'rgba(143,240,255,' + (0.62 + pulse * 0.25) + ')';
  ctx.lineWidth = b.width;
  beamPath(); ctx.stroke();
  ctx.strokeStyle = 'rgba(248,255,255,' + (0.78 + pulse * 0.18) + ')';
  ctx.lineWidth = Math.max(2, b.width * 0.28);
  beamPath(); ctx.stroke();
  ctx.fillStyle = 'rgba(143,240,255,0.9)';
  ctx.beginPath(); ctx.arc(sx, sy, 5 + pulse * 2, 0, 7); ctx.fill();
  ctx.restore();
}

/* --- 섬영: 칼 한 자루를 그리는 헬퍼 (손잡이 → 날 → 빛) --- */
function drawBladeSword(len, glow, hot) {
  // +x 방향으로 뻗은 칼. 호출부에서 translate/rotate 해둔 상태로 들어온다.
  ctx.fillStyle = '#1a1f2a';                       // 손잡이
  ctx.fillRect(-7, -1.6, 8, 3.2);
  ctx.fillStyle = hot ? '#ffd76e' : '#9fdcff';     // 코등이
  ctx.fillRect(1, -4, 2.6, 8);
  // 날 — 끝으로 갈수록 얇아지는 사다리꼴
  ctx.beginPath();
  ctx.moveTo(3.6, -2.9);
  ctx.lineTo(len - 7, -2.1);
  ctx.lineTo(len, 0);
  ctx.lineTo(len - 7, 2.1);
  ctx.lineTo(3.6, 2.9);
  ctx.closePath();
  ctx.fillStyle = hot ? '#fff2c8' : '#eaf8ff';
  ctx.fill();
  ctx.strokeStyle = glow; ctx.lineWidth = 1.6; ctx.stroke();
  // 날 중심선
  ctx.strokeStyle = hot ? 'rgba(255,190,90,0.9)' : 'rgba(120,200,255,0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(len - 5, 0); ctx.stroke();
}

  const top = live && bladeAtTop();
  const S = CONFIG.blade.spin;

  // ---- 자세 보간값 (공중↔지상↔착지↔회전을 잇는다) ----
  const airK = live ? clamp(p.airK || 0, 0, 1) : 0;
  const landK = live && p.landT > 0 ? (p.landT / (p.landMax || 0.2)) * (p.landPow || 1) : 0;
  const spinPow = live ? clamp(p.spinPow || 0, 0, 1) : (opts.ghost ? 0.35 : 0);
  const spinAng = live || opts.ghost ? (p.spinAng || 0) : 0;
  const storming = live && !!p.storm;

  const walking = live && Math.abs(p.vx) > 20 && p.onGround;
  const bob = walking ? Math.sin(p.walkCycle * 2) * 1.4 : Math.sin(state.time * 2.2) * 0.7;
  // 착지하면 몸이 내려앉고, 공중이면 다리를 접는다
  const crouch = landK * 9;
  const legTuck = airK * 7;
  const legSwing = walking ? Math.sin(p.walkCycle) * 7 * (1 - airK) : 0;

  const cloth = opts.ghost ? 'rgba(180,225,255,0.75)' : '#232c3b';
  const clothLit = opts.ghost ? 'rgba(200,235,255,0.7)' : '#2f3c50';
  const sash  = opts.ghost ? 'rgba(140,220,255,0.7)'  : (top ? '#e8a94a' : '#3f7fa8');
  const trim  = opts.ghost ? 'rgba(235,250,255,0.85)' : (top ? '#ffe9a0' : '#8fe4ff');
  const skin  = opts.ghost ? 'rgba(225,245,255,0.9)'  : '#e8c39e';
  const glow  = top ? 'rgba(255,214,110,0.95)' : 'rgba(143,228,255,0.9)';
  const hair  = opts.ghost ? 'rgba(190,235,255,0.8)' : '#1b2733';

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(facing, 1);
  ctx.globalAlpha = alpha;
  // 속도로 앞으로 기울고, 활공 중엔 더 눕는다
  ctx.rotate(-ratio * 0.2 - (storming ? 0.3 : 0));

  const cy = -30 + crouch;   // 몸통 회전 중심 (칼이 도는 축)

  // ---- 최고 속도 오라 ----
  if (top && !opts.ghost) {
    const pulse = 0.6 + 0.4 * Math.sin(state.time * 12);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,190,80,' + (0.10 + pulse * 0.07) + ')';
    ctx.beginPath(); ctx.ellipse(0, cy, 34, 40, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // ---- 속도선 ----
  if (ratio > 0.3 && !opts.ghost) {
    ctx.strokeStyle = (top ? 'rgba(255,214,110,' : 'rgba(143,228,255,') + (ratio * 0.45) + ')';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const oy = -54 + i * 15, o = -16 - i * 5;
      ctx.beginPath(); ctx.moveTo(o, oy); ctx.lineTo(o - 18 - ratio * 34, oy); ctx.stroke();
    }
  }

  // ---- 회전 칼자국: 날 뒤로 끌리는 초승달 궤적 ----
  if (spinPow > 0.03 && !opts.ghost) {
    const R = S.r * (storming ? 1.12 : 1);
    ctx.save();
    ctx.translate(0, cy);
    // 채워진 초승달을 겹쳐 꼬리로 갈수록 얇고 옅게 만든다 (둥근 선 끝이 만드는 '구슬' 방지)
    // 칼끝 근처만 얇게 — 폭이 넓으면 파이 조각이 되어 캐릭터를 가린다
    const layers = [
      { span: 1.30, inner: 0.70, a: 0.10 },
      { span: 0.78, inner: 0.79, a: 0.16 },
      { span: 0.36, inner: 0.88, a: 0.30 },
    ];
    for (let s = 0; s < 2; s++) {
      const base = spinAng + s * BLADE_SWORD_SEP;
      for (const L of layers) {
        ctx.fillStyle = (top ? 'rgba(255,205,95,' : 'rgba(126,214,255,') + (L.a * spinPow) + ')';
        ctx.beginPath();
        ctx.arc(0, 0, R, base - L.span, base);
        ctx.arc(0, 0, R * L.inner, base, base - L.span, true);
        ctx.closePath();
        ctx.fill();
      }
      // 날 끝을 따라가는 밝은 섬광
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = (top ? 'rgba(255,246,214,' : 'rgba(238,252,255,') + (0.85 * spinPow) + ')';
      ctx.lineWidth = 2.6; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.97, base - 0.9, base); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ---- 다리 ----
  ctx.fillStyle = '#161b24';
  ctx.save();
  ctx.translate(0, -legTuck);
  ctx.fillRect(-7 + legSwing, -14 + legTuck * 0.5, 6, 13 - legTuck * 0.45);
  ctx.fillRect(1 - legSwing, -14 + legTuck * 0.5, 6, 13 - legTuck * 0.45);
  ctx.fillStyle = trim;
  ctx.fillRect(-7 + legSwing, -3 + legTuck * 0.2, 6, 2);
  ctx.fillRect(1 - legSwing, -3 + legTuck * 0.2, 6, 2);
  ctx.restore();

  // ---- 나부끼는 천 (속도·공중에서 더 크게) ----
  const flow = 0.3 + ratio * 0.5 + airK * 0.2;   // 과하면 천이 캐릭터보다 커진다
  ctx.fillStyle = sash;
  ctx.globalAlpha = alpha * 0.85;
  ctx.beginPath();
  ctx.moveTo(-8, -42 + bob + crouch);
  ctx.quadraticCurveTo(-24 - flow * 16, -40 + bob - flow * 9, -18 - flow * 24, -14 + bob + flow * 6);
  ctx.quadraticCurveTo(-16, -26 + bob, -8, -24 + bob + crouch);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = alpha;

  // ---- 몸통 ----
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(-10, -44 + bob + crouch); ctx.lineTo(10, -44 + bob + crouch);
  ctx.lineTo(12, -14); ctx.lineTo(-12, -14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = clothLit;                       // 앞섶 하이라이트
  ctx.beginPath();
  ctx.moveTo(2, -44 + bob + crouch); ctx.lineTo(10, -44 + bob + crouch);
  ctx.lineTo(12, -14); ctx.lineTo(4, -14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.6;     // 옷깃 라인
  ctx.beginPath(); ctx.moveTo(-6, -44 + bob + crouch); ctx.lineTo(1, -26 + crouch); ctx.stroke();
  ctx.fillStyle = sash;                            // 허리띠
  ctx.fillRect(-11, -26 + bob + crouch, 22, 5);
  ctx.fillStyle = trim;
  ctx.fillRect(-11, -26 + bob + crouch, 22, 1.4);

  // ---- 머리 ----
  const hx = 1, hy = -52 + bob + crouch;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(hx, hy, 6.6, 0, 7); ctx.fill();
  ctx.fillStyle = hair;                            // 뒤로 날리는 머리
  ctx.beginPath();
  ctx.arc(hx, hy - 1, 6.9, Math.PI * 0.88, Math.PI * 2.12);
  ctx.lineTo(hx - 10 - flow * 12, hy - 4 - flow * 5);
  ctx.lineTo(hx - 7, hy + 2);
  ctx.closePath(); ctx.fill();
  if (!opts.ghost) {
    ctx.fillStyle = trim;                          // 머리띠 + 뒤로 흐르는 끈
    ctx.fillRect(hx - 8, hy - 3, 16, 2.2);
    ctx.strokeStyle = trim; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 8, hy - 2);
    ctx.quadraticCurveTo(hx - 20 - flow * 14, hy - 6 - flow * 6, hx - 26 - flow * 24, hy + 4);
    ctx.stroke();
    // 빛나는 눈
    ctx.fillStyle = top ? '#ffe9a0' : '#7de8ff';
    ctx.beginPath(); ctx.arc(hx + 3.4, hy + 0.6, 1.7, 0, 7); ctx.fill();
  }

  // ---- 쌍칼: 회전 자세와 대기 자세를 spinPow로 섞는다 ----
  const armLen = S.arm;
  const bladeLen = S.len;
  ctx.lineCap = 'round';
  for (let s = 0; s < 2; s++) {
    // 회전각은 항상 spinAng 기준(멈추면 대기 각도로 정렬됨).
    // 대기 상태에서만 뒷칼을 살짝 벌려 자연스러운 이도류 자세를 만든다.
    const restTweak = s === 1 ? 0.34 : -0.16;
    const a = spinAng + s * BLADE_SWORD_SEP + (1 - spinPow) * restTweak;
    const reach = armLen * (0.72 + 0.28 * spinPow);
    const hxp = Math.cos(a) * reach, hyp = cy + Math.sin(a) * reach;
    // 팔
    ctx.strokeStyle = skin; ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(s === 0 ? 4 : -4, cy - 8 + bob * 0.5);
    ctx.lineTo(hxp, hyp);
    ctx.stroke();
    // 손목 보호대 + 칼을 쥔 손 (칼자루와 팔을 시각적으로 잇는다)
    ctx.strokeStyle = sash; ctx.lineWidth = 5.4;
    ctx.beginPath();
    ctx.moveTo(hxp - Math.cos(a) * 7, hyp - Math.sin(a) * 7);
    ctx.lineTo(hxp - Math.cos(a) * 2, hyp - Math.sin(a) * 2);
    ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(hxp, hyp, 3.1, 0, 7); ctx.fill();
    // 칼
    ctx.save();
    ctx.translate(hxp, hyp);
    ctx.rotate(a);
    drawBladeSword(bladeLen, glow, top);
    ctx.restore();
  }
  ctx.restore();

  // ---- 착지 충격 링 (월드 좌표, 캐릭터 기울기 영향 없이) ----
  if (landK > 0.25 && !opts.ghost) {
    ctx.save();
    ctx.globalAlpha = alpha * landK * 0.7;
    ctx.strokeStyle = top ? '#ffd76e' : '#bfe8ff';
    ctx.lineWidth = 2.4;
    const rr = 20 + (1 - landK) * 46;
    ctx.beginPath(); ctx.ellipse(px, py - 2, rr, rr * 0.32, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
}
/* 집중 궤적 */
function drawBladeTrail() {
  const p = player;
  if (meta.weapon !== 'blade' || state.scene !== 'run' || !p.trailPts || p.trailPts.length < 2) return;
  const fade = p.trailT > 0 ? 1 : 0.75;
  const wide = 26 * (bladeTrailR() / CONFIG.blade.focus.trailR);   // 3층에서 굵어진 판정을 눈에도 보이게
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(143,228,255,' + (0.22 * fade) + ')';
  ctx.lineWidth = wide;
  ctx.beginPath();
  ctx.moveTo(p.trailPts[0].x - camera.x, p.trailPts[0].y);
  for (let i = 1; i < p.trailPts.length; i++) ctx.lineTo(p.trailPts[i].x - camera.x, p.trailPts[i].y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(215,245,255,' + (0.85 * fade) + ')';
  ctx.lineWidth = 3.4;
  ctx.stroke();
  ctx.restore();
}
/* --- 드루이드: 클로를 낀 야성 전사, 2계열은 맹금으로 변한다 --- */
function drawDruid(px, py, facing, opts = {}) {
  const p = player;
  const alpha = opts.alpha !== undefined ? opts.alpha : 1;
  const inRun = state.scene === 'run';
  const live = inRun && !opts.ghost;
  const bird = live && !!p.morph;
  const walking = live && Math.abs(p.vx) > 20 && p.onGround;
  const bob = walking ? Math.sin(p.walkCycle * 2) * 1.5 : Math.sin(state.time * 2.2) * 0.8;
  const legSwing = walking ? Math.sin(p.walkCycle) * 8 : 0;
  const manaK = live ? clamp((p.mana || 0) / Math.max(1, druidManaMax()), 0, 1) : 0.5;

  const hide  = opts.ghost ? 'rgba(190,225,200,0.75)' : '#3f6b4a';   // 가죽 갑주 (부족 느낌의 녹갈)
  const hideD = opts.ghost ? 'rgba(150,195,165,0.7)'  : '#26402e';   // 그늘진 면
  const hideL = opts.ghost ? 'rgba(215,240,222,0.75)' : '#54855f';   // 빛 받는 면
  // 모피는 어둡게 — 밝으면 녹색 본체보다 눈에 띄어 실루엣이 갈색 덩어리로 읽힌다
  const pelt  = opts.ghost ? 'rgba(215,235,220,0.7)'  : '#6b5f48';   // 어깨 모피
  const peltD = opts.ghost ? 'rgba(180,205,190,0.7)'  : '#493f2f';
  const trim  = opts.ghost ? 'rgba(235,255,240,0.85)' : '#8fe0b0';   // 주술 문양 (마나색)
  const skin  = opts.ghost ? 'rgba(225,245,230,0.9)'  : '#7fa86a';   // 오크 피부
  const skinD = opts.ghost ? 'rgba(195,225,205,0.85)' : '#5c7f4c';
  const hair  = opts.ghost ? 'rgba(180,205,190,0.8)'  : '#2b2620';
  const claw  = '#f2f7e8';
  const eye   = '#ffe07a';

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(facing, 1);
  ctx.globalAlpha = alpha;

  // 마나 오라 — 많이 찰수록 짙어진다
  if (manaK > 0.05 && !opts.ghost) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(90,220,150,' + (0.03 + manaK * 0.09) + ')';
    ctx.beginPath(); ctx.ellipse(0, -30, 24 + manaK * 12, 32 + manaK * 12, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  if (bird) {
    // ---- 맹금 형태 ----
    const dashing = live && !!p.birdDash;
    const d = dashing ? p.birdDash : null;
    const dashAng = dashing ? Math.atan2(d.dy, Math.abs(d.dx) < 0.001 ? 0.001 : Math.abs(d.dx)) : 0;
    const D = dashing ? 1 : 0;
    const flap = dashing ? -0.55 : Math.sin(state.time * 16) * 0.5;
    ctx.save();
    ctx.rotate(dashAng * 0.85);
    ctx.fillStyle = hide;
    ctx.beginPath(); ctx.ellipse(D * 4, -30 + bob, 13 + D * 9, 20 - D * 7, D * 0.35, 0, 7); ctx.fill();
    ctx.strokeStyle = trim; ctx.lineWidth = 1.6; ctx.stroke();
    for (const dir of [-1, 1]) {
      ctx.save(); ctx.translate(0, -36 + bob + D * 6);
      ctx.rotate(dir * (0.5 + flap) * (dir > 0 ? 1 : -1));
      ctx.fillStyle = dir > 0 ? pelt : hideD;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      if (dashing) {
        ctx.quadraticCurveTo(dir * 14 - 16, -6, dir * 20 - 30, 10);
        ctx.quadraticCurveTo(dir * 12 - 12, 6, 0, 8);
      } else {
        ctx.quadraticCurveTo(dir * 34, -16, dir * 52, 4);
        ctx.quadraticCurveTo(dir * 30, 8, 0, 10);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = trim; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = pelt;
    ctx.beginPath();
    ctx.moveTo(-6 - D * 6, -14 + bob); ctx.lineTo(-22 - D * 12, -2 + bob - D * 12); ctx.lineTo(2 - D * 6, -12 + bob);
    ctx.closePath(); ctx.fill();
    const bx = D * 16, by = D * 16;
    ctx.fillStyle = hide;
    ctx.beginPath(); ctx.arc(4 + bx, -52 + bob + by, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = trim; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#ffcf6e';
    ctx.beginPath();
    ctx.moveTo(10 + bx, -53 + bob + by); ctx.lineTo(20 + bx + D * 8, -49 + bob + by); ctx.lineTo(10 + bx, -47 + bob + by);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = eye;
    ctx.beginPath(); ctx.arc(7 + bx, -54 + bob + by, 2, 0, 7); ctx.fill();
    ctx.restore();
    if (dashing && !opts.ghost) {
      ctx.strokeStyle = 'rgba(200,240,215,0.55)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const oy = -44 + i * 14;
        ctx.beginPath(); ctx.moveTo(-16 - i * 5, oy); ctx.lineTo(-44 - i * 12, oy); ctx.stroke();
      }
    }
  } else {
    // ---- 인간형: 클로를 낀 오크 주술 전사 ----
    const swinging = live && p.attacking;
    const k = swinging ? clamp(p.attackT / p.attackDur, 0, 1) : 0;
    // 콤보 단계별 스윙 데이터 — 3타(피니셔)는 더 크게 감고 더 멀리 휘두른다
    const cc = CONFIG.druid.claw.combo[p.druidComboIdx || 0];
    const finisherPose = swinging && (p.druidComboIdx || 0) >= CONFIG.druid.claw.combo.length - 1;
    const rScale = (cc.r || 34) / 34;
    // 뒤로 당겼다가 앞으로 후려친다
    const sw = swinging ? (k < 0.3 ? -k / 0.3 * 0.5 : (k - 0.3) / 0.7) : 0;
    const ease = sw < 0 ? sw : 1 - Math.pow(1 - sw, 3);
    const lunge = swinging ? Math.max(0, ease) * cc.step : 0;
    const lean = swinging ? Math.max(0, ease) * (finisherPose ? 0.2 : 0.12) : 0;

    ctx.save();
    ctx.translate(lunge, 0);
    ctx.rotate(-lean);

    // ── 뒤로 늘어진 모피 망토 (몸 뒤 레이어)
    const flow = 0.4 + Math.abs(p.vx || 0) / 400 + (swinging ? Math.max(0, ease) * 0.5 : 0);
    ctx.fillStyle = peltD;
    ctx.beginPath();
    ctx.moveTo(-9, -47 + bob);
    ctx.quadraticCurveTo(-20 - flow * 6, -40 + bob, -16 - flow * 7, -16 + bob);
    ctx.quadraticCurveTo(-13, -28 + bob, -9, -26 + bob);
    ctx.closePath(); ctx.fill();

    // ── 다리 (허벅지 → 정강이 → 발) : 사각형 대신 관절을 준다
    for (const [lx, sgn] of [[-6, 1], [3, -1]]) {
      const off = legSwing * sgn * 0.5;
      ctx.strokeStyle = hideD; ctx.lineWidth = 6.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lx, -22);
      ctx.lineTo(lx + off * 0.4, -12);
      ctx.lineTo(lx + off, -2);
      ctx.stroke();
      ctx.fillStyle = hideD;                                  // 발
      ctx.beginPath(); ctx.ellipse(lx + off + 1.5, -1.5, 4.5, 2.6, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = pelt; ctx.lineWidth = 2.4;            // 정강이 각반
      ctx.beginPath(); ctx.moveTo(lx + off * 0.5, -13); ctx.lineTo(lx + off * 0.8, -8); ctx.stroke();
    }

    // ── 허리 두르개 : 갈래 사이에 틈을 둬야 한 덩어리로 뭉치지 않는다
    for (let i = -1; i <= 1; i++) {
      const sx = i * 7.5;
      ctx.fillStyle = i === 0 ? pelt : peltD;
      ctx.beginPath();
      ctx.moveTo(sx - 3.4, -27 + bob);
      ctx.lineTo(sx + 3.4, -27 + bob);
      ctx.lineTo(sx + 2.2, -15 + Math.abs(i) * 2);
      ctx.lineTo(sx - 2.2, -15 + Math.abs(i) * 2);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = hideD; ctx.fillRect(-12, -29 + bob, 24, 4);   // 허리띠
    ctx.fillStyle = trim;                                         // 버클(주술석)
    ctx.beginPath(); ctx.arc(0, -27 + bob, 2.6, 0, 7); ctx.fill();

    // ── 몸통 : 어깨 넓고 허리로 좁아지는 역삼각 실루엣
    ctx.fillStyle = hide;
    ctx.beginPath();
    ctx.moveTo(-13, -47 + bob);
    ctx.quadraticCurveTo(-15, -38 + bob, -10, -28 + bob);
    ctx.lineTo(10, -28 + bob);
    ctx.quadraticCurveTo(15, -38 + bob, 13, -47 + bob);
    ctx.closePath(); ctx.fill();
    // 명암: 앞쪽은 밝게, 뒤쪽은 어둡게
    ctx.fillStyle = hideL;
    ctx.beginPath();
    ctx.moveTo(3, -47 + bob);
    ctx.quadraticCurveTo(14, -38 + bob, 12, -28 + bob);
    ctx.lineTo(4, -28 + bob);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hideD;
    ctx.beginPath();
    ctx.moveTo(-13, -47 + bob);
    ctx.quadraticCurveTo(-15, -38 + bob, -10, -28 + bob);
    ctx.lineTo(-6, -28 + bob);
    ctx.lineTo(-8, -47 + bob);
    ctx.closePath(); ctx.fill();
    // 가슴 주술 문양 (번개형)
    ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-3, -43 + bob); ctx.lineTo(1, -38 + bob); ctx.lineTo(-2, -36 + bob); ctx.lineTo(1, -31 + bob);
    ctx.stroke();

    // ── 어깨 견갑 : 낮고 옆으로 퍼지게 (위로 솟으면 머리를 삼킨다)
    for (const [sx, sc, dark] of [[-12, -1, true], [12, 1, false]]) {
      ctx.save();
      ctx.translate(sx, -42 + bob);
      ctx.scale(sc, 1);
      ctx.fillStyle = dark ? peltD : pelt;                    // 모피 덩어리
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 5.5, 0.15, 0, 7); ctx.fill();
      // 아래로 늘어지는 털단 (위로 솟는 스파이크 대신)
      ctx.strokeStyle = dark ? peltD : pelt; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const ox = -3 + i * 3.5;
        ctx.beginPath(); ctx.moveTo(ox, 3); ctx.lineTo(ox - 1, 8 + (i % 2) * 2); ctx.stroke();
      }
      ctx.fillStyle = dark ? hideD : hide;                    // 골각 판
      ctx.beginPath(); ctx.ellipse(1, -1, 5, 3.4, 0.15, 0, 7); ctx.fill();
      ctx.strokeStyle = trim; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(1, -1, 2.6, 0.4, 3.2); ctx.stroke();
      ctx.restore();
    }

    // ── 머리 : 각진 오크 두상 + 엄니
    const hx = 1, hy = -55 + bob;
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.moveTo(hx - 6.5, hy - 4);
    ctx.quadraticCurveTo(hx - 1, hy - 9, hx + 6, hy - 5);      // 이마
    ctx.quadraticCurveTo(hx + 8.5, hy + 1, hx + 5, hy + 5);    // 광대 → 턱
    ctx.quadraticCurveTo(hx - 1, hy + 8, hx - 6, hy + 3);      // 아래턱
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = skinD;                                     // 뒤통수 그늘
    ctx.beginPath();
    ctx.moveTo(hx - 6.5, hy - 4);
    ctx.quadraticCurveTo(hx - 8, hy + 1, hx - 6, hy + 3);
    ctx.lineTo(hx - 2, hy + 4); ctx.lineTo(hx - 3, hy - 6);
    ctx.closePath(); ctx.fill();
    // 아래턱 엄니 두 개 — 오크의 핵심 실루엣
    ctx.fillStyle = '#f4f1e4';
    ctx.beginPath();
    ctx.moveTo(hx + 3.5, hy + 4.5); ctx.lineTo(hx + 4.8, hy - 1.5); ctx.lineTo(hx + 6, hy + 4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx - 2, hy + 5); ctx.lineTo(hx - 1, hy + 0.5); ctx.lineTo(hx + 0.4, hy + 5);
    ctx.closePath(); ctx.fill();
    // 뾰족 귀
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.moveTo(hx - 5, hy - 1); ctx.lineTo(hx - 11, hy - 5); ctx.lineTo(hx - 5, hy + 2);
    ctx.closePath(); ctx.fill();
    // 땋은 머리(뒤로 늘어짐)
    ctx.strokeStyle = hair; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 4, hy - 2);
    ctx.quadraticCurveTo(hx - 14, hy + 4, hx - 12 - flow * 3, hy + 16);
    ctx.stroke();
    ctx.strokeStyle = trim; ctx.lineWidth = 1.4;               // 땋은 매듭
    ctx.beginPath(); ctx.moveTo(hx - 10, hy + 6); ctx.lineTo(hx - 12, hy + 8); ctx.stroke();
    // 이마 띠 + 깃털 두 개
    ctx.fillStyle = hideD;
    ctx.beginPath();
    ctx.moveTo(hx - 7, hy - 3.5); ctx.lineTo(hx + 6.5, hy - 5); ctx.lineTo(hx + 6.5, hy - 2.5); ctx.lineTo(hx - 7, hy - 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trim;
    ctx.beginPath(); ctx.arc(hx + 1, hy - 3.2, 1.6, 0, 7); ctx.fill();
    // 깃털은 뒤로 눕혀야 뿔처럼 안 보인다
    for (const [fa, fl] of [[-2.5, 14], [-2.15, 10]]) {
      ctx.strokeStyle = pelt; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(hx - 5, hy - 3);
      ctx.quadraticCurveTo(hx - 5 + Math.cos(fa) * fl * 0.5, hy - 3 + Math.sin(fa) * fl * 0.9,
                           hx - 4 + Math.cos(fa) * fl, hy - 3 + Math.sin(fa) * fl);
      ctx.stroke();
    }
    // 눈 — 사납게 찢어진 눈
    if (!opts.ghost) {
      ctx.fillStyle = eye;
      ctx.beginPath(); ctx.ellipse(hx + 3.4, hy - 0.6, 2.4, 1.4, -0.2, 0, 7); ctx.fill();
      ctx.strokeStyle = skinD; ctx.lineWidth = 1.4;            // 눈두덩 능선
      ctx.beginPath(); ctx.moveTo(hx + 0.5, hy - 3.4); ctx.lineTo(hx + 6, hy - 2.2); ctx.stroke();
      if (swinging) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,224,122,0.5)';
        ctx.beginPath(); ctx.arc(hx + 3.4, hy - 0.6, 5, 0, 7); ctx.fill();
        ctx.restore();
      }
    }

    // ── 양손 클로 건틀릿
    const armAng = swinging ? (cc.a0 + Math.max(0, ease) * (cc.a1 - cc.a0) + (sw < 0 ? sw * 0.7 : 0)) : 0.30;
    for (const side of [1, 0]) {                               // 뒷손 먼저 그려 앞손이 위로 오게
      const a = armAng - side * 0.42;
      const shx = side ? -3 : 5, shy = -42 + bob;
      const reach = 12 + (swinging ? Math.max(0, ease) * 7 * rScale : 3);
      const ex = shx + Math.cos(a - 0.3) * reach * 0.55, ey = shy + Math.sin(a - 0.3) * reach * 0.55;
      const hxp = shx + Math.cos(a) * reach, hyp = shy + Math.sin(a) * reach;
      // 팔 (위팔 → 아래팔, 팔꿈치 꺾임)
      ctx.strokeStyle = side ? skinD : skin;
      ctx.lineWidth = side ? 4.6 : 5.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(ex, ey); ctx.lineTo(hxp, hyp); ctx.stroke();
      // 팔찌
      ctx.strokeStyle = side ? peltD : pelt; ctx.lineWidth = 5.2;
      ctx.beginPath();
      ctx.moveTo(hxp - Math.cos(a) * 7, hyp - Math.sin(a) * 7);
      ctx.lineTo(hxp - Math.cos(a) * 3.5, hyp - Math.sin(a) * 3.5);
      ctx.stroke();
      ctx.save();
      ctx.translate(hxp, hyp); ctx.rotate(a);
      // 건틀릿 본체 (금속판 + 리벳)
      ctx.fillStyle = side ? hideD : hide;
      ctx.beginPath();
      ctx.moveTo(-5, -4); ctx.lineTo(4, -3.6); ctx.lineTo(5, 3.6); ctx.lineTo(-5, 4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = trim; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = trim;
      ctx.beginPath(); ctx.arc(-1.5, 0, 1.2, 0, 7); ctx.fill();
      // 발톱 세 개 — 몸집 대비 과하지 않게 (끝 11px)
      for (let c = -1; c <= 1; c++) {
        const cy0 = c * 2.6;
        ctx.fillStyle = side ? '#d9dcc9' : claw;
        ctx.beginPath();
        ctx.moveTo(4, cy0 - 1.5);
        ctx.quadraticCurveTo(8.5, cy0 - 1.2 + c * 0.5, 11.5, cy0 + c * 1.5);
        ctx.quadraticCurveTo(8, cy0 + 1.1 + c * 0.4, 4, cy0 + 1.5);
        ctx.closePath(); ctx.fill();
      }
      // 마나가 찰수록 발톱 끝에 주술 빛
      if (!opts.ghost && !side) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(143,224,176,' + (0.2 + manaK * 0.35) + ')';
        ctx.lineWidth = 1.4;
        for (let c = -1; c <= 1; c++) {
          ctx.beginPath(); ctx.moveTo(6, c * 2.6); ctx.lineTo(11, c * 2.6 + c * 1.4); ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.restore();
    // 할퀸 궤적 — 세 줄 발톱 자국 (피니셔는 더 굵고 밝게, 바깥쪽에 흰 궤적이 하나 더 붙는다)
    if (swinging && sw > 0 && !opts.ghost) {
      const a1 = cc.a0 + ease * (cc.a1 - cc.a0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let c = -1; c <= 1; c++) {
        ctx.strokeStyle = 'rgba(190,245,175,' + ((finisherPose ? 0.85 : 0.55) * (1 - sw)) + ')';
        ctx.lineWidth = (finisherPose ? 4.2 : 2.6) * (1 - sw) + 0.8;
        ctx.beginPath();
        ctx.arc(4 + lunge, -40 + bob, (36 + c * 9) * rScale, a1 - 0.8, a1);
        ctx.stroke();
      }
      if (finisherPose) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - sw)) + ')';
        ctx.lineWidth = 2.2 * (1 - sw) + 0.6;
        ctx.beginPath();
        ctx.arc(4 + lunge, -40 + bob, 52 * rScale, a1 - 0.9, a1 + 0.05);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}
/* 늑대 소환수 */
function drawDruidWolves() {
  const p = player;
  if (meta.weapon !== 'druid' || state.scene !== 'run' || !p.wolves) return;
  for (const w of p.wolves) {
    const x = w.x - camera.x, y = w.y;
    if (x < -80 || x > CONFIG.canvas.w + 80) continue;
    const fade = w.life < 2 ? clamp(w.life / 2, 0.25, 1) : 1;   // 사라지기 직전 흐려진다
    const sizeMul = druidWolfSizeMul();   // 3차부터 몸집이 커진다

    // ── 도약 잔상 — 지나온 자리에 반투명 실루엣이 줄지어 남는다
    if (w.pounce && w.trail && w.trail.length) {
      for (let i = 0; i < w.trail.length; i++) {
        const tr = w.trail[i];
        const ta = (i + 1) / (w.trail.length + 1) * 0.35;
        ctx.save();
        ctx.globalAlpha = fade * ta;
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(tr.x - camera.x, tr.y);
        ctx.scale(tr.f * sizeMul, sizeMul);
        ctx.fillStyle = '#8fe0b0';
        ctx.beginPath(); ctx.ellipse(0, -19, 15, 7, -0.08, 0, 7); ctx.fill();
        ctx.restore();
      }
    }

    const airborne = !!w.pounce;
    // 도약 진행도(0→1)에 따라 몸을 눕히는 정도 — 정점에서 가장 눕고 착지 직전 편다
    const pk = airborne ? clamp(w.pounce.t / w.pounce.dur, 0, 1) : 0;
    const tilt = airborne ? -Math.sin(pk * Math.PI) * 0.34 : 0;
    const stretch = airborne ? Math.sin(pk * Math.PI) : 0;     // 몸통이 늘어나는 정도
    const step = Math.sin(w.walk) * (airborne ? 0 : 5);

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(w.facing * sizeMul, sizeMul);
    ctx.rotate(tilt);
    ctx.globalAlpha = fade;

    // 드루이드 팔레트(녹갈)에 맞춘 늑대 — 회색이면 소환수인지 몹인지 헷갈린다
    const body = '#4a5a4e', bodyLit = '#6b7f6a', rim = 'rgba(150,230,180,0.95)';
    // 꼬리 — 도약 중엔 뒤로 곧게 뻗어 균형을 잡는다
    ctx.strokeStyle = body; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-16, -18);
    if (airborne) ctx.quadraticCurveTo(-30, -20 - stretch * 6, -40 - stretch * 6, -16 - stretch * 4);
    else ctx.quadraticCurveTo(-28, -24, -30, -10);
    ctx.stroke();
    // 다리 — 도약 중엔 몸 아래로 접혔다가(정점) 착지 직전 앞뒤로 뻗는다
    for (const [lx, shade] of [[-8, body], [-3, bodyLit], [7, body], [12, bodyLit]]) {
      let ex, ey;
      if (airborne) {
        const reach = 1 - Math.sin(pk * Math.PI);              // 이륙/착지에 펴지고 정점에 접힌다
        const fwd = lx > 0 ? 1 : -1;
        ex = lx + fwd * reach * 6; ey = -19 + reach * 15;
      } else {
        const sw2 = Math.sin(w.walk * 1.4 + lx) * 4;
        ex = lx + sw2; ey = -1;
      }
      ctx.strokeStyle = shade; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lx, -19);
      ctx.lineTo(lx + (ex - lx) * 0.5, airborne ? -19 + (ey + 19) * 0.5 : -9);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    // 몸통 — 도약 정점에서 앞뒤로 길게 늘어난다
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(stretch * 3, -19, 17 + stretch * 7, 8 - stretch * 1.5, -0.08, 0, 7);
    ctx.fill();
    ctx.strokeStyle = rim; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = bodyLit;
    ctx.beginPath(); ctx.ellipse(3 + stretch * 2, -21, 10, 4.5, -0.15, 0, 7); ctx.fill();
    // 등줄기 갈기 — 도약 중엔 바람에 눕는다
    ctx.fillStyle = rim;
    for (let i = 0; i < 5; i++) {
      const sx = -10 + i * 6 + stretch * 3;
      const base = -25 - Math.sin((i / 4) * Math.PI) * 1.5;
      ctx.beginPath();
      ctx.moveTo(sx - 2.4, base);
      ctx.lineTo(sx - 0.8 - stretch * 3, base - 3.6 - stretch * 2.5);
      ctx.lineTo(sx + 2.4, base);
      ctx.closePath(); ctx.fill();
    }
    // 목 — 머리보다 먼저 그려 몸통과 이어 붙인다 (없으면 머리가 떠 보인다)
    const hx = 18 + stretch * 7;
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(6, -26); ctx.lineTo(hx - 2, -28); ctx.lineTo(hx - 1, -19); ctx.lineTo(7, -16);
    ctx.closePath(); ctx.fill();
    // 머리
    ctx.fillStyle = bodyLit;
    ctx.beginPath(); ctx.ellipse(hx, -24, 8, 6, -0.2, 0, 7); ctx.fill();
    ctx.strokeStyle = rim; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.fillStyle = body;                                   // 귀 — 도약 중엔 뒤로 눕는다
    ctx.beginPath();
    ctx.moveTo(hx - 4, -28); ctx.lineTo(hx - 6 - stretch * 3, -36 + stretch * 6); ctx.lineTo(hx + 1, -29);
    ctx.closePath(); ctx.fill();
    if (airborne) {                                         // 벌린 입 (송곳니 포함)
      ctx.fillStyle = '#20303a';
      ctx.beginPath();
      ctx.moveTo(hx + 3, -26); ctx.lineTo(hx + 17, -30); ctx.lineTo(hx + 17, -19); ctx.lineTo(hx + 3, -22);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f2f7e8';
      ctx.beginPath(); ctx.moveTo(hx + 7, -27); ctx.lineTo(hx + 10, -22); ctx.lineTo(hx + 12, -28); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 14, -19.5); ctx.lineTo(hx + 15.5, -23); ctx.lineTo(hx + 17, -19.5); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#f2f7e8';
      ctx.beginPath(); ctx.moveTo(hx + 5, -21); ctx.lineTo(hx + 8, -17); ctx.lineTo(hx + 9, -22); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#ffe07a';                              // 눈
    ctx.beginPath(); ctx.ellipse(hx + 2, -26, 2.2, 1.4, -0.25, 0, 7); ctx.fill();
    // 도약 중 발광 — 마나로 뛰어오른다는 느낌
    if (airborne) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(150,235,185,' + (0.16 * Math.sin(pk * Math.PI)) + ')';
      ctx.beginPath(); ctx.ellipse(6, -20, 24, 14, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // 바람선 — 도약 중엔 뒤로, 착지 직전엔 아래로 흐른다
    if (airborne) {
      ctx.save();
      ctx.globalAlpha = fade * 0.65;
      ctx.strokeStyle = 'rgba(190,240,210,0.75)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const oy = y - 30 + i * 8 - stretch * 4;
        ctx.beginPath();
        ctx.moveTo(x - w.facing * (18 + i * 5), oy);
        ctx.lineTo(x - w.facing * (36 + i * 11), oy);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}
function drawCurrentCharacter(x, y, facing, opts = {}) {
  if (meta.character === 'gunner') drawGunner(x, y, facing, opts);
  else if (meta.character === 'blade') drawBlade(x, y, facing, opts);
  else if (meta.character === 'druid') drawDruid(x, y, facing, opts);
  else drawMage(x, y, facing, opts);
}

function render() {
  const W = CONFIG.canvas.w, H = CONFIG.canvas.h;
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  ctx.save();
  ctx.translate(camera.sx, camera.sy);
  for (const tx of toriiXs) if (tx < run.mapW) drawTorii(tx);
  drawGroundAndPlatforms();
  for (const lx of lanternXs) if (lx < run.mapW) drawLantern(lx);
  for (const b of bamboos) {
    const x = b.x - camera.x;
    if (x < -30 || x > W + 30 || b.x > run.mapW) continue;
    const sway = Math.sin(state.time * 1.2 + b.sway) * 4;
    ctx.strokeStyle = 'rgba(50,80,55,0.85)'; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(x, CONFIG.world.groundY);
    ctx.quadraticCurveTo(x + sway * 0.4, CONFIG.world.groundY - b.h * 0.6, x + sway, CONFIG.world.groundY - b.h);
    ctx.stroke();
  }
  drawMechanicField();
  drawBladeTrail();
  for (const z of zones) drawZone(z);
  for (const o of pickups) drawExpOrb(o);
  for (const e of enemies) drawEnemy(e);
  drawDruidWolves();
  drawDruidFx();
  for (const g of player.afterimages) {
    drawCurrentCharacter(g.x - camera.x, g.y, g.f, { ghost: true, alpha: 0.3 * (1 - g.t / 0.25) });
  }
  const blink = state.scene === 'run' && player.invuln > 0 && Math.floor(state.time * 14) % 2 === 0;
  if (state.scene === 'run' && !blink) drawCurrentCharacter(player.x - camera.x, player.y, player.facing);
  drawGunnerBeam();
  for (const w of projectiles) drawProjectile(w);
  drawParticles();
  drawDmgNumbers();
  ctx.restore();
  drawLobbyCharacterPreview();
  if (state.redFlash > 0) {
    ctx.fillStyle = 'rgba(255,30,10,' + state.redFlash * 0.35 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (state.scene === 'run' && player.hp / player.maxHp < 0.3) {
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 4);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, 'rgba(180,0,0,0)');
    vg.addColorStop(1, 'rgba(180,10,0,' + (0.18 + 0.12 * pulse) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

/* ============================ HUD (사냥) ============================ */
function buildSlots() {
  // 캐릭터 전용 슬롯
  const primary = meta.weapon || 'bow';
  const isGunner = primary === 'gunner';
  const isBlade = primary === 'blade';
  const isDruid = primary === 'druid';
  const atkTitle = isDruid ? '할퀴기' : isBlade ? '회전베기' : (isGunner ? '에너지 탄' : '마법탄');
  const sklTitle = isDruid ? '야성 소환' : isBlade ? '섬영 스킬' : (isGunner ? '메카닉 스킬' : '마법 스킬');
  const defs = [
    { id: 'slot-' + primary, icon: WEAPONS[primary].icon, key: 'Z', title: atkTitle },
    { id: 'slot-ult', icon: activeSkillIcon(primary), key: 'X', title: sklTitle, stk: isGunner || isDruid },
    { id: 'slot-jump', icon: '↥', key: 'C', title: '점프' },
  ];
  $('slots').innerHTML = defs.map(d =>
    '<div class="slot learned" id="' + d.id + '" title="' + d.title + '">' +
    (d.pips ? '<div class="pips"><i></i><i></i></div>' : '') +
    '<div class="icon">' + d.icon + '</div><div class="cd" style="height:0%"></div><div class="cdnum"></div><div class="key">' + d.key + '</div>' +
    (d.stk ? '<div class="stk"></div>' : '') +
    '</div>').join('');
  $('hints').innerHTML = isDruid
    ? '<b>Z</b> 할퀴기(마나 회복) · <b>X</b> 늑대 소환/맹금 변신 · <b>C</b> 점프 · <b>←/→</b> 이동 · <b>ESC</b> 일시정지'
    : isBlade
    ? '<b>Z</b> 회전베기 · <b>X</b> 집중/칼날폭풍 · <b>C</b> 점프 · <b>←/→</b> 이동 · <b>ESC</b> 일시정지'
    : isGunner
    ? '<b>Z</b> 에너지 탄 · <b>X</b> 레이저/설치기 · <b>C</b> 점프 · <b>←/→</b> 이동 · <b>ESC</b> 일시정지'
    : '<b>Z</b> 마법탄 · <b>X</b> 화염/중력 마법 · <b>C</b> 점프 · <b>←/→</b> 이동 · <b>↑/↓</b> 조준/하강 · <b>ESC</b> 일시정지';
}

    const sur = bladeMsSurplus();
    if (sur > 0.005) buffTxt += ' (초과 이속 +' + Math.round(sur * 100) + '% → 화력)';
    if (bladeAtTop()) buffTxt += ' 【최고 속도】';
    if (p.focusT > 0) buffTxt += '  🕛 집중 ' + p.focusT.toFixed(1) + '초';
    if (p.trailT > 0) buffTxt += '  ✂️ 궤적 ' + p.trailT.toFixed(1) + '초';
    if (p.storm) buffTxt += '  🌪️ 칼날폭풍' + (p.stormGrab.length ? ' · 연행 ' + p.stormGrab.length : '');
  }
  if (meta.weapon === 'druid') {

    if ((p.mana || 0) >= cost) buffTxt += ' ✅';
    else buffTxt += ' (소환까지 ' + Math.ceil(cost - (p.mana || 0)) + ')';
    if (druidBranch() === 'move') buffTxt += '  🐺 늑대 ' + (p.wolves ? p.wolves.length : 0) + '/' + druidWolfMax();
    if (p.morph) buffTxt += '  🦅 맹금 변신 중 (X로 해제)';
  }
  if (meta.weapon === 'gunner' && meta.skills.gunner.branch) {
    if (meta.skills.gunner.branch === 'move') {
      buffTxt += '  충전 ' + (p.gunnerStacks || 0) + '/' + gunnerStackMax();
    } else {
      buffTxt += '  부품 ' + (p.gunnerStacks || 0) + '/' + gunnerStackMax() + ' · 적중 ' + (p.gunnerPartHits || 0) + '/10 · 설치기 ' + activeGunnerTurrets() + '/' + gunnerTurretMax() + ' · 링크 ' + Math.round(mechanicLinkMax());
    }
  }
  $('buffs').textContent = buffTxt;

  const cdFracs = {
    bow: clamp(p.atkCds.bow / (p.bowCdMax || CONFIG.bow.cd), 0, 1),
    gunner: clamp(p.atkCds.gunner / (p.gunnerCdMax || 0.24), 0, 1),
    blade: clamp(p.atkCds.blade / CONFIG.blade.spin.cd, 0, 1),
    druid: clamp(p.atkCds.druid / CONFIG.druid.claw.cd, 0, 1),

  const cdRemain = {
    bow: p.atkCds.bow,
    gunner: p.atkCds.gunner,
    blade: p.atkCds.blade,
    druid: p.atkCds.druid,
  };
  for (const wk of ['bow', 'gunner', 'blade', 'druid']) {
    const sl = $('slot-' + wk);

    sl.classList.toggle('cur', meta.weapon === wk);
    setSlotCooldown(sl, cdFracs[wk], cdRemain[wk]);
  }
  const ultSlot = $('slot-ult');
  if (ultSlot) {
    ultSlot.querySelector('.icon').textContent = activeSkillIcon(meta.weapon);
    if (meta.weapon === 'blade') {
      const isStorm = meta.skills.blade?.branch === 'conv';
      const cd = isStorm ? p.stormCd : p.focusCd;
      const cdMax = isStorm ? CONFIG.blade.storm.cd : CONFIG.blade.focus.cd;
      setSlotCooldown(ultSlot, clamp(cd / cdMax, 0, 1), cd);
    } else if (meta.weapon === 'druid') {
      // 드루이드는 쿨타임이 아니라 마나가 게이트 — 모자란 만큼을 채워 보여준다
      const cost = CONFIG.druid.mana.cost;
      const lack = clamp((cost - (p.mana || 0)) / cost, 0, 1);
      setSlotCooldown(ultSlot, lack, 0);
    } else
    setSlotCooldown(ultSlot, clamp(p.ultCd / (p.ultCdMax || CONFIG.ult.cd), 0, 1), p.ultCd);
    const stk = ultSlot.querySelector('.stk');
    if (stk) {
      const isStackSkill = meta.weapon === 'gunner' && !!meta.skills.gunner.branch;
      const isDruidWolf = meta.weapon === 'druid' && meta.skills.druid?.branch === 'move';
      stk.textContent = isStackSkill ? (player.gunnerStacks || 0) + '/' + gunnerStackMax()

      ultSlot.classList.toggle('noStack',
        (meta.weapon === 'gunner' && meta.skills.gunner.branch === 'conv' && (player.gunnerStacks || 0) <= 0) ||
        (meta.weapon === 'druid' && (p.mana || 0) < CONFIG.druid.mana.cost));
    }
  }
}

function clearedRegions() {

/* 지역 하나를 클리어할 때 주는 윤회 포인트 — 뒤로 갈수록 가파르게 (1·2·5·9·15·21·29·38·48) */
const rpOfRegion = r => Math.max(1, Math.floor(r * r * 0.6));

function rpPreview() {
  let sum = 0;

  return sum;

function doRebirth() {
  const gain = rpPreview();
  if (gain < 1) { sfx('error'); return; }
  const keep = hasItem('keepSpec');
  if (!confirm('윤회하시겠습니까?\n\n초기화: 레벨 · 골드 · 골드 강화 · ' + (keep ? '' : '전문화(SP) · ') + '지역 진행\n유지: 아이템 · 윤회 포인트' + (keep ? ' · 전문화(각인의 봉인)' : '') +
    '\n\n획득 윤회 포인트: ' + gain + ' ☸')) return;
  meta.rp += gain;
  meta.stats.rpEarned += gain;
  meta.rebirths++;
  // 이번 생 초기화
  resetAllCharLevels();
  meta.level = 1; meta.exp = 0; meta.gold = 0;
  // 시작의 유산: 골드 강화를 맨바닥이 아니라 몇 레벨 쥐고 시작한다
  const head = Math.round(itemPow('headstart'));
  for (const k in meta.upgrades) meta.upgrades[k] = head;
  resetAllCharSp();
  if (!keep) {   // 각인의 봉인이 없으면 전문화도 날아간다
    for (const w in meta.skills) {
      meta.skills[w].branch = null; meta.skills[w].tier = 0;
      if ('element' in meta.skills[w]) meta.skills[w].element = null;

  }
  for (let r = 1; r <= 9; r++) meta.regions[r] = { kills: 0, bossUnlocked: false, bossCleared: false, entered: r === 1 };
  meta.lifeKills = 0;
  saveMeta();
  toast('☸ 윤회 — 윤회 포인트 +' + gain + '. 아이템을 뽑아 더 강해지자!');
  sfx('levelup');

}

   아이템을 등급에 몇 개 넣든 표기 확률이 그대로 유지된다 — 등급이 곧 확률 조절 손잡이. */
function rollItem() {
  const forced = meta.pity >= PITY_AT;
  const pool = gachaPool(forced ? 'epic' : null);
  if (!pool.length) return rollFrom(gachaPool(null));   // 영웅+가 다 찼으면 전체에서
  return rollFrom(pool);
}
function rollFrom(pool) {
  if (!pool.length) return null;                 // 전 아이템 만렙 — 더 줄 게 없다
  // 후보가 남아있는 등급만 모아 가중 추첨 (빈 등급의 확률은 남은 등급들이 비례로 나눠 갖는다)
  const byGrade = {};
  for (const id of pool) (byGrade[ITEMS[id].grade] = byGrade[ITEMS[id].grade] || []).push(id);
  const grades = Object.keys(byGrade);
  let total = 0;
  for (const g of grades) total += ITEM_GRADES[g].weight;
  let r = Math.random() * total;
  for (const g of grades) {
    r -= ITEM_GRADES[g].weight;
    if (r <= 0) { const arr = byGrade[g]; return arr[Math.floor(Math.random() * arr.length)]; }
  }
  const arr = byGrade[grades[grades.length - 1]];
  return arr[Math.floor(Math.random() * arr.length)];
}
/* n회 뽑기. 결과를 배열로 돌려준다 (연출·요약용) */
function doGacha(n) {
  const got = [], fresh = new Set();
  for (let i = 0; i < n; i++) {
    if (meta.rp < GACHA_COST) break;
    const id = rollItem();
    if (!id) { toast('모든 아이템이 상한에 도달했다'); break; }
    if (itemCount(id) === 0) fresh.add(id);      // 증가시키기 전에 신규 여부를 기록
    meta.rp -= GACHA_COST;
    meta.items[id] = itemCount(id) + 1;
    meta.stats.pulls++;
    const g = ITEMS[id].grade;
    meta.pity = (g === 'epic' || g === 'legend') ? 0 : meta.pity + 1;
    got.push(id);
  }
  if (got.length) {
    saveMeta();
    lastPulls = got;
    gachaReveal(got, fresh);
  } else sfx('error');
  return got;
}

/* ===================== 기원 연출 =====================

function gachaSetColor(g) {

  for (const id of ['gachaRays', 'gachaRune', 'gachaRune2', 'gachaRune3', 'gachaCard',
                    'gachaBurst', 'gachaTease', 'gachaImplode', 'gachaSparks',

/* 입자 풀 — 필요한 만큼만 만들어두고 계속 재사용한다 */
function gachaFxPool(hostId, cls, n) {
  const host = $(hostId);
  while (host.children.length < n) {
    const d = document.createElement('div');
    d.className = cls;
    host.appendChild(d);
  }
  return host;
}
/* 방사형으로 튀는 불티 — power가 클수록 멀리, 많이 */
function gachaSparkBurst(power) {

  for (let i = 0; i < n; i++) {
    const el = host.children[i];
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
    const dist = (150 + Math.random() * 250) * power;
    const sz = (3.5 + Math.random() * 5).toFixed(1);
    el.style.width = sz + 'px'; el.style.height = sz + 'px';
    el.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
    el.style.animationDelay = (Math.random() * 0.09).toFixed(3) + 's';
    replayAnim(el, 'go');
  }
}
/* 사방에서 중심으로 빨려드는 입자 — 승급 직전에 쓴다 */

    el.style.setProperty('--py', (Math.sin(a) * dist).toFixed(0) + 'px');

function gachaDustFall(power) {

/* 배경에서 계속 피어오르는 영기. 위치·속도는 한 번만 뽑아두고 등급으로 농도만 조절한다 */
