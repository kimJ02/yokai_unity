<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요괴전선 — 캐릭터 액션 사냥 프로토타입</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#07070d; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:#e8e0d0; }

  #wrap { position:absolute; left:50%; top:50%; width:1280px; height:720px; transform-origin:center center; }
  #game { display:block; width:1280px; height:720px; background:#0a0a14; }

  /* ---------- 공용 ---------- */
  .hidden { display:none !important; }
  button { font-family:inherit; }
  .btn {
    background:#3a2520; border:1px solid #8a5a3a; color:#ffd8a0; border-radius:6px;
    padding:6px 14px; cursor:pointer; font-size:13px;
  }
  .btn:hover:not(:disabled) { background:#5a3525; border-color:#c9a24a; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.primary { background:#5a2020; border-color:#c9614a; color:#ffe9c0; font-weight:bold; }
  .btn.primary:hover:not(:disabled) { background:#7a2a25; }
  .goldc { color:#ffd76e; } .spc { color:#8ef0c8; } .burnc { color:#ff9a4a; } .bleedc { color:#ff5a6e; }

  /* ---------- 사냥 HUD ---------- */
  #hud { position:absolute; inset:0; pointer-events:none; }
  #topbar { position:absolute; left:16px; top:14px; width:320px; }
  .bar { position:relative; height:20px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; width:100%; transition:width .12s; }
  #hpfill { background:linear-gradient(180deg,#ff5a52,#b3170f); }
  #expfill { background:linear-gradient(180deg,#ffd76e,#c98d1a); }
  .bar .txt { position:absolute; inset:0; text-align:center; font-size:12px; line-height:20px; color:#fff; text-shadow:0 1px 2px #000; font-weight:bold; }
  #infoline { display:flex; gap:14px; font-size:14px; text-shadow:0 1px 2px #000; align-items:center; }
  #infoline b { color:#ffd76e; }
  #buffs { margin-top:6px; font-size:13px; color:#8ef0c8; text-shadow:0 1px 2px #000; min-height:18px; }

  #timerbox { position:absolute; left:0; right:0; top:12px; text-align:center; pointer-events:none; }
  #timer { font-size:38px; font-weight:900; color:#fff; text-shadow:0 2px 6px #000, 0 0 16px rgba(255,200,100,.3); font-variant-numeric:tabular-nums; }
  #timer.low { color:#ff6a5a; animation:tick .5s infinite; }
  @keyframes tick { 50%{opacity:.55} }
  #stageline { font-size:13px; color:#c8b890; text-shadow:0 1px 2px #000; margin-top:2px; }
  #killline { font-size:14px; color:#9ad0ff; text-shadow:0 1px 2px #000; margin-top:2px; }
  #earnline { font-size:12px; color:#ffd76e; text-shadow:0 1px 2px #000; margin-top:2px; }

  #bossbar { position:absolute; left:50%; transform:translateX(-50%); top:104px; width:560px; display:none; }
  #bossbar .bnm { text-align:center; font-size:14px; color:#ffb0a0; text-shadow:0 1px 3px #000; margin-bottom:3px; letter-spacing:2px; }
  #bossbar .bar { height:14px; border-color:#8a4a4a; }
  #bossfill { background:linear-gradient(180deg,#c86aff,#6a1fb3); }

  #combo { position:absolute; right:28px; top:52px; text-align:right; font-weight:900; color:#ffd76e; text-shadow:0 2px 4px #000, 0 0 14px rgba(255,160,40,.5); display:none; }
  #combo .n { font-size:44px; font-style:italic; color:#ffb340; }
  #combo .lbl { font-size:16px; letter-spacing:3px; }
  #combo.pop { animation:comboPop .18s ease-out; }
  @keyframes comboPop { 0%{transform:scale(1.35)} 100%{transform:scale(1)} }

  #slots { position:absolute; left:16px; bottom:14px; display:flex; gap:8px; }
  .slot { position:relative; width:58px; height:58px; background:rgba(10,8,16,.8); border:2px solid #55403a; border-radius:8px; text-align:center; }
  .slot .icon { font-size:25px; line-height:44px; font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; color:#e8d8b0; text-shadow:0 0 8px rgba(255,180,80,.35); }
  .slot .key { position:absolute; left:0; right:0; bottom:1px; font-size:10px; color:#c8b890; }
  .slot .cd { position:absolute; left:0; right:0; bottom:0; height:0%; background:rgba(0,0,10,.75); border-radius:0 0 6px 6px; }
  .slot .cdnum { position:absolute; left:4px; right:4px; top:16px; display:none; z-index:2; font-size:17px; font-weight:900; color:#fff0b8; text-shadow:0 2px 4px #000, 0 0 8px rgba(255,190,80,.75); pointer-events:none; }
  .slot.cooling .icon { opacity:.34; }
  .slot.cooling .cdnum { display:block; }
  .slot .pips { position:absolute; left:0; right:0; top:-11px; display:flex; justify-content:center; gap:3px; }
  .slot .pips i { width:7px; height:7px; border-radius:50%; background:#3a3348; border:1px solid #6a5a80; }
  .slot .pips i.on { background:#7de8ff; box-shadow:0 0 6px #7de8ff; }
  .slot.learned { border-color:#c9a24a; box-shadow:0 0 10px rgba(220,170,70,.25); }
  .slot.cur { border-color:#7de8ff; box-shadow:0 0 12px rgba(125,232,255,.45); }
  .slot .stk { position:absolute; right:2px; top:0; font-size:11px; font-weight:bold; color:#8ef0c8; text-shadow:0 1px 2px #000; }
  .slot.noStack .icon { color:#8a8070; text-shadow:none; }
  .slot.noStack .stk { color:#ff8a7a; }
  #hints { position:absolute; right:16px; bottom:14px; font-size:12px; color:#a89878; text-shadow:0 1px 2px #000; text-align:right; line-height:1.7; }
  #hints b { color:#ffd76e; }

  #banner { position:absolute; left:0; right:0; top:200px; text-align:center; font-size:52px; font-weight:900; color:#ffe9a0; text-shadow:0 0 24px rgba(255,190,60,.8), 0 3px 6px #000; opacity:0; pointer-events:none; font-style:italic; letter-spacing:4px; }
  #banner.show { animation:bannerAni 1.6s ease-out forwards; }
  @keyframes bannerAni { 0%{opacity:0; transform:scale(.6)} 12%{opacity:1; transform:scale(1.12)} 22%{transform:scale(1)} 75%{opacity:1} 100%{opacity:0; transform:translateY(-30px)} }
  #skillmsg { position:absolute; left:0; right:0; bottom:110px; text-align:center; font-size:15px; color:#ff9a8a; text-shadow:0 1px 3px #000; opacity:0; transition:opacity .3s; pointer-events:none; }

  /* ---------- 로비 ---------- */
  #lobby { position:absolute; inset:0; pointer-events:auto; display:flex; flex-direction:column; }
  #lobbyHead { display:flex; align-items:center; gap:18px; padding:14px 22px 8px; text-shadow:0 1px 3px #000; }
  #lobbyHead h1 { font-family:serif; font-size:30px; color:#e8d0a0; letter-spacing:4px; margin-right:8px; }
  #lobbyHead .stat { font-size:15px; color:#c8b8a0; }
  #lobbyHead .stat b { color:#ffd76e; font-size:17px; }
  #lobbyHead .stat b.spc { color:#8ef0c8; }
  #lobbyExpbar { width:180px; height:10px; background:rgba(0,0,0,.5); border:1px solid #5a4a3a; border-radius:4px; overflow:hidden; }
  #lobbyExpbar div { height:100%; background:linear-gradient(180deg,#ffd76e,#c98d1a); }
  #lobbyHead .right { margin-left:auto; display:flex; gap:8px; }
  #lobby.characterMode #lobbyHead { display:none; }
  #lobby.characterMode #lobbyTabs,
  #lobby.characterMode #lobbyBody { display:none; }
  #lobby:not(.characterMode) #weaponRow { display:none; }

  #weaponRow {
    position:relative; height:300px; margin:4px 22px 0; padding:0; overflow:hidden;
    border:1px solid rgba(245,220,180,.22); border-radius:18px;
    background:
      radial-gradient(circle at 76% 34%, rgba(255,220,170,.17), transparent 30%),
      radial-gradient(circle at 20% 100%, rgba(185,255,100,.11), transparent 28%),
      linear-gradient(112deg, rgba(26,18,22,.98), rgba(60,45,52,.88) 48%, rgba(98,80,86,.72));
    box-shadow:0 20px 55px rgba(0,0,0,.35) inset, 0 10px 30px rgba(0,0,0,.22);
  }
  #lobby.characterMode #weaponRow { flex:1; height:auto; margin:0; border:0; border-radius:0; }
  #weaponRow::before {
    content:''; position:absolute; inset:-40px -10px; opacity:.22; pointer-events:none;
    background:
      linear-gradient(36deg, transparent 28%, rgba(255,230,180,.5) 28.4%, transparent 29%),
      linear-gradient(116deg, transparent 41%, rgba(255,230,180,.36) 41.4%, transparent 42%),
      radial-gradient(circle at 62% 26%, #ffe7b8 0 2px, transparent 3px),
      radial-gradient(circle at 78% 8%, #ffe7b8 0 2px, transparent 3px),
      radial-gradient(circle at 90% 38%, #ffe7b8 0 1.5px, transparent 3px);
  }
  .charSelect { position:absolute; inset:0; display:grid; grid-template-columns:560px 1fr; gap:22px; padding:36px 40px 18px; }
  .charInfoPanel {
    position:relative; z-index:1; height:380px; padding:34px 38px 36px; border-radius:14px;
    background:rgba(12,9,12,.74); box-shadow:0 18px 40px rgba(0,0,0,.28); backdrop-filter:blur(2px);
  }
  .charInfoPanel h2 { font-size:58px; line-height:1; color:#fff; letter-spacing:1px; margin-bottom:18px; }
  .charInfoPanel .role { font-size:16px; color:#d8c8b8; line-height:1.55; max-width:460px; min-height:58px; }
  .charInfoPanel .goldLine { height:5px; width:440px; background:#f1d500; margin:46px 0 34px; box-shadow:0 0 12px rgba(241,213,0,.28); }
  .branchPick { display:flex; align-items:center; gap:36px; }
  .branchOrb { display:flex; align-items:center; gap:14px; color:#fff; font-size:30px; font-weight:800; }
  .branchOrb .circle {
    width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    background:#fff; border:2px solid #c86aff; box-shadow:0 0 16px rgba(200,106,255,.34);
    font-size:40px; font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  }
  .charStage { position:relative; z-index:1; min-width:0; }
  .charNamePlate { position:absolute; right:12px; top:6px; text-align:right; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.55); }
  .charNamePlate b { display:block; font-size:38px; line-height:1; }
  .charNamePlate span { color:#e8dac8; font-size:13px; }
  .charFigure { display:none; }
  .charFigure .aura { position:absolute; inset:22px 8px 18px; border-radius:48%; background:radial-gradient(circle, var(--glow), transparent 66%); opacity:.34; }
  .charFigure .hair { position:absolute; left:88px; top:46px; width:104px; height:132px; border-radius:52px 52px 34px 34px; background:var(--hair); box-shadow:inset -18px 8px 0 rgba(255,255,255,.08); }
  .charFigure .head { position:absolute; left:108px; top:60px; width:64px; height:72px; border-radius:48% 48% 44% 44%; background:#f0c7a8; z-index:2; box-shadow:inset 10px -8px 0 rgba(160,80,70,.11); }
  .charFigure .eye { position:absolute; top:96px; width:8px; height:6px; border-radius:50%; background:var(--eye); z-index:3; }
  .charFigure .eye.l { left:124px; } .charFigure .eye.r { left:151px; }
  .charFigure .body { position:absolute; left:80px; top:128px; width:122px; height:154px; border-radius:26px 26px 10px 10px; background:linear-gradient(90deg, #171419, var(--cloth)); z-index:1; }
  .charFigure .shirt { position:absolute; left:104px; top:134px; width:72px; height:90px; border-radius:18px 18px 12px 12px; background:#f2efe8; z-index:2; box-shadow:inset -14px 0 0 rgba(0,0,0,.09); }
  .charFigure .leg { position:absolute; top:252px; width:42px; height:86px; background:#151217; z-index:0; border-radius:0 0 16px 16px; }
  .charFigure .leg.l { left:96px; transform:rotate(4deg); } .charFigure .leg.r { left:142px; transform:rotate(-4deg); }
  .charFigure .weaponMark { position:absolute; right:26px; top:116px; font-size:54px; z-index:4; text-shadow:0 4px 12px rgba(0,0,0,.45); }
  .charFigure.mage { --hair:#b4473f; --eye:#ff9a4a; --cloth:#32222a; --glow:rgba(255,150,70,.75); }
  .charFigure.gunner { --hair:#8ec8e8; --eye:#4bd6ff; --cloth:#252c35; --glow:rgba(120,210,255,.76); }
  .charFigure.mage .hat {
    position:absolute; left:48px; top:18px; width:190px; height:42px; border-radius:50%; background:#171318; z-index:5; transform:rotate(-6deg);
    box-shadow:inset 0 -10px 0 rgba(255,255,255,.06);
  }
  .charFigure.mage .hat::before {
    content:''; position:absolute; left:72px; top:-48px; width:60px; height:78px; background:#19151a; clip-path:polygon(50% 0, 100% 100%, 0 100%);
  }
  .charFigure.gunner .weaponMark { transform:rotate(-8deg); }
  .charThumbs { position:absolute; left:510px; bottom:14px; display:flex; gap:12px; z-index:3; }
  .wcard {
    width:92px; height:118px; border:4px solid #0a090a; border-radius:8px; padding:6px; cursor:pointer; text-align:center;
    background:rgba(20,20,22,.78); color:#fff; box-shadow:0 6px 14px rgba(0,0,0,.3); position:relative;
  }
  .wcard:hover { border-color:#d8d8d8; }
  .wcard.preview { border-color:#d8d8d8; box-shadow:0 0 0 4px rgba(255,255,255,.22), 0 10px 18px rgba(0,0,0,.38); }
  .wcard.sel::after { content:'선택됨'; position:absolute; left:8px; right:8px; bottom:6px; font-size:10px; color:#d8ff4a; text-shadow:0 1px 2px #000; }
  .wcard .wicon { font-size:38px; line-height:46px; font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; }
  .wcard .wnm { font-size:13px; font-weight:bold; color:#fff; margin-top:4px; }
  .wcard .wdesc { font-size:10px; color:#d8c8b8; margin-top:2px; line-height:1.25; }
  .charSelectActions { position:absolute; left:0; right:0; bottom:0; height:76px; z-index:4; pointer-events:none; }
  .charActionBtn {
    position:absolute; bottom:0; height:58px; min-width:146px; pointer-events:auto;
    border:3px solid #d8ff26; border-radius:0 14px 14px 0; background:rgba(32,30,28,.76);
    color:#fff; font-size:28px; font-weight:800; cursor:pointer; text-shadow:0 2px 4px #000;
  }
  .charActionBtn.select { right:0; border-radius:14px 0 0 14px; }
  .charActionBtn:hover { background:rgba(55,52,44,.86); }

  #lobbyTabs { display:flex; gap:6px; padding:8px 22px 0; }
  .tabbtn { background:rgba(14,11,20,.85); border:1px solid #4a3a3a; border-bottom:none; border-radius:8px 8px 0 0; color:#b8a888; padding:8px 20px; cursor:pointer; font-size:15px; }
  .tabbtn.on { color:#ffe9c0; border-color:#c9a24a; background:rgba(30,22,30,.95); font-weight:bold; }
  #lobbyBody { flex:1; margin:0 22px 16px; background:rgba(14,11,20,.92); border:1px solid #6a4a3a; border-radius:0 10px 10px 10px; padding:14px 18px; overflow-y:auto; }

  /* 스테이지 탭 */
  .regionGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .regionCard { background:rgba(24,18,30,.8); border:1px solid #4a3a48; border-radius:10px; padding:10px 12px; }
  .regionCard.locked { opacity:.42; filter:grayscale(.6); }
  .regionCard .rnm { font-size:15px; font-weight:bold; color:#ffe9c0; }
  .regionCard .rlv { font-size:11px; color:#9ad0ff; margin-left:6px; }
  .regionCard .prog { font-size:12px; color:#b8a888; margin:5px 0; }
  .regionCard .prog .done { color:#8ef0c8; }
  .regionCard .rbtns { display:flex; gap:6px; margin-top:4px; }
  .regionCard .cleared { color:#ffd76e; font-size:11px; }
  .pbarMini { height:6px; background:rgba(0,0,0,.5); border-radius:3px; overflow:hidden; margin-top:3px; }
  .pbarMini div { height:100%; background:#7aa85a; }

  /* 강화 탭 */
  .upRow { display:flex; align-items:center; gap:12px; padding:9px 6px; border-bottom:1px solid rgba(255,255,255,.07); font-size:14px; }
  .upRow .nm { width:150px; color:#e8d8b8; }
  .upRow .nm b { color:#ffd76e; }
  .upRow .vl { flex:1; color:#b8c8d8; font-size:13px; }

  /* 전문화 탭 */
  #specWrap { display:flex; gap:14px; }
  .tree { flex:1; border:1px solid #4a3a3a; border-radius:10px; padding:10px; background:rgba(0,0,0,.25); }
  .tree.chosen { border-color:#c9a24a; box-shadow:0 0 16px rgba(220,170,70,.2); }
  .tree.blockedT { opacity:.45; filter:grayscale(.7); }
  .tree h3 { font-size:15px; color:#ffb0a0; margin-bottom:2px; }
  .tree.rt h3 { color:#8fd8ff; }
  .tree .tag { font-size:11px; color:#908070; margin-bottom:8px; }
  .node { border:1px solid #4a3a48; border-radius:8px; padding:8px 9px; margin-bottom:7px; background:rgba(20,16,28,.6); }
  .node .nm { font-size:13px; font-weight:bold; color:#e8d8b8; }
  .node .ds { font-size:11.5px; color:#a8a0b0; margin:3px 0 5px; line-height:1.45; }
  .node.learned { border-color:#c9a24a; background:rgba(60,44,16,.45); }
  .node.learned .nm::after { content:' ✔'; color:#8ef0c8; }
  .node.avail { border-color:#5a8a5a; }
  .node .lock { font-size:11px; color:#806a6a; }
  .conn { text-align:center; color:#6a5a60; font-size:11px; margin:-3px 0 3px; }
  .specHead { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; color:#b8a888; }
  .elemBadge { font-size:12px; padding:2px 8px; border-radius:10px; border:1px solid; }
  .elemBadge.burn { color:#ff9a4a; border-color:#ff9a4a; }
  .elemBadge.bleed { color:#ff5a6e; border-color:#ff5a6e; }

  /* 결과 화면 */
  #result { position:absolute; inset:0; background:rgba(5,4,10,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; pointer-events:auto; }
  #result h1 { font-family:serif; font-size:52px; letter-spacing:6px; color:#e8d0a0; text-shadow:0 0 30px rgba(255,150,60,.4); }
  #result h1.dead { color:#ff6a5a; }
  #result h1.clear { color:#8ef0c8; }
  #resultRows { margin:22px 0; background:rgba(0,0,0,.4); border:1px solid #4a3a3a; border-radius:10px; padding:16px 40px; font-size:16px; line-height:2.1; color:#c8b8a0; min-width:340px; }
  #resultRows b { color:#ffd76e; float:right; margin-left:40px; }

  #toast { position:absolute; left:50%; transform:translateX(-50%); top:150px; background:rgba(30,20,10,.95); border:1px solid #c9a24a; color:#ffe9b0; border-radius:10px; padding:10px 26px; font-size:16px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:40; text-shadow:0 1px 2px #000; }

  /* ============ 기원(가챠) 연출 ============ */
  #gachaOv { position:absolute; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
             background:radial-gradient(ellipse at center, rgba(20,10,34,.93) 0%, rgba(4,3,8,.985) 70%); overflow:hidden; cursor:pointer; }
  #gachaOv.hidden { display:none; }
  /* 뒤에서 도는 빛줄기 — 등급이 높을수록 진해진다 */
  #gachaRays { position:absolute; left:50%; top:50%; width:1800px; height:1800px; margin:-900px 0 0 -900px;
               background:repeating-conic-gradient(from 0deg, var(--g,#fff) 0deg 2.2deg, transparent 2.2deg 11deg);
               opacity:0; mix-blend-mode:screen; filter:blur(1px); animation:gRaySpin 14s linear infinite; }
  @keyframes gRaySpin { to { transform:rotate(360deg) } }
  /* 소환진 */
  #gachaRune { position:absolute; width:430px; height:430px; border-radius:50%;
               border:2px solid var(--g,#fff); box-shadow:0 0 60px var(--g,#fff), inset 0 0 60px var(--g,#fff);
               opacity:0; animation:gRuneSpin 6s linear infinite; }
  #gachaRune::before, #gachaRune::after { content:''; position:absolute; inset:34px; border-radius:50%;
               border:1px dashed var(--g,#fff); opacity:.75; }
  #gachaRune::after { inset:82px; border-style:solid; border-width:1px; opacity:.45; }
  @keyframes gRuneSpin { to { transform:rotate(-360deg) } }
  #gachaStage { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  /* 부적 카드 */
  #gachaCard { position:relative; width:268px; height:372px; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,1.6,.5,1); }
  #gachaCard .face { position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; overflow:hidden;
               display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; }
  #gachaCard .back { background:linear-gradient(155deg,#2a1c3e 0%,#140d20 55%,#241634 100%); border:2px solid #6a5a3a;
               box-shadow:0 0 34px rgba(0,0,0,.7), inset 0 0 30px rgba(0,0,0,.6); }
  #gachaCard .back span { font-size:78px; color:#c9a24a; text-shadow:0 0 22px rgba(201,162,74,.85); }
  #gachaCard .back::after { content:''; position:absolute; inset:12px; border:1px solid rgba(201,162,74,.4); border-radius:10px; }
  #gachaCard .front { transform:rotateY(180deg); background:linear-gradient(165deg, rgba(38,30,54,.98), rgba(12,9,20,.99));
               border:2px solid var(--g,#fff); box-shadow:0 0 44px var(--g,#fff), inset 0 0 34px rgba(0,0,0,.75); }
  #gachaCard.flip { transform:rotateY(180deg); }
  /* ===== 하스스톤식 카드 구성: 초상화 · 이름 배너 · 박힌 보석 ===== */
  #gachaCard .front { display:block; padding:0; }
  .gPortrait { position:absolute; z-index:1; left:50%; top:22px; width:152px; height:152px; margin-left:-76px;
      border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden;
      background:radial-gradient(circle at 42% 34%, rgba(255,255,255,.10) 0%, rgba(30,26,40,.85) 55%, rgba(4,3,8,.97) 100%);
      border:3px solid var(--fr,#7d6a42);
      box-shadow:inset 0 0 26px rgba(0,0,0,.9), 0 3px 12px rgba(0,0,0,.7); }
  /* 일러스트 뒤에서 도는 후광 — 등급이 오를수록 진하고 빨라진다 */
  .gPortrait::before { content:''; position:absolute; inset:-34%; z-index:0;
      background:repeating-conic-gradient(from 0deg, var(--g,#fff) 0deg 3deg, transparent 3deg 13deg);
      opacity:var(--halo,.07); animation:gRaySpin var(--haloSpd,16s) linear infinite; }
  /* 가장자리를 어둡게 눌러 초상화처럼 보이게 한다 */
  .gPortrait::after { content:''; position:absolute; inset:0; z-index:2; border-radius:50%; pointer-events:none;
      background:radial-gradient(circle at 50% 40%, transparent 38%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%); }
  .gIcon { position:relative; z-index:1; font-size:80px; line-height:1;
      filter:drop-shadow(0 0 10px var(--g,#fff)) drop-shadow(0 0 26px var(--g,#fff)) drop-shadow(0 3px 4px rgba(0,0,0,.9)); }
  /* 좌상단 비용 보석 — 보유 개수를 박아 넣는다 */
  .gCost { position:absolute; z-index:3; left:8px; top:8px; width:52px; height:52px; border-radius:50%;
      background:radial-gradient(circle at 36% 30%, #cfe6ff 0%, #3d78c8 42%, #10305e 100%);
      border:2px solid #d9c489; box-shadow:0 0 12px rgba(80,150,255,.65), inset 0 -4px 9px rgba(0,0,0,.55);
      display:flex; align-items:center; justify-content:center; }
  .gCost span { font-size:23px; font-weight:bold; color:#fff; text-shadow:0 2px 3px #000, 0 0 8px #7fc0ff; }
  /* 이름 배너 */
  .gBanner { position:absolute; z-index:2; left:2px; right:2px; top:158px; height:42px;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, #7a6538 0%, #4a3a1c 52%, #2c2110 100%);
      border-top:2px solid #c2a869; border-bottom:2px solid #241a0c;
      box-shadow:0 3px 10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,236,180,.35); }
  .gBanner::before, .gBanner::after { content:''; position:absolute; top:0; bottom:0; width:16px;
      background:linear-gradient(180deg,#8a7240,#3a2c14); }
  .gBanner::before { left:-2px; transform:skewX(-14deg); }
  .gBanner::after  { right:-2px; transform:skewX(14deg); }
  .gName { font-size:20px; font-weight:bold; color:#ffeec2; text-shadow:0 2px 4px #000, 0 0 10px rgba(0,0,0,.9); }
  /* 배너에 박힌 등급 보석 (마름모) — 여기가 등급을 읽는 지점 */
  .gGem { position:absolute; z-index:4; left:50%; top:186px; width:28px; height:28px; margin-left:-14px;
      transform:rotate(45deg); border:2px solid rgba(20,14,4,.75); border-radius:4px;
      background:linear-gradient(135deg, #ffffff 0%, var(--g,#fff) 42%, rgba(0,0,0,.65) 100%);
      box-shadow:0 0 16px var(--g,#fff), inset 0 0 8px rgba(255,255,255,.55), 0 2px 6px rgba(0,0,0,.7); }
  .gGem::after { content:''; position:absolute; left:3px; top:3px; right:9px; height:9px; border-radius:3px;
      background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .gGrade { position:absolute; z-index:2; left:0; right:0; top:224px; font-size:11px; letter-spacing:5px; font-weight:bold;
      color:var(--g,#fff); text-shadow:0 0 12px var(--g,#fff), 0 1px 3px #000, 0 0 3px #000; }
  .gDesc { position:absolute; z-index:2; left:18px; right:18px; top:252px; font-size:12.5px; line-height:1.55;
      color:#e0d5bc; text-shadow:0 1px 3px rgba(0,0,0,.95); }
  /* 카드 종류 띠 — 하스스톤의 '하수인/주문' 자리 */
  .gType { position:absolute; z-index:2; left:50%; transform:translateX(-50%); bottom:52px;
      padding:3px 16px; border-radius:9px; font-size:11px; letter-spacing:3px; color:#e8dcc0;
      background:linear-gradient(180deg, rgba(90,76,44,.85), rgba(30,24,12,.9));
      border:1px solid rgba(210,186,124,.45); text-shadow:0 1px 2px #000; }
  .gDup  { position:absolute; z-index:2; left:0; right:0; bottom:20px; font-size:12.5px; font-weight:bold; }
  /* 네 모서리 리벳 — 기본은 숨김, 영웅·전설에서 켜진다 */
  .gCorner { position:absolute; z-index:3; width:13px; height:13px; border-radius:50%; opacity:0;
      background:radial-gradient(circle at 34% 30%, #fff, var(--g,#fff) 55%, rgba(0,0,0,.7));
      box-shadow:0 0 9px var(--g,#fff); }
  .gCorner.tl { left:9px;  top:9px }  .gCorner.tr { right:9px; top:9px }
  .gCorner.bl { left:9px;  bottom:9px } .gCorner.br { right:9px; bottom:9px }

  /* ===== 등급별 카드 외형 — 색만이 아니라 구조가 달라진다 =====
     (뒷면은 모든 등급이 동일해야 한다. 뒤집기 전에 등급이 새면 기대감이 죽는다) */
  .gFrame { position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:14px; overflow:hidden; }
  @keyframes gSheen  { 0%,55% { background-position:200% 0 } 100% { background-position:-60% 0 } }
  @keyframes gPulseG { 0%,100% { box-shadow:0 0 30px var(--g,#fff), inset 0 0 34px rgba(0,0,0,.75) }
                       50%     { box-shadow:0 0 66px var(--g,#fff), inset 0 0 34px rgba(0,0,0,.75) } }
  @keyframes gFloat  { 0%,100% { margin-top:0 } 50% { margin-top:-9px } }

  /* 일반 — 무광 회석 프레임. 리벳 없음 */
  #gachaCard.g-common .front { border-width:1px; --fr:#5c6058;
      background:linear-gradient(165deg, rgba(36,37,34,.98), rgba(11,12,10,.99));
      box-shadow:0 0 16px rgba(159,180,160,.3), inset 0 0 26px rgba(0,0,0,.82); }
  #gachaCard.g-common .front { --halo:.05; --haloSpd:22s; }
  #gachaCard.g-common .gBanner { background:linear-gradient(180deg,#4c4f47 0%,#2b2d28 52%,#191a17 100%);
      border-top-color:#7d8175; }
  #gachaCard.g-common .gBanner::before, #gachaCard.g-common .gBanner::after {
      background:linear-gradient(180deg,#585c52,#23241f); }

  /* 희귀 — 안쪽 테두리 한 줄 + 사선 광택이 훑고 지나간다 */
  #gachaCard.g-rare .front { --fr:#5f97c8; --halo:.14; --haloSpd:14s; }
  #gachaCard.g-rare .gFrame { border:1px solid rgba(111,200,255,.42); border-radius:11px; inset:8px; }
  #gachaCard.g-rare .gFrame::after { content:''; position:absolute; inset:-8px;
      background:linear-gradient(115deg, transparent 38%, rgba(190,235,255,.20) 50%, transparent 62%);
      background-size:260% 100%; animation:gSheen 3s ease-in-out infinite; }

  /* 영웅 — 이중 테두리 + 네 모서리 장식 + 맥동하는 광휘 */
  #gachaCard.g-epic .front { border-width:3px; animation:gPulseG 2.1s ease-in-out infinite;
      background:linear-gradient(165deg, rgba(52,34,76,.98), rgba(16,9,26,.99)); }
  #gachaCard.g-epic .gFrame { border:1px solid rgba(201,138,255,.5); border-radius:10px; inset:9px; overflow:visible; }
  #gachaCard.g-epic .front { --fr:#9a72c8; --halo:.22; --haloSpd:10s; }
  #gachaCard.g-epic .gCorner { opacity:.85; width:11px; height:11px; }   /* 리벳 네 개 (전설보다 작고 옅게) */

  /* 전설 — 회전하는 금테 + 홀로그램 광택 + 카드가 천천히 떠오른다 */
  #gachaCard.g-legend { animation:gFloat 3.2s ease-in-out infinite; }
  #gachaCard.g-legend .front { border:0; padding:20px;
      box-shadow:0 0 70px var(--g,#fff), 0 0 130px rgba(255,196,77,.4), inset 0 0 40px rgba(0,0,0,.8); }
  #gachaCard.g-legend .gFrame { inset:0; border-radius:16px; }
  #gachaCard.g-legend .gFrame::before { content:''; position:absolute; inset:-70%;
      background:conic-gradient(from 0deg, #ffc44d, #fff6d0, #ff9c0d, #ffe9a8, #ffb52e, #fffbe8, #ffc44d);
      animation:gRaySpin 3.4s linear infinite; }
  #gachaCard.g-legend .gFrame::after { content:''; position:absolute; inset:3px; border-radius:13px;
      background:linear-gradient(165deg, rgba(48,34,10,.985), rgba(14,9,2,.995)); }
  /* 전설 전용 치장 — 금테 초상화 · 황금 배너 · 리벳 네 개 · 훑고 지나가는 광택 */
  #gachaCard.g-legend .front { --fr:#ffd76a; --halo:.34; --haloSpd:6s; }
  #gachaCard.g-legend .gPortrait { border-width:4px;
      box-shadow:inset 0 0 30px rgba(0,0,0,.9), 0 0 22px rgba(255,196,77,.75), 0 3px 12px rgba(0,0,0,.8); }
  #gachaCard.g-legend .gPortrait::after { background:
      radial-gradient(circle at 50% 40%, transparent 42%, rgba(60,30,0,.5) 80%, rgba(0,0,0,.85) 100%); }
  #gachaCard.g-legend .gIcon { font-size:86px; animation:gIconBob 2.6s ease-in-out infinite; }
  @keyframes gIconBob { 0%,100% { transform:translateY(0) scale(1) } 50% { transform:translateY(-5px) scale(1.05) } }
  #gachaCard.g-legend .gBanner { background:linear-gradient(180deg,#d9ac3e 0%,#8a5f14 48%,#4a2f06 100%);
      border-top-color:#ffeaa6; border-bottom-color:#3a2405;
      box-shadow:0 3px 14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,246,214,.6), 0 0 22px rgba(255,196,77,.35); }
  #gachaCard.g-legend .gBanner::before, #gachaCard.g-legend .gBanner::after {
      background:linear-gradient(180deg,#e8bd52,#5a3a08); }
  #gachaCard.g-legend .gName { color:#fff8dc; text-shadow:0 2px 4px #000, 0 0 14px rgba(255,214,110,.9); }
  #gachaCard.g-legend .gGem { width:34px; height:34px; margin-left:-17px; top:183px;
      box-shadow:0 0 26px var(--g,#fff), inset 0 0 10px rgba(255,255,255,.7), 0 2px 8px rgba(0,0,0,.8); }
  #gachaCard.g-legend .gCorner { opacity:1; width:15px; height:15px; }
  #gachaCard.g-legend .gCost { border-color:#ffe9a6;
      background:radial-gradient(circle at 36% 30%, #fff6d8 0%, #e0a828 42%, #6a4408 100%);
      box-shadow:0 0 18px rgba(255,196,77,.85), inset 0 -4px 9px rgba(0,0,0,.55); }
  #gachaCard.g-legend .gCost span { text-shadow:0 2px 3px #000, 0 0 9px #ffd76a; }
  /* 카드 위를 훑는 홀로그램 광택 — 글자를 덮지 않게 좁고 옅게 */
  #gachaCard.g-legend .front::after { content:''; position:absolute; inset:0; z-index:5; pointer-events:none; border-radius:16px;
      background:linear-gradient(112deg, transparent 43%, rgba(255,246,214,.16) 50%, transparent 57%);
      background-size:280% 100%; animation:gSheen 2.8s ease-in-out infinite; }
  /* 본문 바탕은 확실히 어둡게 — 금테와 대비가 있어야 글자가 읽힌다 */
  #gachaCard.g-legend .gFrame::after { background:linear-gradient(168deg, rgba(32,22,6,.99) 0%, rgba(10,6,1,.995) 62%, rgba(26,17,4,.99) 100%); }
  .gDup .isnew { color:#8ef0c8; text-shadow:0 0 12px rgba(142,240,200,.8); }
  .gDup .dup   { color:#c8a2ff; }
  /* 공개 순간 터지는 링 */
  #gachaBurst { position:absolute; width:120px; height:120px; border-radius:50%; border:3px solid var(--g,#fff);
               opacity:0; pointer-events:none; }
  #gachaBurst.go { animation:gBurst .62s ease-out; }
  @keyframes gBurst { 0% { transform:scale(.35); opacity:.95 } 100% { transform:scale(7.5); opacity:0 } }
  /* 화면 전체 플래시 */
  #gachaFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #gachaFlash.go { animation:gFlash .5s ease-out; }
  @keyframes gFlash { 0% { opacity:.92 } 100% { opacity:0 } }
  /* 등급 상승 티저 */
  #gachaTease { position:absolute; top:22%; font-size:38px; font-weight:bold; letter-spacing:10px;
               color:var(--g,#fff); text-shadow:0 0 26px var(--g,#fff), 0 0 60px var(--g,#fff); opacity:0; pointer-events:none; }
  #gachaTease.go  { animation:gTease 1.1s ease-out; }
  #gachaTease.big { font-size:66px; letter-spacing:16px; animation:gTeaseBig 1.5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes gTease { 0% { opacity:0; transform:scale(.55) } 30% { opacity:1; transform:scale(1.14) } 100% { opacity:0; transform:scale(1.4) } }
  @keyframes gTeaseBig { 0% { opacity:0; transform:scale(.3) rotate(-7deg) } 22% { opacity:1; transform:scale(1.25) rotate(2deg) }
                         55% { opacity:1; transform:scale(1.05) rotate(0deg) } 100% { opacity:0; transform:scale(1.5) } }

  /* 승급 직전 안으로 빨려드는 링 — 터지기 전에 힘을 모으는 구간 */
  #gachaImplode { position:absolute; width:620px; height:620px; border-radius:50%;
               border:3px solid var(--g,#fff); box-shadow:0 0 46px var(--g,#fff), inset 0 0 46px var(--g,#fff);
               opacity:0; pointer-events:none; }
  #gachaImplode.go { animation:gImplode .62s cubic-bezier(.55,0,.8,.1) forwards; }
  @keyframes gImplode { 0% { transform:scale(1.7); opacity:0 } 18% { opacity:.95 } 100% { transform:scale(.06); opacity:1 } }
  /* 겹겹이 쌓이는 보조 소환진 — 등급이 오를수록 문양이 늘어난다 */
  .gRuneX { position:absolute; border-radius:50%; border:1px solid var(--g,#fff);
               box-shadow:0 0 26px var(--g,#fff); opacity:0; transition:opacity .5s ease, transform .7s ease; }
  #gachaRune2 { width:552px; height:552px; border-style:dashed; animation:gRuneSpin 9s linear infinite reverse; }
  #gachaRune3 { width:684px; height:684px; border-width:2px; animation:gRuneSpin 15s linear infinite; }
  /* 떨림 — 여기서 더 올라갈지 말지 모른다 */
  #gachaRune.tremble { animation:gRuneSpin 6s linear infinite, gTremble .11s linear infinite; }
  @keyframes gTremble { 0%,100%{margin:0 0 0 0} 25%{margin:-3px 0 0 3px} 50%{margin:2px 0 0 -3px} 75%{margin:3px 0 0 2px} }
  /* 방사형 스파크 */
  #gachaSparks { position:absolute; width:0; height:0; pointer-events:none; }
  .gSpark { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--g,#fff);
               box-shadow:0 0 14px var(--g,#fff), 0 0 30px var(--g,#fff); opacity:0; }
  .gSpark.go { animation:gSparkFly .8s ease-out forwards; }
  @keyframes gSparkFly { 0% { opacity:1; transform:translate(0,0) scale(1.4) }
                         100% { opacity:0; transform:translate(var(--dx,0),var(--dy,0)) scale(.15) } }
  /* 피어오르는 영기 — 등급이 오를수록 짙어진다 */
  #gachaMotes { position:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:0; transition:opacity .6s ease; }
  .gMote { position:absolute; bottom:-24px; border-radius:50%; background:var(--g,#fff);
               box-shadow:0 0 10px var(--g,#fff); animation:gMoteUp linear infinite; }
  @keyframes gMoteUp { 0% { transform:translate(0,0) scale(.5); opacity:0 }
                       14% { opacity:.9 } 78% { opacity:.45 }
                       100% { transform:translate(var(--mx,0),-800px) scale(.2); opacity:0 } }
  /* 승급 직전 안으로 빨려드는 입자 — 힘을 모으는 게 눈에 보인다 */
  #gachaPulls { position:absolute; width:0; height:0; pointer-events:none; }
  .gPull { position:absolute; width:5px; height:5px; border-radius:50%; background:var(--g,#fff);
               box-shadow:0 0 12px var(--g,#fff); opacity:0; }
  .gPull.go { animation:gPullIn .62s cubic-bezier(.45,0,.9,.45) forwards; }
  @keyframes gPullIn { 0% { transform:translate(var(--px,0),var(--py,0)) scale(1.1); opacity:0 }
                       22% { opacity:1 }
                       100% { transform:translate(0,0) scale(.15); opacity:0 } }
  /* 개봉 후 흩날려 내려앉는 가루 */
  #gachaDust { position:absolute; width:0; height:0; pointer-events:none; }
  .gDust { position:absolute; width:5px; height:5px; border-radius:50%; background:var(--g,#fff);
               box-shadow:0 0 9px var(--g,#fff); opacity:0; }
  .gDust.go { animation:gDustFall 2.1s ease-out forwards; }
  @keyframes gDustFall { 0% { opacity:0; transform:translate(var(--dx,0),-60px) scale(1.3) }
                         16% { opacity:.95 }
                         100% { opacity:0; transform:translate(var(--dx2,0),340px) scale(.25) } }
  /* 확정 등급에 따라 배경이 물든다 */
  #gachaOv { transition:background .7s ease; }
  #gachaOv.tRare   { background:radial-gradient(ellipse at center, rgba(12,44,80,.95) 0%, rgba(3,7,16,.99) 70%); }
  #gachaOv.tEpic   { background:radial-gradient(ellipse at center, rgba(56,22,86,.95) 0%, rgba(8,3,16,.99) 70%); }
  #gachaOv.tLegend { background:radial-gradient(ellipse at center, rgba(104,68,10,.96) 0%, rgba(14,7,1,.99) 70%); }
  /* 흔들림 */
  #gachaStage.shakeS { animation:gShake .3s ease-out; }
  #gachaStage.shakeL { animation:gShake .62s ease-out; }
  @keyframes gShake { 0%,100%{transform:translate(0,0)} 15%{transform:translate(-13px,7px)} 30%{transform:translate(11px,-9px)}
                      45%{transform:translate(-9px,-6px)} 60%{transform:translate(7px,8px)} 80%{transform:translate(-4px,3px)} }
  #gachaProg { position:absolute; bottom:34px; font-size:14px; color:#a89888; letter-spacing:3px; text-shadow:0 1px 3px #000; }
  #gachaSkip { position:absolute; top:22px; right:26px; z-index:2; }
  /* 마지막 요약 */
  #gachaSummary { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
                  background:rgba(6,4,12,.95); gap:14px; }
  #gachaSummary.hidden { display:none; }
  #gachaSummary h2 { font-family:serif; font-size:34px; letter-spacing:6px; color:#e8d0a0; text-shadow:0 0 26px rgba(255,150,60,.45); }
  #gsGrid { display:grid; grid-template-columns:repeat(5,124px); gap:10px; }
  .gsCell { border:2px solid var(--g,#fff); border-radius:11px; background:rgba(26,20,38,.9); padding:10px 6px; text-align:center;
            box-shadow:0 0 18px var(--g,#fff); animation:gPop .34s cubic-bezier(.3,1.7,.5,1) backwards; }
  @keyframes gPop { 0% { transform:scale(.4); opacity:0 } 100% { transform:scale(1); opacity:1 } }
  .gsCell.c-common { border-width:1px; box-shadow:0 0 8px rgba(159,180,160,.3); }
  .gsCell.c-epic   { border-width:2px; box-shadow:0 0 24px var(--g,#fff); }
  .gsCell.c-legend { border-width:3px; box-shadow:0 0 34px var(--g,#fff), 0 0 60px rgba(255,196,77,.35);
                     background:linear-gradient(165deg, rgba(56,40,10,.95), rgba(18,12,3,.95)); }
  .gsCell .i { font-size:32px; filter:drop-shadow(0 0 8px var(--g,#fff)); }
  .gsCell .n { font-size:11.5px; color:#e8d8b8; margin-top:4px; line-height:1.3; }
  .gsCell .t { font-size:10px; color:var(--g,#fff); letter-spacing:2px; margin-top:3px; }
  .gsCell .new { font-size:10px; color:#8ef0c8; font-weight:bold; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- ============ 사냥 HUD ============ -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="bar"><div class="fill" id="hpfill"></div><div class="txt" id="hptext"></div></div>
      <div class="bar" style="height:14px"><div class="fill" id="expfill"></div><div class="txt" id="exptext" style="line-height:14px;font-size:10px"></div></div>

const NUM_UNITS = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
function fmtNum(n) {
  n = Math.floor(n);
  if (!isFinite(n)) return '∞';
  const neg = n < 0 ? '-' : '';
  let v = Math.abs(n);
  if (v < 10000) return neg + v;
  let u = -1;
  while (v >= 1000 && u < NUM_UNITS.length - 1) { v /= 1000; u++; }
  if (v >= 1000) return neg + Math.abs(n).toExponential(2);
  const s = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  return neg + s + NUM_UNITS[u];
}

const Audio_ = {
  ctx: null, master: null, on: true, noiseBuf: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.35;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.on = false; }
  },
  tone(f0, f1, dur, type, vol, delay = 0) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, q = 1, type = 'bandpass', f1 = null) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
};

/* ============================ Combat 코어 ============================ */
// 메이플식 레벨 차이 페널티: 내 레벨이 몹보다 낮으면 레벨당 딜 감소 (오버강화해도 상위 지역은 도전이 됨)
function levelFactor(mobLv) {

}
// opts: { mult(필수 대신 raw), skill, element(강제), stacks, kb, kbDir, hitstop, noHitstop, noCrit, isBurnTick }
function dealDamage(e, mult, opts = {}) {

  const lvF = e.boss ? Math.max(0.5, levelFactor(e.lv)) : levelFactor(e.lv);   // 보스는 페널티 절반만
  // 균열의 각인: 아이템으로 붙는 추가 취약분
  const vulnMult = e.vulnT > 0 ? 1.2 + itemPow('vuln') : 1;
  let dmg = Math.max(1, Math.round(statAtk() * dmgMultAll() * mult * vulnMult * lvF * itemDmgVs(e) * rebirthWallPlayerDmgMult(run.region) * rand(0.9, 1.1) * (crit ? critMultOf() : 1)));

      player.hp = Math.min(player.maxHp, player.hp + heal);
      if (Math.random() < 0.25) popDmg(player.x, player.y - player.h - 24, '+' + fmtNum(heal), '#ff7a9a', 14);

  addCombo();

}
function applyElement(e, elem, stacks) {

    e.burnT = E.life;

function updateElements(dt) {

/* 피해를 줄 때 상황별로 붙는 배수 — 처형 / 기습 / 거인 사냥꾼 / 군집 */

  if (curve) {
    const endLen = Math.hypot(curve.ex - ox, curve.ey - oy) || range;
    dx = (curve.ex - ox) / endLen; dy = (curve.ey - oy) / endLen;
  }
  p.gunnerBeam = { x: ox, y: oy, dx, dy, range, width, tier, curve, t: (p.gunnerBeam?.t || 0) + dt };
  p.gunnerBeamTick = (p.gunnerBeamTick || 0) + dt;
  const tick = (tier >= 5 ? 0.085 : tier >= 4 ? 0.105 : 0.13) / statAs();
  if (p.gunnerBeamTick >= tick) {
    p.gunnerBeamTick -= tick;
    let hitAny = false;
    for (const e of enemies) {
      if (e.dead || e.spawnInvuln > 0) continue;
      const ex = e.x, ey = e.y - e.h / 2;
      let dist = Infinity;
      if (curve) {
        let prev = { x: ox, y: oy };
        for (let si = 1; si <= 14; si++) {
          const t = si / 14;
          const qx = (1 - t) * (1 - t) * ox + 2 * (1 - t) * t * curve.cx + t * t * curve.ex;
          const qy = (1 - t) * (1 - t) * oy + 2 * (1 - t) * t * curve.cy + t * t * curve.ey;
          dist = Math.min(dist, distToSegment(ex, ey, prev, { x: qx, y: qy }));
          prev = { x: qx, y: qy };
        }
      } else {
        const along = (ex - ox) * dx + (ey - oy) * dy;
        if (along < 0 || along > range) continue;
        const px = ox + dx * along, py = oy + dy * along;
        dist = Math.hypot(ex - px, ey - py);
      }
      if (dist < width + e.w * 0.35) {
        hitAny = true;
        dealDamage(e, (0.16 + tier * 0.028) * (tier >= 5 ? 1.18 : 1), { skill: false, kb: 0, noHitstop: true, tickColor: '#8fd8ff' });
        addGunnerStack(1);
      }
    }
    if (hitAny) sfx('throw');
  }
  return true;
}
function spawnGunnerExplosion(x, y, r, dmg, big = false) {
  let hit = false;
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    if (Math.hypot(e.x - x, (e.y - e.h / 2) - y) < r + e.w / 2) {
      hit = true;
      dealDamage(e, dmg, { skill: true, kb: big ? 360 : 240, hitstop: CONFIG.hitstop.skill });
    }
  }
  zones.push({ kind: 'gunBlast', x, y, r, t: 0, life: big ? 0.5 : 0.36, big });
  burst(x, y, big ? 26 : 16, big ? '#ffd06a' : '#ff9a4a', { spd: big ? 380 : 280, rise: true, life: 0.58, size: big ? 6 : 4.5 });
  shake(hit ? (big ? 8 : 5) : 3, 0.16);
  sfx('boom');
}
function placeGunnerTurret(tier) {
  const p = player;
  const x = clamp(p.x + p.facing * 34, 36, run.mapW - 36);
  zones.push({
    kind: 'turret', x, y: p.y, t: 0, life: tier >= 5 ? 9999 : 5.4 + tier * 0.65 + (tier >= 4 ? 2.4 : 0),

  });
  showSkillMsg('설치기 배치 · ' + activeGunnerTurrets() + '/' + gunnerTurretMax());
  burst(p.x + p.facing * 34, p.y - 18, 10, '#8fd8ff', { spd: 120, life: 0.35, size: 3 });

}
function summonLaserDrone(tier, stackSpend = 0) {
  const p = player;
  const count = tier >= 5 ? 2 : 1;
  const active = zones.filter(z => z.kind === 'laserDrone' && !z.dead);
  for (const z of active) z.dead = true;
  for (let i = 0; i < count; i++) {
    const side = i === 0 ? -1 : 1;
    zones.push({
      kind: 'laserDrone',
      x: p.x - p.facing * 42 + side * 28,
      y: p.y - 78 - i * 10,
      t: 0,
      life: 4.0 + tier * 0.45 + stackSpend * 0.32 + (tier >= 4 ? 1.0 : 0),
      tickT: i * 0.12,
      tick: tier >= 4 ? 0.32 : 0.42,
      range: 420 + tier * 55,
      dmg: 0.7 + tier * 0.13,   // 레이저를 약화한 만큼 드론 화력을 올려 X 스킬의 비중을 키운다
      tier,
      side,
      target: null,
      scanT: 0,
    });
  }
  showSkillMsg('레이저 드론 ' + count + '기 소환!');
  burst(p.x, p.y - 72, 14 + count * 5, '#8fd8ff', { spd: 150, rise: true, life: 0.45, size: 4 });
  sfx('ult');
}
function tryGunnerSkill() {
  const p = player;
  const s = meta.skills.gunner;
  if (p.ultCd > 0) return;
  if (!s.branch || s.tier < 1) { showSkillMsg('메카닉 빌드를 먼저 습득하자'); sfx('error'); return; }
  const tier = s.tier;
  if (s.branch === 'move') {
    const stackSpend = consumeGunnerStacks();
    summonLaserDrone(tier, stackSpend);
    p.ultCdMax = CONFIG.ult.cd * 0.34 * (tier >= 4 ? 0.72 : 1) * cdMult();
    p.ultCd = p.ultCdMax;
    shake(3 + tier * 0.5, 0.14);
    return;
  } else {
    if (!consumeGunnerStackOne()) { showSkillMsg('부품 필요 · 공격 적중 10회로 충전'); sfx('error'); return; }
    const turrets = zones.filter(z => z.kind === 'turret' && !z.dead);
    if (turrets.length >= gunnerTurretMax()) {
      const old = turrets.sort((a, b) => b.t - a.t)[0];
      if (old) {
        old.dead = true;
        burst(old.x, old.y - 18, 8, '#8fd8ff', { spd: 95, rise: true, life: 0.28, size: 3 });
      }
    }
    placeGunnerTurret(tier);
    p.ultCdMax = (0.55 - Math.min(0.18, tier * 0.03)) * cdMult();
    p.ultCd = p.ultCdMax;
    shake(2 + tier * 0.4, 0.1);
    return;
  }
}
/* ============================ 섬영(閃影) — 관성 이동 · 회전베기 · 집중 / 칼날폭풍 ============================ */
/* 섬영이 받은 이속 배수 원본 (스탯 + 성소 버프) */
function bladeMsRaw() {
  return statMs() * (player.shrineBuffT > 0 ? CONFIG.shrine.pMs : 1);
}
/* 실제 속도에 쓰이는 몫 — 100%에서 잘린다. 더 빨라지지 않는 대신 아래 surplus가 피해로 간다 */
function bladeMsK() { return Math.min(1, bladeMsRaw()); }
/* 100%를 넘겨 속도로는 못 쓰는 초과분. 최고 속도에서의 피해 배수로 환산된다 */
function bladeMsSurplus() { return Math.max(0, bladeMsRaw() - 1); }
function bladeMaxSpeed() { return CONFIG.blade.maxSpeed * bladeMsK(); }
function bladeBaseSpeed() { return CONFIG.blade.baseSpeed * bladeMsK(); }
/* 가속·제동은 이속의 '제곱'으로 키운다.
   목표 속도까지 필요한 거리는 v²/(2a) 이므로, a가 v²에 비례해야 최고속 도달 거리가 일정해진다.
   선형으로만 키우면 이속을 올릴수록 활주로가 길어져 맵 안에서 최고속에 닿지 못한다. */
function bladeAccelK() { const k = bladeMsK(); return k * k; }
function bladeSpeedRatio() { return clamp(Math.abs(player.vx) / bladeMaxSpeed(), 0, 1); }
function bladeAtTop() { return bladeSpeedRatio() >= CONFIG.blade.topAt; }
/* 속도가 곧 피해: 정지 ×1 → 최고 속도 ×(1+spdDmg).
   100%를 넘긴 이속은 속도로 나가지 못하므로 여기서 계수로 더해진다 — 빨라지는 대신 세진다. */
function bladeDmgMult() {
  const B = CONFIG.blade;
  return 1 + bladeSpeedRatio() * (B.spdDmg + bladeMsSurplus() * B.spdDmgPerMs);
}
/* 최고 속도 충돌 무적 — 집중 2층 또는 칼날폭풍 3층 중 하나만 찍어도 상시 적용 */
function bladeCrashImmune() {
  return meta.weapon === 'blade' && bladeAtTop() && (bladeTier('move') >= 2 || bladeTier('conv') >= 3);
}
/* 방향키를 누르고 있는 동안(어느 방향이든) 피격 무적 — 스킬·티어 무관 상시 적용 */
function bladeDirInvuln() {
  return meta.weapon === 'blade' &&
    (Input.has('left') || Input.has('right') || Input.has('up') || Input.has('down'));
}

/* ---- 관성 이동: 같은 방향 유지 = 가속 / 무입력 = 감속 / 반대 입력 = 브레이크 없이 즉시 반전 ---- */
function bladeMove(dt, mx) {
  const p = player, B = CONFIG.blade;
  const maxS = bladeMaxSpeed();
  const focusing = p.focusT > 0;
  const t2 = bladeTier('move') >= 2;
  // 이속 스탯만큼 가속도도 함께 커져야 최고속 도달 '거리'가 유지된다
  const msA = bladeAccelK();
  const baseS = bladeBaseSpeed();
  const accelMul = (focusing ? B.focus.accelMul * (t2 ? B.focus.accelMul2 : 1) : 1) * msA;
  if (mx === 0) {
    const s = Math.max(0, Math.abs(p.vx) - B.decel * msA * dt);
    p.vx = Math.sign(p.vx) * s;
  } else if (mx === p.runDir && Math.sign(p.vx) === mx) {
    const s = Math.max(Math.abs(p.vx), baseS);
    p.vx = mx * Math.min(s + B.accel * accelMul * dt, maxS);
  } else {
    // 방향전환: 속도(달리기)는 그대로 유지한 채 방향만 즉시 뒤집는다.
    // baseS로 깎으면 순간이지만 여전히 감속으로 느껴지므로, 갖고 있던 속도를 그대로 반대로 돌린다.
    p.runDir = mx;
    p.vx = mx * Math.max(Math.abs(p.vx), baseS);
  }
  if (mx !== 0) p.facing = mx;
}

/* ---- 회전베기: 이동 중 키다운으로 연속 시전 ---- */
// lifesteal: 기본공격(bladeSpinTick)에서만 true — 칼날폭풍 스킬 중 재사용(아래 storm 루프)은 흡혈 대상이 아니다
function bladeSpinHit(dmgMult, r, skipGrabbed, lifesteal) {
  const p = player;
  const cy = p.y - p.h / 2;
  let hit = 0, totalDmg = 0;
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    if (skipGrabbed && e.grabbed) continue;
    if (Math.hypot(e.x - p.x, (e.y - e.h / 2) - cy) < r + e.w / 2) {
      totalDmg += dealDamage(e, dmgMult * bladeDmgMult(), {
        skill: true, kb: 110, kbDir: Math.sign(e.x - p.x) || p.facing, noHitstop: true, tickColor: '#bfe8ff',
      });
      hit++;
    }
  }
  if (lifesteal && totalDmg > 0) bladeLifesteal(totalDmg);
  return hit;
}
/* 회전베기로 입힌 피해의 일부를 체력으로 회복 */
function bladeLifesteal(dmg) {
  const p = player;
  const heal = Math.round(dmg * CONFIG.blade.lifesteal);
  if (heal <= 0) return;
  const before = p.hp;
  p.hp = Math.min(p.maxHp, p.hp + heal);
  const actual = p.hp - before;
  if (actual > 0) {
    popDmg(p.x, p.y - p.h - 24, '+' + actual, '#ff7a9a', 15);
    burst(p.x, p.y - p.h / 2, 4, '#ff8aa8', { spd: 110, rise: true, life: 0.4, size: 3 });
  }
}
function bladeSpinTick(dt, held) {
  const p = player, S = CONFIG.blade.spin;
  p.bladeSpin = Math.max(0, p.bladeSpin - dt);
  if (!held || p.atkCds.blade > 0) return;
  p.atkCds.blade = S.cd / Math.max(0.35, statAs());
  p.bladeSpin = 0.2;
  if (bladeSpinHit(S.dmg, S.r, false, true)) sfx('slash');
}

/* ---- 집중: 시간 감속 + 가속도 증가 (재사용으로 중단) ---- */
/* 스킬 진입 함수는 상태를 돌려준다 — 'ok' 성사 / 'retry' 조건이 곧 갖춰질 수 있음(선입력 유지) / 'fail' 불가 */
function bladeFocusStart() {
  const p = player, F = CONFIG.blade.focus, tier = bladeTier('move');
  if (tier <= 0) return 'fail';
  if (p.focusT > 0) { p.focusT = 0; return 'ok'; }
  if (p.focusCd > 0) { sfx('error'); return 'fail'; }
  if (tier >= 5 && p.trailPts.length > 1) bladeRipTrail();
  p.focusT = F.dur;
  p.focusCd = F.cd;
  if (tier >= 4) p.vx = (p.runDir || p.facing) * bladeMaxSpeed();
  p.trailT = bladeTrailLife(); p.trailPts = [];   // 궤적은 1층부터 열린다
  showSkillMsg('🕛 집중');
  shake(4, 0.15);
  sfx('ult');
  return 'ok';
}
/* 3층 '짙은 잔영'이 궤적의 지속·피해·굵기를 한 단계 키운다 */
function bladeTrailLife() { const F = CONFIG.blade.focus; return F.trailLife * (bladeTier('move') >= 3 ? F.t3Life : 1); }
function bladeTrailDmg() { const F = CONFIG.blade.focus; return F.trailDmg * (bladeTier('move') >= 3 ? F.t3Dmg : 1); }
function bladeTrailR() { const F = CONFIG.blade.focus; return F.trailR * (bladeTier('move') >= 3 ? F.t3R : 1); }
/* ---- 궤적: 집중 사용 후 경로에 남고, 시간이 끝나면 한꺼번에 찢어진다 ---- */
function bladeTrailUpdate(dt) {
  const p = player, F = CONFIG.blade.focus;
  if (bladeTier('move') < 1) { p.trailPts.length = 0; p.trailT = 0; return; }
  if (p.trailT > 0) {
    p.trailT -= dt;
    const last = p.trailPts[p.trailPts.length - 1];
    const cy = p.y - p.h / 2;
    if (!last || Math.hypot(p.x - last.x, cy - last.y) > 24) {
      p.trailPts.push({ x: p.x, y: cy });
      if (p.trailPts.length > 240) p.trailPts.shift();
    }
    if (p.trailT <= 0) { bladeRipTrail(); return; }
  }
  if (!p.trailPts.length) return;
  p.trailTick = (p.trailTick || 0) + dt;
  if (p.trailTick < F.trailTick) return;
  p.trailTick -= F.trailTick;
  const tr = bladeTrailR(), td = bladeTrailDmg();
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    const ey = e.y - e.h / 2;
    for (const pt of p.trailPts) {
      if (Math.hypot(e.x - pt.x, ey - pt.y) < tr + e.w / 2) {
        dealDamage(e, td, { skill: true, noCrit: true, noHitstop: true, kb: 0, tickColor: '#9fe8ff' });
        break;
      }
    }
  }
}
function bladeRipTrail() {
  const p = player, F = CONFIG.blade.focus;
  if (!p.trailPts.length) { p.trailT = 0; return; }
  if (bladeTier('move') >= 4) {
    let hit = 0;
    const ripR = bladeTrailR() * 1.7;
    for (const e of enemies) {
      if (e.dead || e.spawnInvuln > 0) continue;
      const ey = e.y - e.h / 2;
      for (const pt of p.trailPts) {
        if (Math.hypot(e.x - pt.x, ey - pt.y) < ripR + e.w / 2) {
          dealDamage(e, F.ripDmg * bladeDmgMult(), { skill: true, kb: 280, hitstop: 0.03, tickColor: '#e8faff' });
          hit++;
          break;
        }
      }
    }
    for (const pt of p.trailPts) if (Math.random() < 0.4) burst(pt.x, pt.y, 3, '#bfe8ff', { spd: 220, life: 0.42, size: 3.4 });
    if (hit) { shake(8, 0.22); sfx('boom'); showSkillMsg('✂️ 궤적 파열 · ' + hit + '명'); }
  }
  p.trailPts = [];
  p.trailT = 0;
}
/* 5층: 최고 속도로 적을 통과할 때마다 집중 쿨타임 감소 */
function bladePassTick() {
  const p = player;
  if (bladeTier('move') < 5 || !bladeAtTop()) return;
  if (!p.spinHits) p.spinHits = new Map();
  const cy = p.y - p.h / 2;
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    if (Math.abs(e.x - p.x) < (e.w + p.w) / 2 && Math.abs((e.y - e.h / 2) - cy) < (e.h + p.h) / 2) {
      const last = p.spinHits.get(e) || -9;
      if (state.time - last > 0.5) {
        p.spinHits.set(e, state.time);
        p.focusCd = Math.max(0, p.focusCd - CONFIG.blade.focus.cdRedPerPass);
      }
    }
  }
}

/* ---- 칼날폭풍: 회전베기를 유지한 채 30도 아래로 활공 (플랫폼 통과) ---- */
function bladeStormStart() {
  const p = player, S = CONFIG.blade.storm, tier = bladeTier('conv');
  if (tier <= 0) return 'fail';
  if (p.storm) { bladeStormEnd(); return 'ok'; }   // 재사용 취소는 지상/공중 무관
  // 공중에서만 시전 — 지상에서 쓰면 즉시 착지 판정이 나 활공이 성립하지 않는다.
  // 곧 점프로 떠오를 수 있으므로 실패가 아니라 '선입력 유지'로 돌려준다.
  if (p.onGround) return 'retry';
  if (p.stormCd > 0) { sfx('error'); return 'fail'; }
  const dir = p.runDir || p.facing;
  p.storm = { dir, t: 0, spd: Math.max(Math.abs(p.vx), bladeBaseSpeed()), hitT: 0 };
  p.stormGrab = [];
  p.stormCd = S.cd;
  p.onGround = false;
  p.dropTimer = 0.05;
  showSkillMsg('🌪️ 칼날폭풍');
  sfx('ult');
  return 'ok';
}
function bladeStormEnd() {
  const p = player;
  if (!p.storm) return;
  for (const g of p.stormGrab) {
    const e = g.e;
    if (e && !e.dead) { e.grabbed = false; e.stormFall = true; e.fallVy = 0; }
  }
  p.stormGrab = [];
  p.storm = null;
}
function bladeStormLand() {
  const p = player, S = CONFIG.blade.storm;
  let hit = 0;
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    if (Math.hypot(e.x - p.x, (e.y - e.h / 2) - (p.y - 24)) < S.landR + e.w / 2) {
      dealDamage(e, S.landDmg * bladeDmgMult(), {
        skill: true, kb: 320, kbDir: Math.sign(e.x - p.x) || p.facing, hitstop: CONFIG.hitstop.skill, tickColor: '#bfe8ff',
      });
      hit++;
    }
  }
  zones.push({ kind: 'gravityBurst', x: p.x, y: p.y - 24, r: S.landR, t: 0, life: 0.34, critical: true });
  burst(p.x, p.y - 16, 26, '#bfe8ff', { spd: 340, rise: true, life: 0.55, size: 5 });
  shake(10, 0.26);
  sfx('boom');
  if (hit) showSkillMsg('💥 낙하 충격 · ' + hit + '명');
}
function bladeStormUpdate(dt) {
  const p = player, S = CONFIG.blade.storm, W = CONFIG.world, tier = bladeTier('conv');
  const st = p.storm;
  st.t += dt;
  // 5층: 점프키로 중단 대신 수직 도약 + 쿨타임 반환
  if (tier >= 5 && Input.just('jump')) {
    const vy = S.hopVy - st.spd * S.hopSpdK;
    bladeStormEnd();
    p.vy = vy;
    p.onGround = false;
    p.stormCd = 0;
    burst(p.x, p.y - 10, 16, '#bfe8ff', { spd: 260, rise: true, life: 0.45, size: 4 });
    showSkillMsg('🕊️ 곡예비행');
    sfx('jump');
    return;
  }
  const ang = S.angle * Math.PI / 180;
  st.spd = Math.min(st.spd + S.accel * bladeAccelK() * dt, bladeMaxSpeed() * 1.4);
  const vx = st.dir * st.spd * Math.cos(ang);
  const vy = st.spd * Math.sin(ang);
  p.vx = vx; p.vy = 0; p.facing = st.dir; p.runDir = st.dir;
  const nx = p.x + vx * dt;
  p.y = p.y + vy * dt;   // 플랫폼 통과 (충돌 판정 없음)
  if (nx <= 24 || nx >= run.mapW - 24) {
    p.x = clamp(nx, 24, run.mapW - 24);
    if (tier >= 3) {
      st.dir *= -1; p.runDir = st.dir;
      burst(p.x, p.y - 26, 12, '#bfe8ff', { spd: 240, life: 0.35, size: 3.6 });
      sfx('slash');
    } else { bladeStormEnd(); return; }
  } else p.x = nx;
  // 4층: 부딪히는 적을 붙잡고 이동
  if (tier >= 4) {
    const cy = p.y - p.h / 2;
    for (const e of enemies) {
      if (p.stormGrab.length >= S.grabMax) break;
      if (e.dead || e.spawnInvuln > 0 || e.boss || e.shrine || e.grabbed) continue;
      if (Math.hypot(e.x - p.x, (e.y - e.h / 2) - cy) < 74 + e.w / 2) {
        e.grabbed = true;
        p.stormGrab.push({ e, ox: rand(-30, 30), oy: rand(-24, 12) });
      }
    }
    for (const g of p.stormGrab) {
      const e = g.e;
      if (!e || e.dead) continue;
      e.x = clamp(p.x + g.ox, 24, run.mapW - 24);
      e.y = clamp(p.y + g.oy, 60, W.groundY);
      e.kbx = 0;
    }
  }
  // 회전베기 지속
  st.hitT += dt;
  if (st.hitT >= 0.11) {
    st.hitT -= 0.11;
    bladeSpinHit(S.dmg, CONFIG.blade.spin.r * 1.15, true);
  }
  if (Math.random() < 0.6) burst(p.x, p.y - 26, 1, '#bfe8ff', { spd: 60, life: 0.3, size: 3 });
  // 바닥 도달
  if (p.y >= W.groundY) {
    p.y = W.groundY; p.onGround = true;
    if (tier >= 2) bladeStormLand();
    bladeStormEnd();
    return;
  }
  if (st.t >= S.maxDur) bladeStormEnd();
}
/* 붙잡혔다 놓인 적: 플랫폼 무시하고 추락, 바닥에 닿을 때 피해 */
function bladeFallingUpdate(dt) {
  const W = CONFIG.world, S = CONFIG.blade.storm;
  for (const e of enemies) {
    if (e.dead || !e.stormFall) continue;
    e.fallVy = (e.fallVy || 0) + W.gravity * dt;
    e.y += e.fallVy * dt;
    if (e.y >= W.groundY) {
      e.y = W.groundY;
      e.stormFall = false; e.fallVy = 0;
      dealDamage(e, S.fallDmg * bladeDmgMult(), { skill: true, kb: 100, hitstop: 0.02, tickColor: '#ffd76e' });
      burst(e.x, e.y - 8, 12, '#ffd76e', { spd: 220, life: 0.45, size: 3.8 });
    }
  }
}
function tryBladeSkill() {
  const branch = meta.skills.blade?.branch;
  if (branch === 'move' && bladeTier('move') >= 1) return bladeFocusStart();
  if (branch === 'conv' && bladeTier('conv') >= 1) return bladeStormStart();
  showSkillMsg('전문화를 선택하면 스킬이 열린다');
  sfx('error');
  return 'fail';
}

// 발판을 벗어난 뒤에도 점프를 받아주는 유예 / 조건이 안 될 때 입력을 붙잡아두는 시간
const COYOTE_T = 0.10;
const INPUT_BUF_T = 0.13;

const BLADE_REST_ANG = -0.42;   // 회전이 멎었을 때 앞칼을 겨누는 각도
// 두 칼의 벌어진 각. 정확히 180°면 한 줄이 되어 '몸을 관통한 막대기'로 보인다.
const BLADE_SWORD_SEP = Math.PI * 0.92;
/* ---- 자세 상태: 공중↔지상↔착지↔회전을 끊김 없이 잇는 보간값 ---- */
function bladePoseTick(dt, wasAir, impactVy) {
  const p = player;
  // 공중 체류도 (0=완전 지상, 1=완전 공중) — 다리를 접는 정도에 쓰인다
  const airTarget = p.onGround ? 0 : 1;
  p.airK = (p.airK || 0) + (airTarget - (p.airK || 0)) * Math.min(1, dt * (p.onGround ? 14 : 8));
  // 착지 반동 — 낙하가 빠를수록 깊고 길게 웅크린다
  if (wasAir && p.onGround && impactVy > 240) {
    p.landT = 0.09 + Math.min(0.16, impactVy / 1500 * 0.16);
    p.landMax = p.landT;
    p.landPow = clamp(impactVy / 1150, 0.3, 1);
  }
  p.landT = Math.max(0, (p.landT || 0) - dt);
  // 회전 강도 — 공격/폭풍 중 차오르고, 멈추면 서서히 잦아든다
  const spinning = p.bladeSpin > 0 || !!p.storm;
  const tgt = spinning ? 1 : 0;
  p.spinPow = (p.spinPow || 0) + (tgt - (p.spinPow || 0)) * Math.min(1, dt * (spinning ? 20 : 6));
  if (spinning) {
    p.spinAng = (p.spinAng || 0) + dt * 30;
  } else {
    // 누적각을 그대로 섞으면 각도가 튄다 → 가장 가까운 대기 자세로 감아 정렬한다
    const rest = BLADE_REST_ANG;
    const turns = Math.round(((p.spinAng || 0) - rest) / (Math.PI * 2));
    const target = rest + turns * Math.PI * 2;
    p.spinAng = (p.spinAng || 0) + (target - (p.spinAng || 0)) * Math.min(1, dt * 9);
  }
}

/* ---- 섬영 전용 플레이어 갱신 ---- */
function updateBladePlayer(dt) {
  const p = player, W = CONFIG.world;
  const realDt = state.rawDt !== undefined ? state.rawDt : dt;
  p.focusCd = Math.max(0, p.focusCd - realDt);
  p.stormCd = Math.max(0, p.stormCd - realDt);
  if (p.focusT > 0) p.focusT = Math.max(0, p.focusT - realDt);

  // ---- 선입력 버퍼 & 코요테 타임 ----
  // 고속 캐릭터라 발판을 놓치거나 착지 직전 입력이 씹히는 일이 잦다.
  // 입력을 잠시 붙잡아두고, 발판을 벗어난 직후에도 점프를 허용한다.
  if (Input.just('jump')) p.jumpBufT = INPUT_BUF_T;
  if (Input.just('ult')) p.skillBufT = INPUT_BUF_T;
  p.jumpBufT = Math.max(0, (p.jumpBufT || 0) - realDt);
  p.skillBufT = Math.max(0, (p.skillBufT || 0) - realDt);
  p.coyoteT = p.onGround ? COYOTE_T : Math.max(0, (p.coyoteT || 0) - realDt);

  // 활공 중 재입력은 즉시 취소 — 버퍼로 미룰 성질이 아니다
  if (p.storm && p.skillBufT > 0) { p.skillBufT = 0; p.skillPending = false; bladeStormEnd(); }

  const held = Input.has('atkBow') || Input.mouseAttack;
  p.prevAttackHeld = held;

  // 칼날폭풍 중에는 전용 이동/공격만
  if (p.storm) {
    bladeStormUpdate(dt);
    bladeTrailUpdate(dt);
    bladeFallingUpdate(dt);
    bladePassTick();
    // 활공이 바닥에 닿아 끝났다면 강한 착지 반동으로 이어붙인다
    const stormLanded = !p.storm && p.onGround;
    bladePoseTick(dt, true, stormLanded ? 1400 : 0);
    if (Math.random() < 0.8) p.afterimages.push({ x: p.x, y: p.y, f: p.facing, t: 0 });
    return;
  }

  bladeSpinTick(dt, held);

  // 좌우가 동시에 눌린 순간(방향전환 시 새 키를 먼저 누르고 원래 키를 나중에 떼는 경우)엔
  // 단순 상쇄(1-1=0)로 두면 그 프레임에 감속 분기를 타 최고속 상태가 풀린다.
  // 방금 누른 키를 우선해 끊김 없이 즉시 반대 방향으로 넘어가게 한다.
  if (Input.just('right')) p.lastHDir = 1;
  if (Input.just('left')) p.lastHDir = -1;
  const heldR = Input.has('right'), heldL = Input.has('left');
  const mx = heldR && heldL ? (p.lastHDir || 0) : heldR ? 1 : heldL ? -1 : 0;
  bladeMove(dt, mx);
  if (mx !== 0 && p.onGround) p.walkCycle += dt * 11;

  // 코요테 타임 + 선입력으로 점프 성사
  if (p.jumpBufT > 0 && (p.onGround || p.coyoteT > 0)) {
    if (Input.has('down') && p.onGround && p.y < W.groundY - 2) {
      p.dropTimer = 0.22; p.vy = 140; p.onGround = false;
    } else {
      p.vy = CONFIG.player.jumpVel; p.onGround = false; sfx('jump');
    }
    p.jumpBufT = 0; p.coyoteT = 0;   // 코요테를 소모해 이중 점프를 막는다
  }

  // 스킬은 점프 뒤에 판정 — 그래야 '점프+X 동시 입력'에서 칼날폭풍이 산다
  if (p.skillBufT > 0) {
    const r = tryBladeSkill();
    if (r === 'retry') p.skillPending = true;
    else { p.skillBufT = 0; p.skillPending = false; }
  } else if (p.skillPending) {
    p.skillPending = false;                       // 끝내 조건이 안 갖춰졌을 때만 안내
    showSkillMsg('공중에서만 사용할 수 있다');
    sfx('error');
  }

  p.vy += W.gravity * dt;
  p.vy = Math.min(p.vy, 1500);
  const nx = p.x + p.vx * dt;
  p.x = clamp(nx, 24, run.mapW - 24);
  if (nx !== p.x) p.vx = 0;                 // 벽에 부딪히면 정지
  const prevY = p.y;
  const wasAir = !p.onGround;
  const impactVy = p.vy;                    // 착지 강도 (지면 처리 전에 보관)
  p.y += p.vy * dt;
  p.onGround = false;
  if (p.vy >= 0) {
    if (p.y >= W.groundY) { p.y = W.groundY; p.vy = 0; p.onGround = true; }
    else if (p.dropTimer <= 0) {
      for (const pl of platforms) {
        if (prevY <= pl.y && p.y >= pl.y && p.x > pl.x - 6 && p.x < pl.x + pl.w + 6) {
          p.y = pl.y; p.vy = 0; p.onGround = true; break;
        }
      }
    }
  }
  bladePoseTick(dt, wasAir, impactVy);

  bladeTrailUpdate(dt);
  bladeFallingUpdate(dt);
  bladePassTick();
  if (bladeSpeedRatio() > 0.55 && Math.random() < bladeSpeedRatio() * 0.7) {
    p.afterimages.push({ x: p.x, y: p.y, f: p.facing, t: 0 });
  }
}

function tryUlt() {
  if (meta.weapon === 'bow') { tryMageSkill(); return; }
  if (meta.weapon === 'gunner') { tryGunnerSkill(); return; }
  if (meta.weapon === 'blade') { tryBladeSkill(); return; }
  if (meta.weapon === 'druid') { tryDruidSkill(); return; }
  const p = player;
  if (p.ultCd > 0 || p.ultActive) return;
  const cands = enemies.filter(e => !e.dead && !(e.spawnInvuln > 0));
  if (!cands.length) { showSkillMsg('대상이 없다'); sfx('error'); return; }
  p.ultActive = { strikes: CONFIG.ult.strikes, t: 0, interval: CONFIG.ult.interval, done: 0, originX: p.x, originY: p.y };
  p.attacking = false; p.charging = false;
  state.freeze = Math.max(state.freeze, 0.12);
  shake(6, 0.3);
  sfx('ult');
}
function updateUlt(dt) {
  const p = player, u = p.ultActive;
  if (!u) return;
  u.t += dt;
  if (u.t >= u.interval) {
    u.t -= u.interval;
    const cands = enemies.filter(e => !e.dead && !(e.spawnInvuln > 0));
    if (cands.length) {
      const onScreen = cands.filter(e => e.x > camera.x - 40 && e.x < camera.x + CONFIG.canvas.w + 40);
      const pool = onScreen.length ? onScreen : cands;
      const target = pool[randInt(0, pool.length - 1)];
      // 순간이동 참격
      p.afterimages.push({ x: p.x, y: p.y, f: p.facing, t: 0 });
      p.x = clamp(target.x - Math.sign(target.x - p.x || 1) * 40, 24, run.mapW - 24);
      p.y = Math.min(CONFIG.world.groundY, target.y);
      p.facing = Math.sign(target.x - p.x) || 1;
      p.vy = 0;
      dealDamage(target, CONFIG.ult.dmg, { skill: false, hitstop: 0.05, kb: 200 });   // 비기는 속성(도트) 미부여
      burst(target.x, target.y - target.h / 2, 10, '#e8d8ff', { spd: 280, size: 4, life: 0.4 });
      shake(4, 0.12);
      sfx('slash');
      // 혈참(출혈 1차): 주변 AoE + 출혈
      if (hasTier('ult', 'move', 1)) {
        const A = CONFIG.ult.bleedAoe;
        for (const e of enemies) {
          if (e.dead || e === target) continue;
          if (Math.hypot(e.x - target.x, (e.y - e.h / 2) - (target.y - target.h / 2)) < A.r) {
            dealDamage(e, A.dmg, { skill: true, element: 'bleed', stacks: A.stacks, noHitstop: true });
          }
        }
        if (!target.dead) applyElement(target, 'bleed', A.stacks);
      }
      // 염화병(화상 1차): 불길 생성
      if (hasTier('ult', 'conv', 1)) {
        zones.push({ kind: 'fire', x: target.x, y: Math.min(target.y, CONFIG.world.groundY), t: 0, tickT: 0, life: CONFIG.ult.fire.life });
      }
    }
    u.done++;
    if (u.done >= u.strikes) endUlt();
  }
}
function endUlt() {
  const p = player;
  const u = p.ultActive;
  // 마지막에 시작 위치로 순간 복귀
  if (u) {
    p.afterimages.push({ x: p.x, y: p.y, f: p.facing, t: 0 });
    p.x = clamp(u.originX, 24, run.mapW - 24);
    p.y = u.originY;
    p.vy = 0;
    burst(p.x, p.y - 30, 12, '#e8d8ff', { spd: 220, rise: true, life: 0.5 });
  }
  p.ultActive = null;
  p.ultCdMax = CONFIG.ult.cd * cdMult();
  p.ultCd = p.ultCdMax;
  p.invuln = Math.max(p.invuln, 0.5);
  // 대혈문: 모든 출혈 스택 2배
  if (hasTier('ult', 'move', 3)) {
    for (const e of enemies) {
      if (e.dead || !e.bleedS) continue;
      e.bleedS = Math.min(CONFIG.elem.bleed.maxStacks, e.bleedS * 2);
      e.bleedT = CONFIG.elem.bleed.life;
      checkBleedExecute(e);
    }
    showSkillMsg('대혈문 — 출혈 스택 2배!');
  }
  // 대폭염: 화상 소모 폭발
  if (hasTier('ult', 'conv', 3)) {
    let any = false;
    for (const e of enemies) {
      if (e.dead || !e.burnS) continue;
      any = true;
      const s = e.burnS; e.burnS = 0;
      dealDamage(e, CONFIG.ult.burnExplode * s, { noCrit: true, skill: false, hitstop: 0.03 });
      burst(e.x, e.y - e.h / 2, 14, '#ff9a4a', { spd: 240, rise: true, life: 0.6 });
    }
    if (any) { showSkillMsg('대폭염 — 화상 폭발!'); shake(8, 0.3); sfx('boom'); }
  }
}

/* ============================ 무기 전환 (키 즉발 — 교체 개념 없음) ============================ */
function switchWeapon(w) {
  if (meta.weapon === w) return;
  meta.weapon = w;
  player.charging = false; player.chargeT = 0;
  buildSlots();
}

/* ============================ 드루이드 ============================ */
const druidTier = branch => curTier('druid', branch);
function druidBranch() { return meta.skills.druid?.branch || null; }
function druidCurTier() { const b = druidBranch(); return b ? druidTier(b) : 0; }
/* 마나 최대치 — 1차 20에서 티어당 +20 (5차 100). 스킬 소모량은 고정이라 티어가 곧 연속 사용 횟수 */
function druidManaMax() {
  const M = CONFIG.druid.mana;
  return M.base + M.perTier * Math.max(0, druidCurTier() - 1);
}
/* 동시 유지 늑대 상한 — 전문화 단계마다 늘어난다 (1차 5 → 5차 10) */
function druidWolfMax() {
  const t = clamp(druidCurTier(), 1, 5);
  return CONFIG.druid.wolf.maxByTier[t - 1] || CONFIG.druid.wolf.maxByTier[0];
}
/* 3차부터 늑대 몸집(과 타격판정)이 커진다 */
function druidWolfSizeMul() { return druidCurTier() >= 3 ? CONFIG.druid.wolf.sizeMul : 1; }
function druidWolfHitR() { return CONFIG.druid.wolf.r * druidWolfSizeMul(); }
function druidAddMana(n) {
  const p = player;
  p.mana = clamp((p.mana || 0) + n, 0, druidManaMax());
}
/* 평타·늑대 적중으로 채우는 회복량은 '최대치 비율'이라 마나통이 커져도 체감이 유지된다 */
function druidGainPct(pct) { druidAddMana(druidManaMax() * pct); }

/* ---- 늑대 소환수 ---- */
/* 소환 지점 아래의 발판을 찾아 그 좌우 끝까지를 늑대의 사냥터로 잠근다.
   발판이 없으면 바닥 전체가 사냥터가 된다. */
function druidFindGround(x, y) {
  let best = null;
  for (const pl of platforms) {
    if (x < pl.x - 6 || x > pl.x + pl.w + 6) continue;
    if (pl.y < y - 4) continue;                       // 발밑(아래쪽)에 있는 발판만
    if (!best || pl.y < best.y) best = pl;             // 그중 가장 가까운(높은) 것
  }
  if (best) return { x0: best.x, x1: best.x + best.w, y: best.y };
  return { x0: 24, x1: run.mapW - 24, y: CONFIG.world.groundY };
}
/* pounce=true면 소환되자마자 근처 적에게 덮치고, 그 적의 발판이 사냥터가 된다 */
function druidSpawnWolf(pounce) {
  const p = player, W = CONFIG.druid.wolf;
  // 상한을 넘으면 가장 오래된 늑대가 사라진다 — 이게 사실상의 재배치 수단
  while (p.wolves.length >= druidWolfMax()) p.wolves.shift();
  const prey = pounce ? nearestEnemy(CONFIG.druid.dash.range) : null;
  // 덮칠 적이 있으면 그 적의 발판을, 없으면 소환 지점 발판을 사냥터로 삼는다
  const home = prey ? druidFindGround(prey.x, prey.y) : druidFindGround(p.x, p.y);
  const w = {
    x: clamp(p.x + rand(-30, 30), 24, run.mapW - 24),
    y: p.y, vy: 0, onGround: false, home,
    facing: p.facing, life: W.life, dashCd: rand(0, 0.3),
    target: prey || null, walk: 0, pounce: null, trail: [],
  };
  if (prey) druidWolfPounce(w, prey);
  p.wolves.push(w);
  burst(p.x, p.y - 16, 12, '#8fe0b0', { spd: 200, rise: true, life: 0.45, size: 3.6 });
}
/* 늑대가 목표에게 뛰어오른다 — 발판이 달라도 이 동작으로만 건너간다 */
function druidWolfPounce(w, t) {
  const D = CONFIG.druid.dash;
  const side = w.x <= t.x ? -1 : 1;
  const tx = clamp(t.x + side * D.gap, w.home.x0 + 8, w.home.x1 - 8);
  const ty = w.home.y;
  const dist = Math.hypot(tx - w.x, ty - w.y);
  w.pounce = {
    fromX: w.x, fromY: w.y, tx, ty,
    t: 0, dur: Math.max(0.12, Math.min(0.38, dist / D.speed)),
    // 멀리 뛸수록 높게 — 짧은 도약도 최소 22px는 떠오른다
    arc: clamp(22 + dist * 0.22, 22, 74),
    hit: new Set(), trailT: 0,
  };
  w.trail = [];
  w.facing = -side;
  w.target = t;
  w.dashCd = CONFIG.druid.wolf.dashCd * 0.5;
  // 도약 시작 — 발밑에서 기운이 튄다
  addDruidFx({ kind: 'leap', x: w.x, y: w.y, f: w.facing, life: 0.26 });
}
/* X 스킬을 쓰면 이미 있던 늑대들도 전부 가장 가까운 적에게 함께 돌진한다 — 무리 총출격 */
function druidWolfPounceAll() {
  const p = player;
  for (const w of p.wolves) {
    if (w.pounce) continue;
    let t = druidWolfPickTarget(w);
    if (!t) t = nearestEnemyFrom(w.x, w.y - 20, CONFIG.druid.dash.range);
    if (!t) continue;
    // 사냥터 밖의 적이면 그 발판으로 무리를 재배치한다
    if (t.x < w.home.x0 || t.x > w.home.x1) w.home = druidFindGround(t.x, t.y);
    druidWolfPounce(w, t);
  }

const druidFx = [];

function druidClawFx(x, y, facing, finisher) {

  burst(x, y, finisher ? 8 : 4, '#ffffff', { spd: finisher ? 400 : 280, size: 2.6, life: 0.18 });

function drawDruidFx() {
  for (const s of druidFx) {
    const k = s.t / s.life, fade = 1 - k;
    const x = s.x - camera.x, y = s.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (s.kind === 'ring') {
      const r = s.r0 + (s.r1 - s.r0) * (1 - Math.pow(1 - k, 2));
      ctx.strokeStyle = 'rgba(' + (s.col || '150,235,185') + ',' + (0.75 * fade) + ')';
      ctx.lineWidth = 3.4 * fade + 0.8;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
    } else if (s.kind === 'claw') {
      // 발톱 세 줄이 벌어지며 지나간다
      const sc = s.s || 1;
      ctx.translate(x, y); ctx.scale(s.f * sc, sc);
      for (let c = -1; c <= 1; c++) {
        ctx.strokeStyle = 'rgba(210,255,225,' + (0.9 * fade) + ')';
        ctx.lineWidth = (2.6 * fade + 0.7) / sc;
        ctx.beginPath();
        ctx.moveTo(-16 - k * 6, c * 9 - 12 - k * 4);
        ctx.quadraticCurveTo(0, c * 11, 16 + k * 6, c * 9 + 12 + k * 4);
        ctx.stroke();
      }
    } else if (s.kind === 'flash') {
      // 마무리타 순간의 하얀 섬광
      const r = 30 + k * 40;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.75 * fade) + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    } else if (s.kind === 'mana') {
      // 마나 회복 — 위로 떠오르는 알갱이
      for (let i = 0; i < 3; i++) {
        const ph = (k + i / 3) % 1;
        const ox = Math.sin((i * 2.1) + k * 7) * 7;
        ctx.fillStyle = 'rgba(143,224,176,' + (0.85 * (1 - ph)) + ')';
        ctx.beginPath(); ctx.arc(x + ox, y - ph * 26, 2.4 * (1 - ph) + 0.6, 0, 7); ctx.fill();
      }
    } else if (s.kind === 'leap') {
      // 도약 시작 — 바닥에서 튀는 기운
      ctx.strokeStyle = 'rgba(150,235,185,' + (0.7 * fade) + ')';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(x, y - 2, 16 + k * 22, 5 + k * 6, 0, 0, 7); ctx.stroke();
      for (let i = -1; i <= 1; i += 2) {
        ctx.beginPath();
        ctx.moveTo(x + i * 8, y - 4);
        ctx.lineTo(x + i * (14 + k * 16), y - 12 - k * 12);
        ctx.stroke();
      }
    } else if (s.kind === 'dust') {
      ctx.strokeStyle = 'rgba(190,230,200,' + (0.5 * fade) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y - 2, 10 + k * 24, 3 + k * 5, 0, 0, 7); ctx.stroke();
    } else if (s.kind === 'summon') {
      // 소환 룬 — 이중 링 + 회전하는 눈금
      const col = s.col || '143,224,176';
      const r = s.r0 + (s.r1 - s.r0) * (1 - Math.pow(1 - k, 2));
      ctx.strokeStyle = 'rgba(' + col + ',' + (0.85 * fade) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.ellipse(x, y - 4, r, r * 0.34, 0, 0, 7); ctx.stroke();
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(x, y - 4, r * 0.62, r * 0.21, 0, 0, 7); ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + k * 3;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r * 0.8, y - 4 + Math.sin(a) * r * 0.27);
        ctx.lineTo(x + Math.cos(a) * r, y - 4 + Math.sin(a) * r * 0.34);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}
/* 사냥터(소환된 발판) 위에 서 있는 적만 문다 — 다른 층 적은 아예 목표로 삼지 않는다 */
function druidWolfPickTarget(w) {
  const W = CONFIG.druid.wolf;

    if (e.x < w.home.x0 - 20 || e.x > w.home.x1 + 20) continue;   // 사냥터 밖
    if (Math.abs(e.y - w.home.y) > W.leashPad) continue;           // 다른 층

function druidUpdateWolves(dt) {
  const p = player, W = CONFIG.druid.wolf, tier = druidCurTier();

    const w = p.wolves[i];
    w.life -= dt;
    if (w.life <= 0) {

      p.wolves.splice(i, 1);

    }
    w.dashCd = Math.max(0, w.dashCd - dt);

    // ---- 도약: 늑대의 모든 공격은 적을 향해 뛰어오르는 동작이다 ----
    if (w.pounce) {
      const pc = w.pounce;
      pc.t += dt;
      const k = clamp(pc.t / pc.dur, 0, 1);
      w.x = pc.fromX + (pc.tx - pc.fromX) * k;
      w.y = pc.fromY + (pc.ty - pc.fromY) * k - Math.sin(k * Math.PI) * pc.arc;
      w.vy = 0;
      // 도약 잔상 — 뒤에 늑대 그림자가 줄지어 남는다
      pc.trailT = (pc.trailT || 0) + dt;
      if (pc.trailT >= 0.028) {
        pc.trailT = 0;
        if (!w.trail) w.trail = [];
        w.trail.push({ x: w.x, y: w.y, f: w.facing, t: 0 });
        if (w.trail.length > 8) w.trail.shift();
      }
      const hitR = druidWolfHitR();
      for (const e of enemies) {
        if (e.dead || e.spawnInvuln > 0 || pc.hit.has(e)) continue;
        if (Math.hypot(e.x - w.x, (e.y - e.h / 2) - (w.y - 20)) < hitR + e.w / 2) {
          pc.hit.add(e);
          dealDamage(e, W.dmg, { skill: true, kb: 160, kbDir: w.facing, hitstop: 0.03, tickColor: '#8fe0b0' });
          druidBiteFx(e.x, e.y - e.h / 2, w.facing);
          if (tier >= 5) druidGainPct(CONFIG.druid.mana.wolfHitPct);
        }
      }

      if (k >= 1) {
        w.pounce = null; w.y = w.home.y; w.onGround = true;
        addDruidFx({ kind: 'dust', x: w.x, y: w.y, life: 0.3 });   // 착지 흙먼지

      if (dist < W.dashRange && w.dashCd <= 0) {

        w.dashCd = W.dashCd;
      } else if (dist > 20) {
        w.x += Math.sign(dx) * W.speed * dt;

    } else {

/* Z 할퀴기 — 클로 공격 + 가장 가까운 늑대가 그 적에게 덮쳐 함께 문다 */
function druidClaw() {
  const p = player, C = CONFIG.druid.claw, W = CONFIG.druid.wolf, tier = druidCurTier();
  // 콤보 창이 지났으면 1타부터 다시 시작
  if ((p.druidComboT || 0) <= 0) p.druidCombo = 0;
  const ci = Math.min(p.druidCombo || 0, C.combo.length - 1);
  const c = C.combo[ci];
  const finisher = ci >= C.combo.length - 1;

  p.attacking = true; p.attackT = 0; p.attackDur = C.cd * (finisher ? 1.5 : 1);
  p.atkCds.druid = p.attackDur * 0.92 / Math.max(0.35, statAs());
  p.druidComboT = p.attackDur + C.comboWindow;
  p.druidComboIdx = ci;                       // 그리기용 — 타마다 궤적이 달라진다

  const x0 = p.facing > 0 ? p.x - C.back : p.x - C.range * (finisher ? 1.25 : 1);
  const reach = (C.range + C.back) * (finisher ? 1.25 : 1);
  const y0 = p.y - p.h / 2 - C.height / 2;
  let hit = 0, victim = null;
  for (const e of enemies) {
    if (e.dead || e.spawnInvuln > 0) continue;
    if (!rectsOverlap(x0, y0, reach, C.height, e.x - e.w / 2, e.y - e.h, e.w, e.h)) continue;
    dealDamage(e, c.dmg, { skill: false, kb: c.kb, kbDir: p.facing, hitstop: c.stop });
    druidClawFx(e.x - p.facing * 6, e.y - e.h / 2, p.facing, finisher);
    if (!victim && !e.dead) victim = e;        // 늑대가 덮칠 대상
    hit++;
  }
  sfx(finisher ? 'boom' : 'slash');
  p.druidCombo = finisher ? 0 : ci + 1;
  if (!hit) return 0;

  // 맞은 수만큼 화면이 흔들려 무게가 실린다
  shake(c.shake + Math.min(3, hit - 1), finisher ? 0.24 : 0.14);
  const manaBefore = p.mana;
  druidGainPct(CONFIG.druid.mana.atkGainPct);
  if (p.mana > manaBefore) addDruidFx({ kind: 'mana', x: p.x, y: p.y - p.h - 6, life: 0.5 });
  // 가장 가까운 늑대가 내가 때린 적에게 덮친다 (그 적의 발판이 새 사냥터가 된다)
  let near = null, nd = W.joinR;
  for (const w of p.wolves) {
    if (w.pounce) continue;                    // 이미 덮치는 중이면 건드리지 않는다
    const d = Math.hypot(w.x - p.x, w.y - p.y);
    if (d < nd) { nd = d; near = w; }
  }
  if (near) {
    near.life = Math.min(W.life, near.life + W.refill);
    if (victim) {
      near.home = druidFindGround(victim.x, victim.y);
      druidWolfPounce(near, victim);
    }
  }
  // 3차: 평타 적중마다 무리 전체의 지속시간이 늘어난다
  if (tier >= 3) for (const w of p.wolves) w.life = Math.min(W.life, w.life + W.allRefill);
  return hit;
}

/* ---- 맹금 변신 (마나 고정 소모, 드레인 없음) ---- */
function druidRaptorDash(chargeK) {
  const p = player, R = CONFIG.druid.raptor, tier = druidCurTier();
  let dx = (Input.has('right') ? 1 : 0) - (Input.has('left') ? 1 : 0);
  let dy = (Input.has('down') ? 1 : 0) - (Input.has('up') ? 1 : 0);
  if (dx === 0 && dy === 0) dx = p.facing;
  let len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  if (tier >= 3) {
    const t = nearestEnemyFrom(p.x, p.y - p.h / 2, R.homeR);
    if (t) {
      const tx = t.x - p.x, ty = (t.y - t.h / 2) - (p.y - p.h / 2);
      const tl = Math.hypot(tx, ty) || 1;
      dx = dx * (1 - R.homeK) + (tx / tl) * R.homeK;
      dy = dy * (1 - R.homeK) + (ty / tl) * R.homeK;
      const nl = Math.hypot(dx, dy) || 1; dx /= nl; dy /= nl;
    }
  }
  p.birdDash = { dx, dy, t: 0, dur: R.dashT, spd: R.dashSpd, hit: new Set(), startY: p.y };
  if (Math.abs(dx) > 0.01) p.facing = Math.sign(dx);
  if (tier >= 2) p.invuln = Math.max(p.invuln, R.dashT + 0.04);

}

/* X — 계열에 따라 늑대 소환 / 맹금 변신. 둘 다 마나 고정 소모 */

}

/* ---- 드루이드 전용 플레이어 갱신 ---- */
function updateDruidPlayer(dt) {
