/* CSS 애니메이션 재생 — 클래스를 뺐다가 리플로우를 강제해야 다시 돈다 */

/* ms 동안 기다린다. 화면을 누르면 즉시 넘어가고, 건너뛰기를 누르면 전부 취소된다 */
function gachaHold(ms, tapToSkip) {
  return new Promise(res => {
    const seq = gachaSeq;
    if (!seq || seq.cancelled) return res();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      seq.tap = null;
      const i = seq.finishers.indexOf(finish);
      if (i >= 0) seq.finishers.splice(i, 1);
      res();
    };
    const timer = setTimeout(finish, ms);
    seq.finishers.push(finish);
    if (tapToSkip) seq.tap = finish;
  });
}
function gachaCancelAll() {
  const seq = gachaSeq;
  if (!seq) return;
  seq.cancelled = true;
  seq.tap = null;
  for (const f of seq.finishers.slice()) f();
}
async function gachaReveal(list, freshSet) {

/* 한 칸이 확정되는 순간 — 빛이 터지고 색·문양·배경이 한꺼번에 올라간다 */

async function gachaPlayOne(id, idx, total, isNew) {
  const seq = gachaSeq;
  if (!seq || seq.cancelled) return;
  const it = ITEMS[id];
  const gi = GRADE_ORDER.indexOf(it.grade);
  const rune = $('gachaRune'), rays = $('gachaRays'), card = $('gachaCard'), stage = $('gachaStage');
  // 연출 속도 — 단독 뽑기는 항상 풀 연출.
  // 10연차에선 일반·희귀를 크게 압축하고, 영웅·전설만 거의 풀로 보여준다.
  const sp = total === 1 ? 1 : (gi <= 1 ? 0.38 : 0.78);

  // ---- 0. 초기화 ----
  card.classList.remove('flip', 'g-common', 'g-rare', 'g-epic', 'g-legend');
  card.style.transition = 'none';
  rune.style.transition = 'none';
  rune.style.opacity = '0';
  rune.style.transform = 'scale(.5)';
  rune.classList.remove('tremble');
  rays.style.transition = 'none';
  rays.style.opacity = '0';
  $('gachaRune2').style.opacity = '0';
  $('gachaRune3').style.opacity = '0';
  $('gachaOv').classList.remove('tRare', 'tEpic', 'tLegend');
  gachaSetColor('common');
  $('gachaProg').textContent = total > 1 ? (idx + 1) + ' / ' + total : '';
  void rune.offsetWidth;
  card.style.transition = '';
  await gachaHold(60);
  if (seq.cancelled) return;

  // ---- 1. 점화: 여기까지는 등급과 무관하게 전부 똑같이 보인다 ----
  rune.style.transition = 'opacity .45s ease, transform .9s cubic-bezier(.25,.9,.35,1)';
  rune.style.opacity = '.95';
  rune.style.transform = 'scale(1)';
  rays.style.transition = 'opacity .5s ease';
  rays.style.opacity = '.07';
  sfx('gCharge');
  await gachaHold(820 * sp, true);
  if (seq.cancelled) return;

  // ---- 2. 사다리: 무조건 '일반'에서 시작해 한 칸씩 올라간다 ----
  for (let s = 0; s <= gi && !seq.cancelled; s++) {
    if (s > 0) await gachaWindUp(sp);     // 떨림 → 빨려듦 → 정적
    if (seq.cancelled) return;
    gachaLandOn(s, s === gi);
    await gachaHold((s === gi && s >= 2 ? 900 : 620) * sp, true);
    if (s < gi) continue;
    await gachaSettle(sp);                // 마지막 칸 뒤 '혹시 더?' 여운
  }
  if (seq.cancelled) return;

  // ---- 3. 개봉 ----
  gachaFillCard(id, isNew);
  if (gi >= 2) replayAnim($('gachaFlash'), 'go');
  replayAnim($('gachaBurst'), 'go');
  replayAnim(stage, gi >= 3 ? 'shakeL' : 'shakeS');
  gachaSparkBurst(0.8 + gi * 0.45);
  gachaDustFall(0.5 + gi * 0.5);         // 개봉 뒤 가루가 흩날려 내려앉는다
  card.classList.add('g-' + it.grade);   // 등급마다 카드 생김새가 달라진다
  card.classList.add('flip');

}

  html += '<div class="upRow" style="border:1px solid #6a4a8a;border-radius:10px;background:rgba(60,30,80,.25);padding:14px;flex-wrap:wrap">' +
    '<span class="nm" style="width:auto;color:#e8c8ff;font-size:16px">☸ 윤회하기</span>' +
    '<span class="vl">정복 ' + clearedRegions() + '지역 &nbsp;→&nbsp; 획득 <b style="color:#c8a2ff;font-size:16px">' + fmtNum(gain) + ' ☸</b>' +
    (can ? '' : ' <span style="color:#806a6a">(보스를 최소 1지역은 잡아야 한다)</span>') + '</span>' +
    '<button class="btn primary" id="rebirthBtn"' + (can ? '' : ' disabled') + '>윤회 (' + meta.rebirths + '회째)</button>' +
    '<div style="flex-basis:100%;margin-top:8px">' + tbl + '</div></div>';

  // ---- 가챠 ----
  const poolLeft = gachaPool(null).length;
  const can1 = meta.rp >= GACHA_COST && poolLeft > 0;
  const can10 = meta.rp >= GACHA_COST * 10 && poolLeft > 0;
  html += '<div style="margin-top:14px;font-size:14px;color:#c8a2ff;font-weight:bold">☸ 기원 <span style="font-size:11px;color:#907898;font-weight:normal">— 1회 ' + GACHA_COST + ' ☸. 보유: <b style="color:#c8a2ff">' + fmtNum(meta.rp) + ' ☸</b> · 천장까지 ' + Math.max(0, PITY_AT - meta.pity) + '회</span></div>';
  html += '<div class="upRow" style="border:1px solid #5a4a7a;border-radius:10px;background:rgba(40,30,60,.3);flex-wrap:wrap">' +
    '<span class="vl" style="flex-basis:100%;font-size:11.5px;color:#a898b8">' +
      Object.entries(ITEM_GRADES).map(([k, g]) => '<b style="color:' + g.col + '">' + g.nm + ' ' + g.weight + '%</b> (최대 ' + g.cap + '중첩)').join(' · ') +
      '<br>중복 상한에 도달한 아이템은 후보에서 제외된다. ' + PITY_AT + '회 연속 영웅 이상이 없으면 다음은 영웅 이상 확정.</span>' +
    '<button class="btn primary" id="gacha1"' + (can1 ? '' : ' disabled') + '>1회 기원</button>' +
    '<button class="btn primary" id="gacha10"' + (can10 ? '' : ' disabled') + '>10회 기원</button></div>';
  if (lastPulls.length) {
    html += '<div style="margin-top:8px;font-size:12px;color:#a89888">최근 결과 — ' +
      lastPulls.map(id => '<b style="color:' + ITEM_GRADES[ITEMS[id].grade].col + '">' + ITEMS[id].icon + ' ' + ITEMS[id].nm + '</b>').join(', ') + '</div>';
  }

  // ---- 보유 아이템 ----
  html += '<div style="margin-top:16px;font-size:14px;color:#ffcf6e;font-weight:bold">器 아이템 <span style="font-size:11px;color:#a89060;font-weight:normal">— ' + itemKinds() + ' / ' + ITEM_IDS.length + '종 · 총 ' + itemTotal() + '개 보유</span></div>';
  for (const gk of GRADE_ORDER.slice().reverse()) {
    const g = ITEM_GRADES[gk];
    const ids = ITEM_IDS.filter(id => ITEMS[id].grade === gk);
    html += '<div style="margin-top:8px;font-size:12px;color:' + g.col + ';font-weight:bold">' + g.nm + ' <span style="color:#6a625a;font-weight:normal">최대 ' + g.cap + '중첩</span></div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px">';
    for (const id of ids) {
      const it = ITEMS[id], n = itemCount(id), full = n >= itemCap(id);
      const own = n > 0;
      html += '<div class="upRow" style="border:1px solid ' + (own ? g.col : '#3a3630') + ';border-radius:8px;background:' + (own ? 'rgba(40,36,50,.55)' : 'rgba(20,18,16,.5)') + ';margin:0;flex-wrap:wrap;opacity:' + (own ? 1 : 0.45) + '">' +
        '<span class="nm" style="width:auto;color:' + (own ? '#ffe9c0' : '#8a8278') + '">' + it.icon + ' ' + it.nm +
          (own ? ' <b style="color:' + g.col + '">×' + n + '</b>' + (full ? ' <span style="color:#8ef0c8;font-size:10px">MAX</span>' : '') : ' <span style="font-size:10px">미보유</span>') +
          (it.kind === 'special' ? ' <span style="font-size:10px;color:#c8a2ff">특수</span>' : '') + '</span>' +
        '<span class="vl" style="flex-basis:100%;font-size:11px;color:#b8a888">' +
          (own ? it.fmt(itemCurValue(id)) : '개당 ' + it.fmt(it.kind === 'stat' && it.mul ? it.per : it.per)) + '</span>' +
        '</div>';
    }
    html += '</div>';
  }
  if (meta.rebirths > 0) html += '<div style="font-size:12px;color:#706050;margin-top:10px">윤회 ' + meta.rebirths + '회 · 누적 처치 ' + fmtNum(meta.totalKills) + '마리 · 누적 기원 ' + fmtNum(meta.stats.pulls) + '회</div>';
  return html;
}
function renderSpecTab() {
  const w = specWeapon;
  const s = meta.skills[w];
  const specHelp = SPEC[w].help;
  let html = '<div class="specHead"><b style="color:#ffe9c0;font-size:15px">' + WEAPONS[w].icon + ' ' + WEAPONS[w].nm + ' 전문화</b>' +
    '<span>남은 SP: <b class="spc">' + spAvail() + '</b> (레벨업마다 +1)</span>' +
    (s.element ? '<span class="elemBadge ' + s.element + '">' + SPEC[w].elem + '</span>' : '') +
    '</div>' +
    '<div style="font-size:11.5px;color:#807060;margin-bottom:10px">' + specHelp + ' <span style="color:#a89880">모든 빌드는 첫 단계부터 X 스킬을 사용할 수 있다.</span></div>';
  html += '<div id="specWrap">' + renderTree(w, 'move') + renderTree(w, 'conv') + '</div>';
  html += '<div style="margin-top:12px;text-align:right"><button class="btn" id="respecBtn">현재 캐릭터 전문화 초기화 (SP 환급)</button></div>';
  return html;
}
function renderTree(w, branch) {
  const T = SPEC[w][branch];
  const s = meta.skills[w];
  const blocked = s.branch !== null && s.branch !== branch;
  const chosen = s.branch === branch;
  let html = '<div class="tree ' + (branch === 'conv' ? 'rt' : '') + (chosen ? ' chosen' : '') + (blocked ? ' blockedT' : '') + '">' +
    '<h3>' + branchIcon(w, branch) + ' ' + T.nm + (chosen ? ' — 선택' : '') + '</h3><div class="tag">' + branchIcon(w, branch) + ' ' + T.tag + '</div>';
  T.tiers.forEach((t, i) => {
    const tierN = i + 1;
    const learned = chosen && s.tier >= tierN;
    const prevOk = i === 0 || (chosen && s.tier >= i) || (s.branch === null && i === 0);
    const seqOk = s.branch === null ? i === 0 : s.tier === i;
    const canLearn = !learned && !blocked && seqOk && spAvail() >= t.cost;
    if (i > 0) html += '<div class="conn">▼</div>';
    html += '<div class="node' + (learned ? ' learned' : canLearn ? ' avail' : '') + '">' +
      '<div class="nm">' + branchIcon(w, branch) + ' ' + t.nm + '</div><div class="ds">' + t.ds + '</div>';
    if (!learned) {
      if (blocked) html += '<div class="lock">✕ 다른 갈래를 선택했다</div>';
      else if (!seqOk) html += '<div class="lock">🔒 이전 단계 필요</div>';
      else html += '<button class="btn" data-learn="' + w + '" data-branch="' + branch + '" data-tier="' + tierN + '"' +
        (spAvail() < t.cost ? ' disabled' : '') + '>습득 (SP ' + t.cost + ')</button>' +
        (spAvail() < t.cost ? ' <span class="lock">SP 부족</span>' : '');
    }
    html += '</div>';
  });
  return html + '</div>';
}
function learnSkill(w, branch, tier) {
  const s = meta.skills[w];
  const T = SPEC[w][branch];
  const node = T.tiers[tier - 1];
  const cost = node.cost;
  if (spAvail() < cost) return;
  if (s.branch !== null && s.branch !== branch) return;
  if ((s.branch === null && tier !== 1) || (s.branch !== null && s.tier !== tier - 1)) return;
  if (w === 'bow') {
    s.element = w === 'bow' && branch === 'move' ? 'burn' : null;
  }
  s.branch = branch; s.tier = tier;
  charProg().spUsed += cost;
  sfx('learn');
  saveMeta();
  renderLobby();
}
function respecAll() {
  const keys = specWeapon === 'bow' ? ['bow'] : [specWeapon];
  for (const k of keys) {
    if (!meta.skills[k]) continue;
    meta.skills[k].branch = null;
    meta.skills[k].tier = 0;
    // 속성 각인은 유지하지 않고 함께 초기화
    if ('element' in meta.skills[k]) meta.skills[k].element = null;
  }
  charProg().spUsed = 0;
  sfx('learn');
  saveMeta();
  renderLobby();
}
function buyGoldUpgrade(k, qty) {
  let bought = 0;
  const limit = qty === 'max' ? 10000 : parseInt(qty || '1', 10);
  while (bought < limit) {
    const cost = upCost(k);
    if (meta.gold < cost) break;
    meta.gold -= cost;
    meta.upgrades[k]++;
    bought++;
  }
  return bought;
}

/* --- 로비 이벤트 (위임) --- */
$('lobby').addEventListener('click', e => {
  firstInteract();
  const tab = e.target.closest('.tabbtn');
  if (tab) { lobbyTab = tab.dataset.tab; renderLobby(); return; }
  const upQty = e.target.closest('button[data-upqty]');
  if (upQty) { cycleUpgradeQty(parseInt(upQty.dataset.upqty, 10)); sfx('coin'); return; }
  const previewBtn = e.target.closest('button[data-char-preview]');
  if (previewBtn) {
    charPreview = previewBtn.dataset.charPreview;
    renderLobby();
    sfx('coin');
    return;
  }
  const selectBtn = e.target.closest('button[data-char-select]');
  if (selectBtn) {
    const next = selectBtn.dataset.charSelect;
    if (CHARACTERS[next]) {
      meta.character = next;
      meta.weapon = CHARACTERS[next].weapon;
      specWeapon = meta.weapon;
      charPreview = next;
    }
    lobbyTab = 'upgrade';
    saveMeta();
    renderLobby();
    sfx('learn');
    return;
  }
  if (e.target.closest('button[data-char-back]')) {
    charPreview = meta.character;
    lobbyTab = 'upgrade';
    renderLobby();
    sfx('coin');
    return;
  }
  const st = e.target.closest('button[data-stage]');
  if (st && !st.disabled) { startRun(parseInt(st.dataset.stage), st.dataset.mode); return; }
  const up = e.target.closest('button[data-up]');
  if (up && !up.disabled) {
    const k = up.dataset.up;
    const bought = buyGoldUpgrade(k, upgradeBuyQty);
    if (bought > 0) { toast(CONFIG.upgrades[k].nm + ' +' + bought + '강'); sfx('learn'); saveMeta(); renderLobby(); }
    return;
  }
  if (e.target.id === 'gacha1' && !e.target.disabled) { doGacha(1); return; }
  if (e.target.id === 'gacha10' && !e.target.disabled) { doGacha(10); return; }
  if (e.target.id === 'migrateOk') { delete meta.migrateRefund; saveMeta(); renderLobby(); return; }
  if (e.target.id === 'rebirthBtn') { doRebirth(); return; }
  const ln = e.target.closest('button[data-learn]');
  if (ln && !ln.disabled) { learnSkill(ln.dataset.learn, ln.dataset.branch, parseInt(ln.dataset.tier)); return; }
  if (e.target.id === 'respecBtn') { respecAll(); return; }
});
$('lbCheat').addEventListener('click', () => {
  charProg().level += 500; meta.gold += 1e15; meta.rp += 5000;
  toast('🧪 테스트 지급 — 현재 캐릭터 레벨 +500 · 골드 +1Qa · 윤회 포인트 +5,000');
  saveMeta(); renderLobby();
});
$('lbCharSelect').addEventListener('click', () => {
  charPreview = meta.character;
  lobbyTab = 'character';
  renderLobby();
  sfx('coin');
});
$('lbMute').addEventListener('click', toggleMute);
$('lbReset').addEventListener('click', () => {
  if (confirm('모든 진행(골드/레벨/스킬/지역)을 초기화할까?')) {
    meta = defaultMeta(); saveMeta(); renderLobby();
  }
});
$('btnToLobby').addEventListener('click', toLobby);
$('btnResume').addEventListener('click', resumeRun);
// ---- 기원 연출 조작: 화면을 누르면 다음, 건너뛰기는 전부 생략 ----
$('gachaOv').addEventListener('click', e => {
  if (e.target.closest('#gachaSkip') || e.target.closest('#gsClose')) return;
  const seq = gachaSeq;
  if (seq && seq.tap) seq.tap();
});
$('gachaSkip').addEventListener('click', e => {
  e.stopPropagation();
  const seq = gachaSeq;
  if (!seq) return;
  gachaCancelAll();
  if (lastPulls.length > 1) {
    const fresh = new Set();   // 건너뛴 뒤 요약에선 NEW 표시를 생략한다
    gachaShowSummary(lastPulls.slice().sort((a, b) => GRADE_ORDER.indexOf(ITEMS[a].grade) - GRADE_ORDER.indexOf(ITEMS[b].grade)), fresh);
  } else gachaClose();
});
$('gsClose').addEventListener('click', e => { e.stopPropagation(); gachaClose(); });
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); firstInteract();
  if (state.scene !== 'run') return;
  if (e.button === 2) { Input.pressed.add('ult'); return; }   // 우클릭 = 비기
  Input.mouseAttack = true; Input.pressed.add('attack');       // 좌클릭 = 현재 무기 공격
});
window.addEventListener('mouseup', () => Input.mouseAttack = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ============================ 게임 루프 ============================ */
let interacted = false;
function firstInteract() {
  if (interacted) return;
  interacted = true;
  Audio_.init();
  if (meta.muted) { Audio_.on = false; $('lbMute').textContent = '소리 OFF'; }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  updateShake(rawDt);
  let dt = rawDt;
  if (state.freeze > 0) { state.freeze -= rawDt; dt = 0; }
  if (state.scene !== 'run' || run.over) dt = 0;
  state.rawDt = dt;
  if (dt > 0) { state.time += dt; updateRun(dt); }
  Input.endFrame();
  render();
  if (state.scene === 'run') syncHUD();
}
function fitScreen() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  $('wrap').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fitScreen);

/* 초기화 */
loadMeta();
if (meta.muted) Audio_.on = false;
resetPlayerForRun();
renderLobby();
fitScreen();
requestAnimationFrame(frame);

/* 디버그 핸들 */
window.G = {
  player, enemies: () => enemies, projectiles: () => projectiles, zones: () => zones,
  pickups: () => pickups, state, run, meta: () => meta, CONFIG,
  spawnEnemyAt, spawnWave, spawnShrine, spawnBoss, startRun, endRun, toLobby,
  gainExp: gainExpMeta, saveMeta, renderLobby,
};
</script>
</body>
</html>
